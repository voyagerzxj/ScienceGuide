| 约 6.02 × 10²³ mol⁻¹；1 mol 任何粒子含 Nₐ 个粒子，使用时必须指明粒子种类 |\n| 摩尔质量 | M | g/mol | 数值等于相对原子（分子）质量，如 M(H₂O) = 18 g/mol |\n| 气体摩尔体积 | Vₘ | L/mol | 标准状况（0 ℃、101 kPa）下约 22.4 L/mol，只适用于气体 |\n| 物质的量浓度 | c | mol/L | 指溶液体积，不是溶剂体积 |\n\n### 6.1 常见陷阱（Nₐ 选择题）\n\n- 标准状况下 H₂O、SO₃、CCl₄、乙醇不是气体，不能用 22.4 L/mol。\n- “常温常压”下 22.4 L 气体不是 1 mol；但质量换算粒子数与状况无关。\n- 弱电解质部分电离、盐类水解会使离子数变化；只给浓度不给体积时无法计算粒子数。\n- 可逆反应（如 2NO₂ ⇌ N₂O₄，N₂ + 3H₂ ⇌ 2NH₃）不能进行到底。\n- 转移电子数：1 mol Cl₂ 与 NaOH 反应转移 1 mol e⁻；1 mol Na₂O₂ 与 H₂O 或 CO₂ 反应转移 1 mol e⁻。\n\n### 6.2 一定物质的量浓度溶液的配制\n\n1. 计算 → 称量（或量取）→ 在烧杯中溶解并冷却至室温 → 转移入容量瓶 → 洗涤烧杯和玻璃棒 2–3 次并转移 → 定容（加水至刻度线下 1–2 cm 改用胶头滴管）→ 摇匀。\n2. 容量瓶只有一条刻度线，常见规格 100 mL、250 mL、500 mL、1000 mL；使用前要检查是否漏水。\n3. 误差分析用 c = n / V：未洗涤烧杯使 n 偏小→ c 偏小；定容时俯视使 V 偏小→ c 偏大；未冷却就定容使 c 偏大。\n\n### 6.3 常用推论\n\n- 同温同压下，气体体积比 = 物质的量之比；密度比 = 摩尔质量之比（阿伏加德罗定律）。\n- 稀释定律 c₁V₁ = c₂V₂。\n- 质量分数与物质的量浓度换算：c = 1000ρw / M（ρ 单位 g/cm³）。\n- 方程式中各物质的计量数之比 = 物质的量之比 = （气体）同条件下体积之比。\n\n## 第 7 章 高中：原子结构、元素周期律与化学键\n\n元素性质随原子序数递增呈周期性变化，根本原因是核外电子排布的周期性变化；结构决定性质。\n\n### 7.1 原子结构\n\n- 符号 ᴬZX（左上质量数 A，左下质子数 Z）：质量数 A = 质子数 Z + 中子数 N。\n- 同位素：质子数相同、中子数不同的同种元素的不同原子，如 ¹H、²H、³H；¹²C、¹⁴C。同素异形体指同种元素的不同单质（O₂ 与 O₃）。\n- 核外电子分层排布：第 n 层最多 2n² 个电子，最外层不超过 8 个，次外层不超过 18 个。\n- 选择性必修：能级顺序 1s 2s 2p 3s 3p 4s 3d 4p…；构造原理、泡利原理、洪特规则。例：Fe 为 \\[Ar\\]3d⁶ 4s²，Cr 为 \\[Ar\\]3d⁵ 4s¹，Cu 为 \\[Ar\\]3d¹⁰ 4s¹。\n\n### 7.2 元素周期表\n\n- 7 个周期：周期序数 = 电子层数。第 1–3 周期为短周期（2、8、8 种元素）。\n- 18 个纵列、16 个族：7 个主族、7 个副族、第 Ⅷ 族（3 列）、0 族。主族序数 = 最外层电子数 = 最高正价（O、F 除外）。\n- 非金属的最高正价 + |最低负价| = 8。\n- 金属与非金属分界线附近（Si、Ge）找半导体材料；过渡元素中找催化剂和耐高温、耐腐蚀合金。\n\n### 7.3 元素周期律\n\n| 性质 | 同周期（从左到右） | 同主族（从上到下） |\n| --- | --- | --- |\n| 原子半径 | 减小 | 增大 |\n| 金属性 / 还原性 | 减弱 | 增强 |\n| 非金属性 / 氧化性 | 增强 | 减弱 |\n| 最高价氧化物对应水化物 | 碱性减弱、酸性增强 | 碱性增强、酸性减弱 |\n| 气态氢化物稳定性 | 增强 | 减弱 |\n| 第一电离能 | 总体增大（ⅡA > ⅢA，ⅤA > ⅥA） | 减小 |\n| 电负性 | 增大 | 减小 |\n\n- 微粒半径比较：电子层数多的半径大；层数相同时核电荷数大的半径小，如 O²⁻ > F⁻ > Na⁺ > Mg²⁺ > Al³⁺。\n- 金属性最强的是 Cs（不计放射性元素），非金属性最强的是 F。\n\n### 7.4 化学键与分子结构\n\n| 化学键 | 成键微粒 | 本质 | 例子 |\n| --- | --- | --- | --- |\n| 离子键 | 阴、阳离子 | 静电作用 | NaCl、MgO、NH₄Cl、NaOH（也含共价键） |\n| 共价键 | 原子 | 共用电子对 | H₂（非极性键）、HCl（极性键）、H₂O₂（两者都有） |\n| 金属键 | 金属阳离子与自由电子 | 电子气理论 | Fe、Cu |\n\n- 含离子键的化合物一定是离子化合物；只含共价键的化合物是共价化合物。\n- 分子间作用力（范德华力）影响熔沸点；氢键使 H₂O、NH₃、HF 的沸点反常地高。\n- 选择性必修：σ 键和 π 键（双键含 1 个 σ、1 个 π）；杂化与空间构型：CH₄ sp³ 正四面体，NH₃ sp³ 三角锥形，H₂O sp³ V 形，BF₃ sp² 平面三角形，CO₂ sp 直线形。\n- 晶体类型：离子晶体（NaCl）、分子晶体（干冰、冰）、共价晶体（金刚石、SiO₂）、金属晶体。共价晶体熔点一般最高。\n\n## 第 8 章 高中：离子反应与氧化还原反应\n\n离子反应看溶液中哪些离子真正参与反应，氧化还原反应看电子转移；二者都遵循质量守恒，前者还要电荷守恒，后者还要得失电子守恒。\n\n### 8.1 电解质\n\n- 电解质：在水溶液或熔融状态下能导电的化合物（酸、碱、盐、活泼金属氧化物、水）。单质和混合物既不是电解质也不是非电解质。\n- CO₂、NH₃、SO₂ 的水溶液能导电，但它们本身是非电解质。\n- 强电解质完全电离（强酸 HCl、H₂SO₄、HNO₃、HBr、HI、HClO₄；强碱 NaOH、KOH、Ba(OH)₂、Ca(OH)₂；绝大多数盐）；弱电解质部分电离（弱酸、弱碱、水）。\n\n### 8.2 离子方程式\n\n1. 写：写出化学方程式。\n2. 拆：只拆易溶且易电离的物质（强酸、强碱、可溶性盐）；沉淀、气体、弱电解质、氧化物、单质写化学式。\n3. 删：删去两边未参加反应的离子。\n4. 查：原子守恒、电荷守恒。\n\n例：CaCO₃ + 2H⁺ = Ca²⁺ + H₂O + CO₂↑；Cu²⁺ + 2OH⁻ = Cu(OH)₂↓。\n\n常见错误：稀 H₂SO₄ 与 Ba(OH)₂ 应写 Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ = BaSO₄↓ + 2H₂O，不能约简为 1 : 1；Fe 与稀盐酸生成 Fe²⁺ 而非 Fe³⁺。\n\n### 8.3 离子共存\n\n离子之间发生以下反应之一就不能大量共存：\n\n- 生成沉淀：Ba²⁺ 与 SO₄²⁻、Ag⁺ 与 Cl⁻、Ca²⁺ 与 CO₃²⁻。\n- 生成气体或弱电解质：H⁺ 与 CO₃²⁻、HCO₃⁻、OH⁻、CH₃COO⁻；OH⁻ 与 NH₄⁺、HCO₃⁻。\n- 发生氧化还原反应：酸性条件下 NO₃⁻ 与 Fe²⁺、I⁻；Fe³⁺ 与 I⁻、S²⁻；MnO₄⁻ 与 Cl⁻、Fe²⁺。\n- 生成配合物：Fe³⁺ 与 SCN⁻。\n- 注意题干隐含条件：“无色”排除 Cu²⁺（蓝）、Fe³⁺（黄）、Fe²⁺（浅绿）、MnO₄⁻（紫）；“酸性”“碱性”要加上 H⁺ 或 OH⁻。\n\n### 8.4 氧化还原反应\n\n- 本质是电子转移（得失或偏移），特征是化合价升降。\n- 口诀“升失氧、降得还”：还原剂化合价升高、失电子、被氧化，得到氧化产物；氧化剂化合价降低、得电子、被还原，得到还原产物。\n- 强弱规律：氧化性 氧化剂 > 氧化产物；还原性 还原剂 > 还原产物。\n- 常见氧化性顺序：KMnO₄(H⁺) > Cl₂ > Br₂ > Fe³⁺ > I₂ > S；还原性顺序：S²⁻ > SO₃²⁻ > I⁻ > Fe²⁺ > Br⁻ > Cl⁻。\n- 四种基本反应中，置换反应一定是氧化还原反应，复分解反应一定不是。\n\n### 8.5 配平（化合价升降法）\n\n1. 标出化合价变化的元素。\n2. 求一个微粒升高和降低的价数。\n3. 取最小公倍数，使升降总数相等。\n4. 用观察法配平其余物质，最后用 H 或 O 原子检查。\n\n例：Cu + 4HNO₃(浓) = Cu(NO₃)₂ + 2NO₂↑ + 2H₂O；3Cu + 8HNO₃(稀) = 3Cu(NO₃)₂ + 2NO↑ + 4H₂O。\n\n## 第 9 章 高中：元素及其化合物\n\n每种元素都按“单质 → 氧化物 → 酸或碱 → 盐”的转化主线记忆，并用化合价判断氧化性、还原性。\n\n### 9.1 钠及其化合物\n\n- Na 浮、熔、游、响、红（滴酚酞）：2Na + 2H₂O = 2NaOH + H₂↑。钠保存在煤油中。\n- 常温下 4Na + O₂ = 2Na₂O（白）；加热 2Na + O₂ —Δ→ Na₂O₂（淡黄）。\n- 2Na₂O₂ + 2H₂O = 4NaOH + O₂↑；2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂（供氧剂）。\n- Na₂CO₃ 与 NaHCO₃：溶解度 Na₂CO₃ 大；热稳定性 Na₂CO₃ 好，2NaHCO₃ —Δ→ Na₂CO₃ + H₂O + CO₂↑；与盐酸反应 NaHCO₃ 更快。\n- 焰色反应：钠黄色；钾紫色（透过蓝色钴玻璃观察）。焰色反应属于物理变化。\n\n### 9.2 铝及其化合物\n\n- 铝既能与酸也能与强碱反应放出 H₂：2Al + 2NaOH + 2H₂O = 2NaAlO₂ + 3H₂↑（新教材写作 Na\\[Al(OH)₄\\]）。\n- Al₂O₃、Al(OH)₃ 是两性化合物。Al(OH)₃ 不溶于氨水，实验室用可溶性铝盐加氨水制取。\n- 铝热反应：2Al + Fe₂O₃ —高温→ Al₂O₃ + 2Fe，用于焊接铁轨。\n- 浓硫酸、浓硝酸在常温下使 Al、Fe 钝化。\n\n### 9.3 铁、铜及其化合物\n\n- 铁三角：Fe —弱氧化剂（H⁺、Cu²⁺、S）→ Fe²⁺；Fe —强氧化剂（Cl₂、稀 HNO₃ 过量）→ Fe³⁺；2Fe³⁺ + Fe = 3Fe²⁺；2Fe²⁺ + Cl₂ = 2Fe³⁺ + 2Cl⁻。\n- 铁的氧化物：FeO 黑色，Fe₂O₃ 红棕色（铁锈主要成分），Fe₃O₄ 黑色晶体、有磁性。\n- Fe(OH)₂ 白色沉淀在空气中迅速变灰绿、最终变红褐色：4Fe(OH)₂ + O₂ + 2H₂O = 4Fe(OH)₃。\n- 检验 Fe³⁺：加 KSCN 溶液变血红色。检验 Fe²⁺：先加 KSCN 无明显现象，再加氯水变红；或加 K₃\\[Fe(CN)₆\\] 生成蓝色沉淀。\n- 印刷电路板：2FeCl₃ + Cu = 2FeCl₂ + CuCl₂。铜锈为绿色 Cu₂(OH)₂CO₃。\n\n### 9.4 氯及其化合物\n\n- Cl₂ 黄绿色、有刺激性气味、有毒。与金属反应生成高价氯化物：2Fe + 3Cl₂ —点燃→ 2FeCl₃。H₂ 在 Cl₂ 中安静燃烧，苍白色火焰。\n- Cl₂ + H₂O ⇌ HCl + HClO。HClO 有强氧化性（漂白、杀菌），见光分解 2HClO —光照→ 2HCl + O₂↑。\n- 漂白液 Cl₂ + 2NaOH = NaCl + NaClO + H₂O；漂白粉 2Cl₂ + 2Ca(OH)₂ = CaCl₂ + Ca(ClO)₂ + 2H₂O。\n- 实验室制法：MnO₂ + 4HCl(浓) —Δ→ MnCl₂ + Cl₂↑ + 2H₂O；用饱和食盐水除 HCl、浓硫酸干燥、NaOH 溶液吸收尾气。\n- 检验 Cl⁻：加稀硝酸酸化的 AgNO₃ 溶液，生成白色沉淀。\n- 卤素氧化性 F₂ > Cl₂ > Br₂ > I₂；I₂ 遇淀粉变蓝。\n\n### 9.5 硫及其化合物\n\n- 转化主线：S → SO₂ → SO₃ → H₂SO₄；2SO₂ + O₂ ⇌ 2SO₃（催化剂、加热）。\n- SO₂：漂白品红（加热可恢复红色，与 HClO 不同）；有还原性，使酸性 KMnO₄ 和溴水褪色；也有弱氧化性 SO₂ + 2H₂S = 3S + 2H₂O。SO₂ 和 NOₓ 是形成酸雨的主要物质。\n- 浓硫酸：吸水性（干燥剂，不能干燥 NH₃、H₂S）、脱水性（使蓝糖变黑）、强氧化性：Cu + 2H₂SO₄(浓) —Δ→ CuSO₄ + SO₂↑ + 2H₂O。\n- 检验 SO₄²⁻：先加稀盐酸无现象，再加 BaCl₂ 溶液生成白色沉淀。\n\n### 9.6 氮及其化合物\n\n- 转化主线：N₂ → NO → NO₂ → HNO₃：N₂ + O₂ —放电→ 2NO，2NO + O₂ = 2NO₂，3NO₂ + H₂O = 2HNO₃ + NO。\n- 合成氨：N₂ + 3H₂ ⇌ 2NH₃（高温、高压、催化剂）。\n- NH₃ 极易溶于水（喷泉实验），水溶液显碱性；NH₃ + HCl = NH₄Cl（白烟）。实验室制法：2NH₄Cl + Ca(OH)₂ —Δ→ CaCl₂ + 2NH₃↑ + 2H₂O，用碱石灰干燥。\n- 检验 NH₄⁺：加 NaOH 溶液并加热，产生使湿润红色石蕊试纸变蓝的气体。\n- 硝酸：易挥发、见光分解（棕色瓶保存）；强氧化性，浓 HNO₃ 生成 NO₂，稀 HNO₃ 生成 NO。\n\n### 9.7 硅及其化合物\n\n- Si 是半导体，用于芯片和太阳能电池；SiO₂ 用于光导纤维。\n- SiO₂ 是酸性氧化物，但不溶于水；SiO₂ + 2NaOH = Na₂SiO₃ + H₂O，所以盛 NaOH 溶液的试剂瓶用橡胶塞。\n- SiO₂ + 4HF = SiF₄↑ + 2H₂O（氢氟酸刻蚀玻璃）。\n- 传统无机非金属材料：玻璃、水泥、陶瓷。\n\n## 第 10 章 高中：化学反应与能量\n\n化学反应的能量变化来自旧键断裂吸热、新键形成放热；把氧化还原反应的电子转移引到导线中，就得到原电池。\n\n### 10.1 反应热与焓变\n\n- ΔH = 生成物总能量 − 反应物总能量 = 反应物键能总和 − 生成物键能总和。ΔH < 0 为放热反应，ΔH > 0 为吸热反应。\n- 常见放热反应：燃烧、中和、活泼金属与酸、大多数化合反应。常见吸热反应：大多数分解反应、Ba(OH)₂·8H₂O 与 NH₄Cl、C + CO₂ —高温→ 2CO。\n- 热化学方程式要标状态（s、l、g、aq）、ΔH 的正负与单位 kJ/mol；计量数翻倍，ΔH 也翻倍。\n- 例：H₂(g) + ½O₂(g) = H₂O(l)　ΔH = −285.8 kJ/mol。\n- 燃烧热：1 mol 纯物质完全燃烧生成指定产物（C → CO₂(g)、H → H₂O(l)）时放出的热量。中和热：稀强酸与稀强碱生成 1 mol H₂O(l) 约放热 57.3 kJ。\n- 盖斯定律：反应热只与始态、终态有关，与途径无关。可以像代数式一样把方程式相加减，ΔH 随之相加减。\n\n### 10.2 原电池\n\n- 构成：两个活泼性不同的电极、电解质溶液、闭合回路、自发的氧化还原反应。\n- 负极发生氧化反应（失电子），正极发生还原反应（得电子）。电子从负极经导线流向正极；溶液中阳离子移向正极，阴离子移向负极。\n- 铜锌原电池（稀硫酸）：负极 Zn − 2e⁻ = Zn²⁺；正极 2H⁺ + 2e⁻ = H₂↑。加盐桥可使电流更稳定。\n- 氢氧燃料电池（碱性）：负极 H₂ − 2e⁻ + 2OH⁻ = 2H₂O；正极 O₂ + 4e⁻ + 2H₂O = 4OH⁻。\n- 铅蓄电池放电：Pb + PbO₂ + 2H₂SO₄ = 2PbSO₄ + 2H₂O。\n\n### 10.3 电解池\n\n- 与电源正极相连的是阳极（氧化反应），与负极相连的是阴极（还原反应）。\n- 阳极放电顺序：活泼金属电极 > S²⁻ > I⁻ > Br⁻ > Cl⁻ > OH⁻ > 含氧酸根。\n- 阴极放电顺序：Ag⁺ > Fe³⁺ > Cu²⁺ > H⁺（酸）> Pb²⁺ > Fe²⁺ > Zn²⁺ > H⁺（水）> Al³⁺ > Mg²⁺ > Na⁺。\n- 电解饱和食盐水（氯碱工业）：2NaCl + 2H₂O —通电→ 2NaOH + H₂↑ + Cl₂↑。\n- 应用：电镀（镀层金属作阳极）、精炼铜（粗铜作阳极）、电解熔融 NaCl 制 Na、电解熔融 Al₂O₃ 制 Al。\n\n### 10.4 金属腐蚀与防护\n\n- 化学腐蚀与电化学腐蚀；钢铁在中性或弱酸性潮湿环境中主要发生吸氧腐蚀，正极 O₂ + 2H₂O + 4e⁻ = 4OH⁻；强酸性环境中发生析氢腐蚀。\n- 防护：牲牲阳极法（连接更活泼的 Zn）、外加电流法（被保护金属接电源负极）、涂层、合金。\n\n## 第 11 章 高中：反应速率与化学平衡\n\n速率回答“多快”，平衡回答“进行到什么程度”；条件改变时，平衡向减弱这种改变的方向移动（勒夏特列原理）。\n\n### 11.1 化学反应速率\n\n- v = Δc / Δt，单位 mol/(L·s) 或 mol/(L·min)。同一反应中各物质的速率之比 = 计量数之比。固体和纯液体不用浓度表示速率。\n- 内因：反应物本身的性质。外因：浓度、温度、压强（有气体参加）、催化剂、固体表面积。\n- 碰撞理论：升温和加催化剂提高活化分子百分数；增大浓度只增加单位体积内活化分子数。催化剂降低活化能，不改变 ΔH。\n- 恒容时充入不参与反应的气体（如 Ar），反应物浓度不变，速率不变。\n\n### 11.2 化学平衡\n\n- 平衡的特征“逆、等、动、定、变”：v正 = v逆 ≠ 0，各组分浓度保持不变。\n- 判断是否平衡：“变量不变”才能作为标志。例如反应前后气体分子数相同时，总压强不变不能说明平衡。\n- 平衡常数：对 aA + bB ⇌ cC + dD，\n\n```latex\nK = \\frac{c^c(\\mathrm{C}) \\cdot c^d(\\mathrm{D})}{c^a(\\mathrm{A}) \\cdot c^b(\\mathrm{B})}\n```\n\n- K 只与温度有关；固体和纯液体不写入表达式。浓度商 Q < K 时正向进行，Q > K 时逆向进行。\n\n| 改变条件 | 平衡移动方向 |\n| --- | --- |\n| 增大反应物浓度 | 正向 |\n| 升高温度 | 吸热方向 |\n| 增大压强（缩小体积） | 气体分子数减少的方向 |\n| 加催化剂 | 不移动，只缩短达到平衡的时间 |\n\n- 反应方向的判据：ΔG = ΔH − TΔS < 0 时反应能自发进行。ΔH < 0、ΔS > 0 的反应在任何温度下都自发。\n\n### 11.3 弱电解质的电离与水的电离\n\n- 弱酸电离平衡 CH₃COOH ⇌ CH₃COO⁻ + H⁺；电离吸热，稀释和升温都促进电离。多元弱酸分步电离，以第一步为主。\n- 水的离子积：25 ℃ 时 Kw = c(H⁺)·c(OH⁻) = 1.0 × 10⁻¹⁴；升温 Kw 增大。\n- pH = −lg c(H⁺)。酸、碱抑制水的电离，可水解的盐促进水的电离。\n- 酸碱中和滴定：用标准液测定未知浓度；滴定管要用待装液润洗，锥形瓶不能润洗。\n\n### 11.4 盐类水解\n\n- 规律“有弱才水解，谁强显谁性”：Na₂CO₃、CH₃COONa 溶液显碱性；NH₄Cl、CuSO₄、FeCl₃ 溶液显酸性；NaCl 显中性。\n- 水解吸热，升温促进水解（热的纯碱溶液去油污能力更强）。\n- 应用：明矾净水（Al³⁺ 水解生成 Al(OH)₃ 胶体）；配制 FeCl₃ 溶液时加少量盐酸抑制水解。\n- 三个守恒：电荷守恒、物料守恒、质子守恒。例 Na₂CO₃ 溶液中 c(Na⁺) + c(H⁺) = 2c(CO₃²⁻) + c(HCO₃⁻) + c(OH⁻)。\n\n### 11.5 沉淀溶解平衡\n\n- Kₛₚ 只与温度有关。离子积 Q > Kₛₚ 有沉淀析出，Q < Kₛₚ 沉淀溶解。\n- 沉淀转化：一般向更难溶的方向进行，如 AgCl（白）→ AgI（黄）→ Ag₂S（黑）；锅炉水垢中的 CaSO₄ 用 Na₂CO₃ 转化为 CaCO₃ 再用酸除去。\n\n## 第 12 章 高中：有机化学基础\n\n有机物的性质由官能团决定；识别官能团、写出同分异构体、判断反应类型是有机推断题的三个核心步骤。各官能团的结构图见[有机官能团图谱](https://claude.ai/artifact/KTaYNMGSTyJRmSJdSrwFmD)。\n\n### 12.1 烃\n\n| 类别 | 通式 | 代表物 | 特征反应 |\n| --- | --- | --- | --- |\n| 烷烃 | CₙH₂ₙ₊₂ | 甲烷 CH₄（正四面体） | 光照下与 Cl₂ 取代：CH₄ + Cl₂ —光→ CH₃Cl + HCl |\n| 烯烃 | CₙH₂ₙ | 乙烯 CH₂=CH₂（平面形） | 加成、加聚、使酸性 KMnO₄ 和溴水褪色 |\n| 炔烃 | CₙH₂ₙ₋₂ | 乙炔 HC≡CH（直线形） | 加成；实验室 CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂↑ |\n| 苯及其同系物 | CₙH₂ₙ₋₆ | 苯 C₆H₆（平面正六边形） | 易取代（溴代用 FeBr₃、硝化用浓硫酸），可与 H₂ 加成 |\n\n苯分子中 6 个碳碳键完全相同，介于单键和双键之间，所以苯不能使溴水和酸性 KMnO₄ 因反应而褪色。\n\n### 12.2 烃的衍生物与官能团\n\n| 官能团 | 类别 | 代表物 | 关键反应 |\n| --- | --- | --- | --- |\n| –X | 卤代烃 | CH₃CH₂Br | NaOH 水溶液水解；NaOH 醇溶液消去 |\n| –OH（醇） | 醇 | CH₃CH₂OH | 与 Na 反应；催化氧化 2CH₃CH₂OH + O₂ —Cu,Δ→ 2CH₃CHO + 2H₂O；170 ℃ 消去生成乙烯 |\n| –OH（酚） | 酚 | C₆H₅OH | 弱酸性；与浓溴水生成白色沉淀；遇 FeCl₃ 显紫色 |\n| –CHO | 醛 | CH₃CHO | 银镜反应；与新制 Cu(OH)₂ 加热生成砖红色沉淀 |\n| C=O（酮） | 酮 | CH₃COCH₃ | 加氢还原为醇 |\n| –COOH | 羧酸 | CH₃COOH | 酸性；酯化反应（酸脱羟基、醇脱氢） |\n| –COO– | 酯 | CH₃COOC₂H₅ | 酸性可逆水解；碱性完全水解 |\n| –NH₂、–COOH | 氨基酸 | 甘氨酸 H₂NCH₂COOH | 两性；缩合形成肽键 |\n\n酯化反应：CH₃COOH + CH₃CH₂OH ⇌（浓硫酸，Δ）CH₃COOCH₂CH₃ + H₂O。饱和 Na₂CO₃ 溶液用来除去乙酸、溶解乙醇并降低乙酸乙酯的溶解度。\n\n### 12.3 同分异构\n\n- 同分异构体：分子式相同、结构不同。同系物：结构相似、分子组成相差若干个 CH₂。\n- 类型：碳链异构（正丁烷与异丁烷）、位置异构（1-丁烯与 2-丁烯）、官能团异构（乙醇与二甲醚，羧酸与酯）、顺反异构、对映异构（手性碳）。\n- 常用数据：C₄H₁₀ 有 2 种，C₅H₁₂ 有 3 种，C₆H₁₄ 有 5 种；丁基 –C₄H₉ 有 4 种，所以 C₄H₉Cl 和 C₄H₉OH（醇）各有 4 种。\n- 判断等效氢：同一碳上的氢、同一碳上甲基的氢、对称位置的氢等效。核磁共振氢谱的峰数 = 等效氢种类数。\n\n### 12.4 反应类型\n\n| 反应类型 | 定义 | 典型例子 |\n| --- | --- | --- |\n| 取代反应 | 原子或原子团被替代 | 烷烃卤代、苯的硝化、酯化、水解 |\n| 加成反应 | 不饱和键两端的原子与其他原子直接结合 | 乙烯与 Br₂、H₂O；醛加氢 |\n| 消去反应 | 脱去小分子生成不饱和键 | 醇分子内脱水、卤代烃脱 HX |\n| 氧化反应 | 加氧或去氢 | 醇→醛→羧酸、燃烧 |\n| 还原反应 | 加氢或去氧 | 醛、酮加氢生成醇 |\n| 加聚反应 | 不饱和单体加成聚合，无小分子生成 | 乙烯→聚乙烯 |\n| 缩聚反应 | 单体间缩合并生成小分子 | 氨基酸→多肽；二元酸 + 二元醇→聚酯 |\n\n核心转化链：乙烯 → 乙醇 → 乙醛 → 乙酸 → 乙酸乙酯；卤代烃 ⇌ 醇（水解 / 取代）。\n\n### 12.5 生命中的有机物与高分子\n\n- 糖类：葡萄糖与果糖互为同分异构体（C₆H₁₂O₆），葡萄糖有醛基、能发生银镜反应；淀粉和纤维素通式都是 (C₆H₁₀O₅)ₙ，但 n 不同，不是同分异构体。淀粉遇碘变蓝。\n- 油脂是高级脂肪酸甘油酯；碱性水解（皂化）得到肥皂的主要成分。\n- 蛋白质：盐析可逆（加浓的轻金属盐或铵盐溶液）；变性不可逆（加热、强酸强碱、重金属盐、甲醛、酒精）。含苯环的蛋白质遇浓硝酸变黄。\n- 合成高分子：由链节写单体时，加聚物主链全是碳，按“单双键互换”拆分；缩聚物主链含酯基或酰胺键，在该处断开补 –OH 和 –H。\n\n## 第 13 章 化学实验基础\n\n实验题的得分点集中在三处：仪器和操作是否规范、气体制备装置如何选、如何检验和除杂。\n\n### 13.1 常用仪器\n\n| 仪器 | 用途 | 注意 |\n| --- | --- | --- |\n| 试管 | 少量试剂反应 | 可直接加热；液体不超过容积 1/3 |\n| 烧杯、烧瓶、锥形瓶 | 较多量试剂反应、溶解 | 加热需垫陶土网 |\n| 蒸发皿、坩埚 | 蒸发溶液；灼烧固体 | 可直接加热，用坩埚钳夹取 |\n| 量筒 | 量取液体 | 精确到 0.1 mL；不能加热或作反应容器 |\n| 托盘天平 | 称量 | 精确到 0.1 g；左物右码，腐蚀性药品放在烧杯中称 |\n| 滴定管 | 滴定 | 精确到 0.01 mL；酸式不装碱液，碱式不装强氧化性溶液 |\n| 分液漏斗 | 分液、萃取 | 下层液体从下口放出，上层液体从上口倒出 |\n\n### 13.2 基本操作与安全\n\n- 取用药品：“三不”——不用手接触、不凑近闻气味、不尝味道。用剩的药品放入指定容器，不放回原瓶（钠、钾等除外）。\n- 酒精灯用外焰加热；禁止用燃着的酒精灯点燃另一盏，用灯帽盖灭。\n- 给固体加热时试管口略向下倾斜；给液体加热时试管口不对着人。\n- 装置连接好后先检查气密性，再装药品。\n- 事故处理：浓硫酸沾到皮肤，先用大量水冲洗，再涂 3%–5% NaHCO₃ 溶液；碱液沾到皮肤，用大量水冲洗后涂硼酸；酒精洒出着火，用湿抹布盖灭。\n\n### 13.3 常见气体的实验室制取\n\n| 气体 | 反应原理 | 发生装置 | 收集方法 |\n| --- | --- | --- | --- |\n| O₂ | KMnO₄ 加热；或 H₂O₂ + MnO₂ | 固体加热型 / 固液不加热型 | 排水法、向上排空气法 |\n| H₂ | Zn + 稀 H₂SO₄ | 固液不加热型 | 排水法、向下排空气法 |\n| CO₂ | 大理石 + 稀盐酸 | 固液不加热型 | 向上排空气法 |\n| Cl₂ | MnO₂ + 浓盐酸 加热 | 固液加热型 | 向上排空气法、排饱和食盐水法 |\n| NH₃ | NH₄Cl + Ca(OH)₂ 加热 | 固体加热型 | 向下排空气法 |\n\n装置顺序一般为：发生 → 除杂 → 干燥 → 收集 → 尾气处理。洗气瓶“长进短出”。\n\n### 13.4 物质的检验\n\n| 待检物 | 试剂或方法 | 现象 |\n| --- | --- | --- |\n| O₂ | 带火星的木条 | 复燃 |\n| CO₂ | 澄清石灰水 | 变浑浊 |\n| H₂O | 无水 CuSO₄ | 白色变蓝色 |\n| NH₃ | 湿润的红色石蕊试纸 | 变蓝 |\n| Cl₂ | 湿润的淀粉-KI 试纸 | 变蓝 |\n| SO₂ | 品红溶液 | 褪色，加热后恢复红色 |\n| Cl⁻ | 稀 HNO₃ + AgNO₃ | 白色沉淀 |\n| SO₄²⁻ | 稀盐酸，再加 BaCl₂ | 白色沉淀 |\n| CO₃²⁻ | 稀盐酸，气体通入澄清石灰水 | 石灰水变浑浊 |\n| Fe³⁺ | KSCN 溶液 | 血红色 |\n| NH₄⁺ | NaOH 溶液，加热 | 放出使湿润红色石蕊试纸变蓝的气体 |\n| 淀粉 | 碘水 | 变蓝 |\n\n### 13.5 分离与提纯\n\n- 过滤：固液分离。蒸发：有较多固体析出时停止加热，用余热蒸干。\n- 蒸馏：分离沸点相差较大的互溶液体；温度计水银球位于支管口，冷凝水下进上出，加碎瓷片防暴沸。\n- 萃取分液：萃取剂与原溶剂互不相溶，溶质在萃取剂中溶解度更大（如用 CCl₄ 萃取碘水中的 I₂）。\n- 除杂原则：不增（不引入新杂质）、不减（不减少被提纯物质）、易分离。\n- 粗盐提纯：依次加过量 BaCl₂、NaOH、Na₂CO₃（Na₂CO₃ 必须在 BaCl₂ 之后），过滤后加适量盐酸，再蒸发结晶。\n\n## 附录 速查表\n\n### A. 常见原子团及其化合价\n\n| 原子团 | 符号 | 化合价 |\n| --- | --- | --- |\n| 铵根 | NH₄⁺ | +1 |\n| 氢氧根 | OH⁻ | −1 |\n| 硝酸根 | NO₃⁻ | −1 |\n| 碳酸氢根 | HCO₃⁻ | −1 |\n| 高锰酸根 | MnO₄⁻ | −1 |\n| 氯酸根 | ClO₃⁻ | −1 |\n| 硫酸根 | SO₄²⁻ | −2 |\n| 亚硫酸根 | SO₃²⁻ | −2 |\n| 碳酸根 | CO₃²⁻ | −2 |\n| 锰酸根 | MnO₄²⁻ | −2 |\n| 磷酸根 | PO₄³⁻ | −3 |\n\n### B. 酸碱盐溶解性口诀（20 ℃）\n\n- 钾钠铵盐、硝酸盐全溶。\n- 盐酸盐除 AgCl 外都溶。\n- 硫酸盐除 BaSO₄ 不溶，CaSO₄、Ag₂SO₄ 微溶，其余都溶。\n- 碳酸盐只有钾、钠、铵盐溶，MgCO₃ 微溶。\n- 碱只有 KOH、NaOH、Ba(OH)₂、NH₃·H₂O 易溶，Ca(OH)₂ 微溶。\n- 常见酸均溶（H₂SiO₃ 难溶）。\n\n### C. 常见物质的颜色\n\n| 颜色 | 物质 |\n| --- | --- |\n| 黑色固体 | C、CuO、MnO₂、Fe₃O₄、FeO、铁粉 |\n| 红色或红棕色固体 | Cu（紫红）、Fe₂O₃（红棕）、Cu₂O（砖红）、红磷 |\n| 黄色或淡黄色固体 | S（淡黄）、Na₂O₂（淡黄）、AgBr（淡黄）、AgI（黄） |\n| 蓝色 | Cu(OH)₂ 沉淀、CuSO₄·5H₂O 晶体、含 Cu²⁺ 的溶液 |\n| 绿色 | Cu₂(OH)₂CO₃、FeSO₄·7H₂O；含 Fe²⁺ 的溶液为浅绿色 |\n| 黄色溶液 | 含 Fe³⁺ 的溶液 |\n| 紫红色溶液 | KMnO₄ 溶液 |\n| 有色气体 | Cl₂（黄绿）、NO₂（红棕）、Br₂ 蒸气（红棕） |\n| 红褐色沉淀 | Fe(OH)₃ |\n\n### D. 常用相对原子质量\n\n| 元素 | Ar | 元素 | Ar | 元素 | Ar |\n| --- | --- | --- | --- | --- | --- |\n| H | 1 | Na | 23 | K | 39 |\n| C | 12 | Mg | 24 | Ca | 40 |\n| N | 14 | Al | 27 | Fe | 56 |\n| O | 16 | S | 32 | Cu | 64 |\n| F | 19 | Cl | 35.5 | Zn | 65 |\n| Si | 28 | P | 31 | Ag | 108 |\n| Mn | 55 | Ba | 137 | I | 127 |\n\n### E. 常用数据\n\n- 阿伏加德罗常数 Nₐ ≈ 6.02 × 10²³ mol⁻¹；标准状况下气体摩尔体积 Vₘ ≈ 22.4 L/mol。\n- 25 ℃ 时 Kw = 1.0 × 10⁻¹⁴；纯水 pH = 7。\n- 空气平均摩尔质量约 29 g/mol：气体 M > 29 用向上排空气法，M < 29 用向下排空气法。", "extras": [], "parts": [["导读", "导读"], ["小学", "小学科学中的化学启蒙"], ["初中", "物质的构成与化学用语"], ["初中", "质量守恒与化学方程式"], ["初中", "空气、水、碳与燃烧"], ["初中", "金属、溶液、酸碱盐"], ["高中", "物质的量"], ["高中", "原子结构、元素周期律与化学键"], ["高中", "离子反应与氧化还原反应"], ["高中", "元素及其化合物"], ["高中", "化学反应与能量"], ["高中", "反应速率与化学平衡"], ["高中", "有机化学基础"], ["实验", "化学实验基础"], ["附录", "附录"]]}, "biology": {"title": "生物知识大全", "format": "md", "content": "## 导读\n\n本大全按“小学科学 → 初中生物 → 高中五本教材”的顺序，把 12 年生命科学知识串成一条主线：从“认识生物”到“理解细胞”，再到“分子、遗传、稳态、生态与技术”。内容以人教版教材体系与《义务教育科学/生物学课程标准（2022 年版）》《普通高中生物学课程标准（2017 年版 2020 年修订）》为参照，各地版本顺序略有不同，知识点基本一致。\n\n| 学段 | 对应教材 | 核心问题 |\n| --- | --- | --- |\n| 小学 1–6 年级 | 科学（生命科学领域） | 生物是什么样的？怎样生活？ |\n| 初中 7–8 年级 | 生物学 七上、七下、八上、八下 | 生物体由什么构成？怎样生存、繁殖、进化？ |\n| 高中必修 1 | 分子与细胞 | 细胞由什么分子组成？怎样获取能量？ |\n| 高中必修 2 | 遗传与进化 | 性状怎样遗传？物种怎样形成？ |\n| 选择性必修 1 | 稳态与调节 | 机体怎样维持内环境稳定？ |\n| 选择性必修 2 | 生物与环境 | 种群、群落、生态系统怎样运转？ |\n| 选择性必修 3 | 生物技术与工程 | 怎样利用和改造生物？ |\n\n**生命系统的结构层次**（贯穿全部学段）：细胞 → 组织 → 器官 → 系统（植物无系统）→ 个体 → 种群 → 群落 → 生态系统 → 生物圈。细胞是最基本的生命系统，生物圈是最大的生命系统。\n\n**使用建议**：小学生读第一部分；初中生读第一、二部分并浏览附录；高中生以第三至七部分为主，第八部分实验汇总与附录易混概念用于复习。\n\n## 第一部分 小学科学·生命世界\n\n小学阶段的目标是学会观察、分类和描述生物，知道“生物会生长、会繁殖、需要环境”。\n\n### 1. 生物与非生物\n\n- 生物的特征：需要营养；能呼吸；能排出废物；对外界刺激作出反应；能生长和繁殖；有遗传和变异；（除病毒外）由细胞构成。\n- 例：石头、机器人、钟乳石“会长大”但不是生物；蘑菇、霉菌是生物。\n\n### 2. 植物\n\n- 绿色开花植物的六大器官：**根、茎、叶**（营养器官），**花、果实、种子**（生殖器官）。\n- 根：固定植物、吸收水和无机盐；直根系（大豆、蒲公英）与须根系（小麦、葱）。\n- 茎：支持、运输；叶：制造养料、蒸发水分。\n- 植物生长需要：阳光、水、空气、适宜的温度和养分。\n- 种子萌发：需要水、空气、适宜温度（不一定需要光和土）。凤仙花、大豆的一生：种子 → 发芽 → 幼苗 → 开花 → 结果 → 死亡。\n- 传播种子的方式：风（蒲公英）、水（椰子）、动物（苍耳）、弹射（凤仙花、豆荚）。\n\n### 3. 动物\n\n- 按有无脊椎骨分：脊椎动物（鱼、两栖、爬行、鸟、哺乳）与无脊椎动物（昆虫、蜗牛、蚯蚓等）。\n- 昆虫特征：身体分头、胸、腹三部分，六条足，一般有两对翅。蜘蛛八条足，不是昆虫。\n- 蚕的一生：卵 → 幼虫（蚕）→ 蛹 → 成虫（蛾），属完全变态。\n- 动物适应环境：保护色（叶蛹）、拟态（竹节虫）、冬眠（青蛙、熊）、迁徙（燕子）。\n- 胎生（大多数哺乳动物）与卵生（鸟、鱼、昆虫）。\n\n### 4. 人体与健康\n\n- 五官与感觉：视觉（眼）、听觉（耳）、嗅觉（鼻）、味觉（舌）、触觉（皮肤）。\n- 骨骼与肌肉：成人约 206 块骨，肌肉收缩牵动骨骼产生运动。\n- 呼吸：吸入氧气、呼出二氧化碳；心脏持续跳动推动血液循环，成人安静时心率约 60–100 次/分。\n- 消化：口腔 → 食道 → 胃 → 小肠 → 大肠 → 肛门。\n- 健康习惯：均衡饮食、充足睡眠、勤洗手、保护视力和牙齿。\n\n### 5. 生物与环境（启蒙）\n\n- 食物链：草 → 兔 → 狐；箭头指向“吃者”。生产者（植物）、消费者（动物）、分解者（细菌、真菌）。\n- 一定区域内的生物与环境构成生态系统；保护生物多样性、垃圾分类、节约用水。\n- 微小世界：用放大镜、显微镜观察洋葱表皮、草履虫，知道生物由细胞组成。\n\n## 第二部分 初中生物\n\n初中的主线是“细胞是生物体结构和功能的基本单位”，并由此展开植物、人体、动物、微生物、遗传进化与健康。\n\n### 1. 生物与生物圈\n\n- 生物圈：地球上最大的生态系统，包括大气圈底部、水圈大部和岩石圈表面，厚度约 20 km。\n- 环境因素：非生物因素（光、温度、水、空气等）与生物因素（捕食、竞争、合作、寄生、共生）。\n- 生物适应环境又影响环境：仙人掌叶变为刺；蚯蚓松土；“千里之堤，溃于蚁穴”。\n- 生态系统：生产者、消费者、分解者 + 非生物部分。食物链以生产者开头，不含分解者和非生物部分。\n- 生物富集：难分解的有毒物质（如 DDT、重金属）沿食物链逐级积累，营养级越高含量越高。\n- 生态系统具有一定的自动调节能力，但有限度。生态系统类型：森林（“绿色水库”“地球之肺”）、草原、湿地（“地球之肾”）、海洋、农田、城市等。\n\n### 2. 细胞与生物体结构层次\n\n- 显微镜：放大倍数 = 目镜倍数 × 物镜倍数；物像上下左右均颠倒（旋转 180°），标本偏哪就往哪移；下降镜筒时眼睛看物镜。\n- 临时装片步骤：擦 → 滴（植物用清水、人口腔上皮用生理盐水）→ 取 → 展 → 盖（一侧先接触水滴，防气泡）→ 染（碘液）。\n\n| 结构 | 功能 | 植物细胞 | 动物细胞 |\n| --- | --- | --- | --- |\n| 细胞壁 | 支持、保护 | 有 | 无 |\n| 细胞膜 | 控制物质进出 | 有 | 有 |\n| 细胞核 | 含遗传物质，控制中心 | 有 | 有 |\n| 细胞质 | 生命活动场所 | 有 | 有 |\n| 叶绿体 | 光合作用，光能 → 化学能 | 绿色部分有 | 无 |\n| 线粒体 | 呼吸作用，释放能量 | 有 | 有 |\n| 液泡 | 含细胞液（糖、色素等） | 成熟细胞有大液泡 | 一般无大液泡 |\n\n- 细胞分裂：核先分裂，染色体复制后均分，新细胞与原细胞染色体数目相同。细胞分化形成组织。\n- 动物四大组织：上皮、肌肉、神经、结缔组织（血液、骨属于结缔组织）。\n- 植物主要组织：分生、保护、营养（薄壁）、输导、机械组织。\n- 结构层次：动物 细胞 → 组织 → 器官 → 系统 → 个体；植物 细胞 → 组织 → 器官 → 个体。\n- 单细胞生物：草履虫（口沟取食、表膜呼吸、伸缩泡排水）、衩藻、酵母菌、变形虫。\n\n### 3. 生物圈中的绿色植物\n\n- 植物类群：藻类（无根茎叶）→ 苔藓（有茎叶，假根，可作空气污染指示植物）→ 蕨类（有根茎叶和输导组织），三者都用孢子繁殖；种子植物分裸子植物（种子裸露，如松、银杏）与被子植物（种子外有果皮）。\n- 种子结构：种皮 + 胚（胚芽、胚轴、胚根、子叶）。菜豆为双子叶，营养在子叶；玉米为单子叶，营养在胚乳（遇碘变蓝）。胚是新植物的幼体。\n- 萌发：胚根先突破种皮发育成根；胚轴发育成连接根和茎的部分；胚芽发育成茎和叶。自身条件：胚完整、有活力、已过休眠期。\n- 根尖：根冠 → 分生区（分裂）→ 伸长区（生长最快）→ 成熟区（有根毛，吸水主要部位）。一次施肥过多会“烧苗”——土壤溶液浓度大于细胞液浓度，细胞失水。植物需量最多的无机盐：含氮、磷、钾的无机盐。\n- 花与果实：雄蕊（花药、花丝）、雌蕊（柱头、花柱、子房）。传粉 → 受精（双受精是被子植物特有）→ 子房发育成果实，子房壁 → 果皮，胚珠 → 种子，珠被 → 种皮，受精卵 → 胚。\n- 蒸腾作用：水以气体状态经气孔散失；促进水和无机盐运输、降低叶温、参与水循环。气孔由一对保卫细胞围成，叶下表皮一般更多。\n- 光合作用（场所叶绿体，条件光）：\n\n```latex\n\\text{二氧化碳} + \\text{水} \\xrightarrow[\\text{叶绿体}]{\\text{光}} \\text{有机物（储存能量）} + \\text{氧气}\n```\n\n- 呼吸作用（主要场所线粒体，有光无光都进行）：\n\n```latex\n\\text{有机物} + \\text{氧气} \\longrightarrow \\text{二氧化碳} + \\text{水} + \\text{能量}\n```\n\n- “绿叶在光下制造有机物”实验：暗处理（耗尽淀粉）→ 部分遮光 → 光照 → 酒精隔水加热脱色 → 滴碘液，见光部分变蓝。\n- 农业应用：合理密植、间作套种提高光能利用；大棚增施 CO₂；夜间降温减少呼吸消耗；中耕松土促进根呼吸。\n\n### 4. 人体生理\n\n**营养与消化**\n\n- 六类营养物质：糖类（主要能源）、脂肪（备用能源）、蛋白质（建造和修复）、水、无机盐、维生素。\n- 缺乏症：缺维生素 A → 夜盲症；缺 B₁ → 脚气病；缺 C → 坏血病；缺 D、钙 → 佝偻病、骨质疏松；缺铁 → 缺铁性贫血；缺碘 → 地方性甲状腺肿。\n- 消化顺序：淀粉在口腔开始消化（唾液淀粉酶 → 麦芽糖），蛋白质在胃开始，脂肪在小肠开始（胆汁不含消化酶，乳化脂肪）。终产物：葡萄糖、氨基酸、甘油 + 脂肪酸。\n- 小肠是消化和吸收的主要器官：长 5–6 m，有皱襞和绒毛，绒毛壁与毛细血管壁都只有一层上皮细胞。\n- 合理膳食：“平衡膳食宝塔”，一日三餐能量约为 3:4:3。\n\n**呼吸**\n\n- 呼吸道：鼻 → 咽 → 喉 → 气管 → 支气管；肺是气体交换器官，肺泡多、壁薄。咽是消化道与呼吸道的共同通道。\n- 吸气：肋间肌和膈肌收缩 → 胸廓扩大 → 肺内气压低于外界；呼气相反。\n- 气体交换靠扩散；呼出气体中 CO₂ 增加，但仍含氧气约 16%。\n\n**血液与循环**\n\n| 血细胞 | 特点 | 功能 | 异常 |\n| --- | --- | --- | --- |\n| 红细胞 | 最多，成熟无细胞核，含血红蛋白 | 运输氧 | 过少或血红蛋白低 → 贫血 |\n| 白细胞 | 最大，有细胞核 | 吞噬病菌、防御 | 过多 → 可能有炎症 |\n| 血小板 | 最小，无细胞核 | 止血、加速凝血 | 过少 → 出血不止 |\n\n- 血管：动脉（离心，壁厚流速快）、静脉（回心，四肢静脉有静脉瓣）、毛细血管（红细胞单行通过，物质交换场所）。\n- 心脏四腔：左心室壁最厚。房室瓣、动脉瓣保证血液单向流动。\n- 体循环：左心室 → 主动脉 → 全身毛细血管 → 上、下腔静脉 → 右心房（动脉血变静脉血）。\n- 肺循环：右心室 → 肺动脉 → 肺部毛细血管 → 肺静脉 → 左心房（静脉血变动脉血）。注意：肺动脉流静脉血，肺静脉流动脉血。\n- ABO 血型：输血以输同型血为原则；健康成年人每次献血 200–400 mL 不影响健康。\n\n**排泄**\n\n- 肾单位 = 肾小球 + 肾小囊 + 肾小管。\n- 尿的形成：肾小球滤过（血细胞和大分子蛋白质不能滤过）形成原尿，每天约 180 L；肾小管重吸收全部葡萄糖、大部分水和部分无机盐，形成尿液每天约 1.5 L。\n- 排泄途径：尿液（主要）、汗液、呼气。排遗（粪便）不属排泄。\n\n**神经调节与激素调节**\n\n- 神经系统的结构和功能单位是神经元；基本方式是反射，结构基础是反射弧：感受器 → 传入神经 → 神经中枢 → 传出神经 → 效应器。\n- 简单反射（非条件，如膝跳、眨眼）与复杂反射（条件，如望梅止渴、谈虐色变；与语言文字有关的为人类特有）。\n- 脑：大脑（语言、运动、感觉中枢）、小脑（协调运动、维持平衡）、脑干（呼吸、心跳中枢）。\n- 眼：视网膜上有感光细胞，视觉在大脑皮层形成。近视物像落在视网膜前方，用凹透镜矫正。耳：耳蜗有听觉感受器，听觉在大脑形成。\n- 激素：生长激素（幼年缺→侏儒症，幼年多→巨人症，成年多→肢端肥大症）；甲状腺激素（幼年缺→呆小症，多→甲亢）；胰岛素（缺→糖尿病）。\n\n### 5. 动物的主要类群与行为\n\n| 类群 | 代表 | 主要特征 |\n| --- | --- | --- |\n| 刺胞动物 | 水螅、海蜇 | 辐射对称，有刺细胞，有口无肛门 |\n| 扁形动物 | 涡虫、血吸虫 | 两侧对称，背腹扁平，有口无肛门 |\n| 线虫动物 | 蛔虫 | 身体细长圆柱形，有口有肛门 |\n| 环节动物 | 蚯蚓 | 身体由许多环状体节构成，靠刚毛或疣足辅助运动，蚯蚓用湿润体壁呼吸 |\n| 软体动物 | 蜗牛、乌贼 | 柔软，有外套膜，大多有贝壳 |\n| 节肢动物 | 昆虫、虾、蜘蛛 | 体表有外骨骼，身体和附肢分节；最大的动物类群 |\n| 鱼 | 鲫鱼 | 用鳃呼吸，靠鳍游泳 |\n| 两栖动物 | 青蛙 | 幼体用鳃，成体用肺兼皮肤呼吸 |\n| 爬行动物 | 蜥蜴、龟 | 用肺呼吸，体表有鳞片或甲，卵有卵壳，真正的陆生脊椎动物 |\n| 鸟 | 家鸽 | 体表覆羽，前肢变翼，双重呼吸（气囊辅助，气体交换在肺），恒温 |\n| 哺乳动物 | 兔、人 | 体表被毛，胎生哺乳，牙齿有分化，恒温 |\n\n- 运动：骨（杠杆）、关节（支点）、骨骼肌（动力）；骨骼肌只能收缩牵拉骨，至少两组肌肉相互配合。屈肘时肱二头肌收缩、肱三头肌舒张。\n- 行为：先天性行为（由遗传物质决定，如蜘蛛结网）与学习行为（在遗传因素基础上通过经验获得，如老鼠走迷宫）；社会行为特征：分工、等级（蚁、蜂、狒狒）。\n- 动物在生物圈中的作用：维持生态平衡、促进物质循环、帮助植物传粉和传播种子。\n\n### 6. 细菌、真菌和病毒\n\n| 类别 | 结构 | 繁殖 | 例 |\n| --- | --- | --- | --- |\n| 细菌 | 单细胞，无成形的细胞核（原核生物） | 分裂生殖；芽孢是休眠体不是生殖细胞 | 乳酸菌、大肠杆菌、根瘤菌 |\n| 真菌 | 有成形的细胞核（真核生物），单细胞或多细胞 | 孢子生殖；酵母菌也可出芽生殖 | 酵母菌、青霉、蘑菇 |\n| 病毒 | 无细胞结构，蛋白质外壳 + 遗传物质 | 只能寄生在活细胞内，靠自我复制 | 噬菌体、烟草花叶病毒、流感病毒 |\n\n- 发酵：酵母菌——面包、酿酒；乳酸菌——酸奶、泡菜；醋酸菌——醋；青霉菌——青霉素。\n- 食品保存原理：杀死或抑制微生物（冗藏、巴氏消毒、真空包装、腌制、晒干）。\n- 巴斯德“鹅颈瓶实验”证明肉汤变质是由空气中的细菌造成，否定自然发生说；他被称为“微生物学之父”。\n\n### 7. 生物的分类与多样性\n\n- 分类单位：界、门、纲、目、科、属、种。种是最基本的分类单位；单位越小，共同特征越多、亲缘关系越近。\n- 双名法（林奈）：属名 + 种加词，用拉丁文斜体，如 *Homo sapiens*。\n- 生物多样性三层次：基因（遗传）多样性、物种多样性、生态系统多样性。最有效的保护措施是建立自然保护区。威胁主要来自栖息地破坏。\n\n### 8. 生物的生殖、发育与遗传\n\n- 植物生殖：有性生殖（种子）与无性生殖（扇插、嫁接、压条、组织培养）。嫁接关键：接穗与砧木形成层紧密结合；结出的果实性状同接穗。\n- 昆虫发育：完全变态（卵→幼虫→蛹→成虫，如蚕、蝇、蜂、蝴蝶）；不完全变态（卵→若虫→成虫，如蝗虫、蟋蟀）。\n- 两栖动物：体外受精，变态发育。鸟卵：胚盘是发育成胚胎的部位，卵黄主要提供营养。\n- 人的生殖：精子在睾丸产生；卵细胞在卵巢产生；受精场所是输卵管；胚胎发育场所是子宫；胎儿通过胎盘和脐带与母体交换物质，一般约 38 周分娩。\n- 青春期：身高突增、性器官迅速发育、出现第二性征、出现遗精或月经。\n- 遗传基础：细胞核 → 染色体（DNA + 蛋白质）→ DNA → 基因（有遗传效应的 DNA 片段）。人体细胞 23 对染色体，生殖细胞 23 条。\n- 显性与隐性：用 A/a 表示；Aa × Aa 后代显性 : 隐性 = 3 : 1。近亲结婚使隐性遗传病发病率大大增加，我国法律禁止直系血亲和三代以内旁系血亲结婚。\n- 性别决定：男 XY、女 XX，生男生女由精子决定，概率各 50%。\n- 变异：可遗传的变异（遗传物质改变）与不可遗传的变异（仅环境引起）。\n\n### 9. 生命起源与生物进化\n\n- 米勒实验：原始地球条件下无机小分子可形成氨基酸等有机小分子。原始大气无氧气，原始生命诞生于原始海洋。\n- 化石是研究进化最直接的证据。进化趋势：由简单到复杂、由低等到高等、由水生到陆生。\n- 达尔文自然选择：过度繁殖 → 生存斗争 → 遗传变异 → 适者生存。例：桦尺蛾工业黑化、细菌抗药性增强（抗生素不是诱导变异，而是选择已有变异）。\n- 人类起源：现代类人猿与人类的共同祖先是森林古猿；直立行走是人猿分界的重要标志。\n\n### 10. 健康地生活\n\n- 传染病三环节：传染源、传播途径、易感人群；对应预防措施：控制传染源、切断传播途径、保护易感人群（如接种疫苗）。病原体是引起传染病的细菌、病毒、寄生虫等。\n- 三道防线：第一道——皮肤和黏膜；第二道——体液中的杀菌物质和吞噬细胞（前两道为非特异性免疫）；第三道——免疫器官和免疫细胞（特异性免疫，抗原→抗体）。\n- 疫苗属于抗原；过敏是免疫功能过强。\n- 安全用药：处方药（Rx）与非处方药（OTC）；急救：拨打 120，胸外按压与人工呼吸比例 30 : 2；动脉出血在近心端止血，静脉出血在远心端止血。\n- 影响健康的生活方式：吸烟、酗酒、吸毒；心血管疾病、癌症等“生活方式病”。\n\n## 第三部分 高中必修 1·分子与细胞\n\n本册的核心观念：细胞的结构与功能相适应；细胞的生命活动需要物质和能量；细胞会经历增殖、分化、衰老和死亡。\n\n### 1. 走近细胞\n\n- 细胞学说（施莱登、施旺）：一切动植物都由细胞和细胞产物构成；细胞是相对独立的单位；新细胞是由老细胞分裂产生的（德尔向补充）。意义：揭示了动植物的统一性。方法：不完全归纳法。\n- 原核细胞 vs 真核细胞：根本区别是有无以核膜为界限的细胞核。原核细胞只有核糖体一种细胞器，有拟核。蓝细菌（含藻蓝素和叶绿素，能光合作用，但无叶绿体）。\n- 常见误区：酵母菌、霉菌、蘑菇是真核生物；支原体是最小的细胞且无细胞壁；病毒不属于任何生命系统层次。\n\n### 2. 组成细胞的分子\n\n- 元素：大量元素 C、H、O、N、P、S、K、Ca、Mg；微量元素 Fe、Mn、Zn、Cu、B、Mo（口诀“铁门碰木桶”）。C 是最基本元素；鲜重中 O 最多，干重中 C 最多。\n- 水：自由水（良好溶剂、参与反应、运输）与结合水（细胞结构的组成成分）。自由水/结合水比值越高，代谢越旺盛，抗逆性越弱。\n- 无机盐：多以离子形式存在。Mg²⁺ → 叶绿素；Fe²⁺ → 血红蛋白；血钙低 → 抽搐；Na⁺ 缺乏 → 神经、肌肉兴奋性降低。\n\n| 物质 | 元素 | 基本单位 | 主要功能 | 检测 |\n| --- | --- | --- | --- | --- |\n| 糖类 | C、H、O | 单糖（葡萄糖等） | 主要能源物质；纤维素构成植物细胞壁 | 还原糖 + 斐林试剂，水浴加热 → 砖红色沉淀；淀粉 + 碘液 → 蓝 |\n| 脂质 | C、H、O（磷脂还含 N、P） | 甘油 + 脂肪酸 | 脂肪储能；磷脂构成生物膜；固醇类（胆固醇、性激素、维生素 D） | 脂肪 + 苏丹Ⅲ → 橘黄色 |\n| 蛋白质 | C、H、O、N（常含 S） | 氨基酸（人体 21 种，必需氨基酸 8 种） | 结构、催化、运输、调节、免疫；生命活动的主要承担者 | 双缩脲试剂 → 紫色（先加 A 液再加 B 液，不加热） |\n| 核酸 | C、H、O、N、P | 核苷酸 | 遗传信息的携带者 | — |\n\n- 氨基酸通式：至少一个氨基和一个羧基连在同一个碳原子上，差异在 R 基。脱水缩合计算：\n\n```latex\n\\text{肽键数} = \\text{脱去水分子数} = \\text{氨基酸数} - \\text{肽链数}\n```\n\n```latex\n\\text{蛋白质分子量} = \\text{氨基酸数} \\times \\text{平均分子量} - \\text{脱水数} \\times 18\n```\n\n- 蛋白质多样性源于：氨基酸种类、数目、排列顺序不同，肽链盘曲折叠形成的空间结构不同。高温使空间结构变性，肽键不断，仍能与双缩脲试剂变紫。\n- DNA 与 RNA：DNA 含脱氧核糖、碱基 A/T/G/C，主要在细胞核；RNA 含核糖、碱基 A/U/G/C，主要在细胞质。细胞生物的遗传物质都是 DNA。\n- 糖类细分：单糖（葡萄糖、果糖、核糖、脱氧核糖）；二糖（蛔糖、麦芽糖——植物；乳糖——动物）；多糖（淀粉、纤维素——植物；糖原——动物；几丁质——甲壳类、昆虫外骨骼）。蛔糖是非还原糖。\n\n### 3. 细胞的基本结构\n\n- 细胞膜：流动镶嵌模型——磷脂双分子层为基本支架，蛋白质镶、嵌、贯穿，外侧有糖被（识别）。结构特点：一定流动性；功能特点：选择透过性。功能：将细胞与外界分隔、控制物质进出、进行细胞间信息交流。\n- 制备细胞膜：哺乳动物成熟红细胞放清水中吸水涨破（无核膜和细胞器膜）。\n\n| 细胞器 | 膜层数 | 主要功能 |\n| --- | --- | --- |\n| 线粒体 | 双层 | 有氧呼吸主要场所，“动力车间”；含少量 DNA |\n| 叶绿体 | 双层 | 光合作用场所；类囊体上有色素；含少量 DNA |\n| 内质网 | 单层 | 蛋白质加工（粗面）、脂质合成（光面） |\n| 高尔基体 | 单层 | 蛋白质加工、分类、包装；植物中与细胞壁形成有关 |\n| 溶酶体 | 单层 | 含多种水解酶，分解衰老损伤的细胞器、吞噬病菌 |\n| 液泡 | 单层 | 调节植物细胞内环境、保持坚挺 |\n| 核糖体 | 无膜 | 蛋白质合成场所（“生产蛋白质的机器”） |\n| 中心体 | 无膜 | 动物和低等植物细胞，与有丝分裂有关 |\n\n- 分泌蛋白合成与运输（同位素标记 ³H-亮氨酸）：核糖体 → 粗面内质网 → 囊泡 → 高尔基体 → 囊泡 → 细胞膜（胞吐），线粒体供能。内质网膜面积减小、细胞膜增大、高尔基体基本不变。\n- 生物膜系统 = 细胞膜 + 核膜 + 细胞器膜。\n- 细胞核：核膜（双层，有核孔，实现核质间物质交换和信息交流）、核仁（与 rRNA 合成和核糖体形成有关）、染色质。细胞核是遗传信息库，是细胞代谢和遗传的控制中心。\n- 染色质与染色体是同一物质在不同时期的两种存在状态。\n\n### 4. 细胞的物质输入和输出\n\n- 渗透作用条件：半透膜 + 浓度差。成熟植物细胞的原生质层（细胞膜 + 液泡膜 + 两层膜之间的细胞质）相当于半透膜。\n- 质壁分离：外界溶液浓度 > 细胞液浓度，原生质层伸缩性大于细胞壁。常用紫色洋葱鳞片叶外表皮。\n\n| 方式 | 方向 | 转运蛋白 | 能量 | 例 |\n| --- | --- | --- | --- | --- |\n| 自由扩散 | 高 → 低 | 不需要 | 不需要 | O₂、CO₂、甘油、乙醇、苯 |\n| 协助扩散 | 高 → 低 | 载体蛋白或通道蛋白 | 不需要 | 葡萄糖进红细胞；水经水通道蛋白；神经元 Na⁺ 内流 |\n| 主动运输 | 可低 → 高 | 载体蛋白 | 需要（ATP） | 小肠上皮吸收葡萄糖、氨基酸、无机盐离子 |\n| 胞吞/胞吐 | — | 不需转运蛋白（需膜蛋白识别） | 需要 | 大分子：分泌蛋白、吞噬病菌；依赖膜的流动性 |\n\n### 5. 酶与 ATP\n\n- 酶：活细胞产生的具有催化作用的有机物，绝大多数是蛋白质，少数是 RNA。作用机理：降低化学反应的活化能。\n- 酶的特性：高效性（与无机催化剂比）、专一性（一种酶催化一种或一类反应）、作用条件较温和（最适温度和 pH）。高温、过酸、过碱使酶变性失活（不可逆）；低温仅抑制活性（可恢复），酶宜低温保存。\n- 探究温度对酶活性的影响不宜用过氧化氢（自身受热分解）；探究 pH 不宜用淀粉（酸使淀粉水解）。\n- ATP：结构简式 A–P\\~P\\~P（A 代表腺苷），是细胞的直接能源物质。ATP 与 ADP 不断相互转化，含量少但转化快。合成 ATP 的能量：动物来自呼吸作用；植物来自呼吸作用和光合作用。\n\n```latex\n\\text{ATP} \\underset{\\text{酶}_2}{\\overset{\\text{酶}_1}{\\rightleftharpoons}} \\text{ADP} + \\text{Pi} + \\text{能量}\n```\n\n### 6. 细胞呼吸\n\n| 阶段 | 场所 | 物质变化 | 能量 |\n| --- | --- | --- | --- |\n| 第一阶段 | 细胞质基质 | 1 葡萄糖 → 2 丙酮酸 + 少量 \\[H\\] | 少量 |\n| 第二阶段 | 线粒体基质 | 丙酮酸 + H₂O → CO₂ + 大量 \\[H\\] | 少量 |\n| 第三阶段 | 线粒体内膜 | \\[H\\] + O₂ → H₂O | 大量 |\n\n```latex\nC_6H_{12}O_6 + 6H_2O + 6O_2 \\xrightarrow{\\text{酶}} 6CO_2 + 12H_2O + \\text{能量}\n```\n\n- 无氧呼吸全在细胞质基质，只在第一阶段释放少量能量：酵母菌、大多数植物 → 酒精 + CO₂；乳酸菌、人和动物肌细胞、马铃薯块茎、甜菜块根、玉米胚 → 乳酸。\n- 人体剧烈运动产生的 CO₂ 全部来自有氧呼吸。检测：CO₂ 使澄清石灰水变浑浊，或使溴麝香草酚蓝溶液由蓝变绿再变黄；酒精在酸性条件下使重铬酸钾由橙色变灰绿色。\n\n### 7. 光合作用\n\n- 色素：叶绿素 a（蓝绿色）、叶绿素 b（黄绿色）主要吸收红光和蓝紫光；胡萝卜素（橙黄色）、叶黄素（黄色）主要吸收蓝紫光。纸层析从上到下：胡萝卜素、叶黄素、叶绿素 a（最宽）、叶绿素 b。\n- 光反应（类囊体薄膜）：水的光解产生 O₂ 和 NADPH，并合成 ATP。\n- 暗反应（叶绿体基质，卡尔文循环）：CO₂ + C₅ → 2C₃（CO₂ 固定）；C₃ 在 ATP、NADPH 作用下还原为糖类，并再生 C₅。\n- 突变条件分析：光照减弱 → ATP、NADPH 减少 → C₃ 增加、C₅ 减少；CO₂ 减少 → C₃ 减少、C₅ 增加。\n- 光合发现史：普利斯特利（植物更新空气）→ 恩格尔曼（水绵 + 好氧菌，光合场所是叶绿体）→ 希尔（离体叶绿体光照释放 O₂）→ 鲁宾和卡门（¹⁸O 标记，O₂ 来自水）→ 卡尔文（¹⁴C 标记，碳的转移途径 CO₂ → C₃ → (CH₂O)）。\n\n```latex\n6CO_2 + 12H_2O \\xrightarrow[\\text{叶绿体}]{\\text{光能}} C_6H_{12}O_6 + 6O_2 + 6H_2O\n```\n\n- 净光合速率 = 总（真）光合速率 − 呼吸速率。光补偿点：光合 = 呼吸；光饱和点：光合不再随光强增加。一昼夜有机物积累 > 0，植物才能生长。\n- 影响因素：光照强度、CO₂ 浓度、温度、水、矿质元素。夏季正午“午休”现象：气孔部分关闭，CO₂ 吸收减少。\n- 化能合成作用：硝化细菌利用氨氧化释放的能量合成有机物，也是自养型。\n\n### 8. 细胞的生命历程\n\n- 细胞周期：连续分裂的细胞，从一次分裂完成时开始到下一次分裂完成时为止。分裂间期占 90%–95%，完成 DNA 复制和有关蛋白质合成。\n- 有丝分裂各期：前期（膜仁消失显两体：出现染色体和纺锤体）→ 中期（形数清晰赤道齐：着丝粒排在赤道板，观察最佳时期）→ 后期（点裂数增均两极）→ 末期（两消两现重开始）。植物末期出现细胞板形成细胞壁；动物由中心体发出星射线，末期细胞膜从中部向内凹陷。\n- 意义：将亲代细胞的染色体复制后精确平均分配到两个子细胞，保持遗传稳定性。\n- 无丝分裂：蛙的红细胞，不出现纺锤丝和染色体变化。\n- 细胞分化：基因的选择性表达，遗传物质不变。细胞全能性：已分化的细胞仍具有发育成完整个体或分化成其他各种细胞的潜能（植物组织培养、动物内细胞核具全能性）。干细胞：全能、多能、专能。\n- 细胞衰老特征：水分减少、酶活性降低（素酶→白发）、色素积累（老年斑）、细胞核体积增大、通透性改变。学说：自由基学说、端粒学说。\n- 细胞凋亡：由基因决定的细胞自动结束生命的过程（程序性死亡），对生物体有利；细胞坏死由不利因素引起，对生物体有害。细胞自噬可维持细胞内部环境稳定。\n- 细胞癌变：原癌基因和抑癌基因发生突变。癌细胞无限增殖、形态改变、表面糖蛋白减少易扩散转移。\n\n## 第四部分 高中必修 2·遗传与进化\n\n本册的主线是“基因是什么 → 基因在哪里 → 基因怎样传递和表达 → 基因怎样变化 → 种群基因频率怎样改变”。\n\n### 1. 孟德尔遗传定律\n\n- 豌豆做材料的优点：自花传粉、闭花受粉，自然状态下一般是纯种；有易于区分的相对性状。人工异花传粉：去雄（花蕾期）→ 套袋 → 人工授粉 → 再套袋。\n- 研究方法：**假说—演绎法**（观察现象提出问题 → 提出假说 → 演绎推理 → 测交验证 → 得出结论）。\n- 分离定律：在形成配子时，成对的遗传因子彼此分离，分别进入不同配子。实质：等位基因随同源染色体分开而分离（减数分裂 Ⅰ 后期）。\n- 自由组合定律：控制不同性状的遗传因子的分离和组合互不干扰。实质：非同源染色体上的非等位基因自由组合。\n\n| 杂交组合 | 后代基因型比 | 后代表型比 |\n| --- | --- | --- |\n| Aa × Aa | 1 AA : 2 Aa : 1 aa | 3 : 1 |\n| Aa × aa（测交） | 1 Aa : 1 aa | 1 : 1 |\n| AaBb × AaBb | 9 种基因型 | 9 : 3 : 3 : 1 |\n| AaBb × aabb（测交） | 1 : 1 : 1 : 1 | 1 : 1 : 1 : 1 |\n\n- 常见变式比：9:7、9:6:1、15:1、9:3:4、12:3:1、13:3（均是 16 种组合的合并）；显性纯合致死时 Aa 自交得 2:1。\n- 解题法：“拆分法”——多对性状先逐对分析再相乘。鉴定纯合子：植物最简便是自交，动物用测交。\n- 概念：基因型 + 环境 → 表型；性状分离是杂种后代同时出现显性和隐性性状的现象。\n\n### 2. 减数分裂与受精作用\n\n- 减数分裂：染色体复制一次，细胞连续分裂两次，染色体数目减半。染色体数目减半发生在减数分裂 Ⅰ。\n- 减 Ⅰ：前期同源染色体联会形成四分体，非姐妹染色单体可互换片段（互换→基因重组）；中期同源染色体成对排在赤道板两侧；后期同源染色体分离、非同源染色体自由组合。\n- 减 Ⅱ：类似有丝分裂，后期着丝粒分裂，姐妹染色单体分开。\n- 精子形成：1 个精原细胞 → 4 个精子（需变形）；卵细胞形成：1 个卵原细胞 → 1 个卵细胞 + 3 个极体（初级卵母细胞和次级卵母细胞不均等分裂）。\n- 受精作用：精子头部进入卵细胞，精核与卵细胞核融合。受精卵中染色体一半来自父方、一半来自母方；细胞质中遗传物质几乎全来自卵细胞。\n- 意义：减数分裂与受精作用保证前后代染色体数目恒定，并产生遗传多样性。\n\n| 比较 | 有丝分裂 | 减数分裂 |\n| --- | --- | --- |\n| 分裂次数 | 1 次 | 2 次 |\n| 同源染色体联会 | 无 | 有（减 Ⅰ 前期） |\n| 子细胞染色体数 | 与母细胞相同（2N） | 减半（N） |\n| 子细胞数 | 2 | 4（精子）或 1 卵 + 3 极体 |\n\n### 3. 基因在染色体上与伴性遗传\n\n- 萨顿：类比推理提出基因在染色体上；摩尔根：果蝇红眼/白眼杂交实验（假说—演绎法）证明基因在染色体上，基因在染色体上呈线性排列。\n- 伴 X 隐性（红绿色盲、血友病）：男患者多于女患者；交叉遗传；女病父必病、子必病。\n- 伴 X 显性（抗维生素 D 佝偻病）：女患者多于男患者；男病母必病、女必病；常代代遗传。\n- 伴 Y 遗传（外耳道多毛症）：只传男不传女。\n- 遗传系谱判断口诀：“无中生有为隐性，隐性看女病，女病男正非伴性；有中生无为显性，显性看男病，男病女正非伴性。”\n- ZW 型性别决定（鸟类、蛾、蝴蝶）：雌性 ZW，雄性 ZZ。\n\n### 4. 基因的本质\n\n- 格里菲思肺炎链球菌体内转化实验：加热杀死的 S 型菌中存在“转化因子”。\n- 艾弗里体外转化实验：用“减法原理”逐一去除物质，证明 DNA 是转化因子。\n- 赫尔希和蔡斯噬菌体侵染实验：³⁵S 标记蛋白质 → 放射性主要在上清液；³²P 标记 DNA → 放射性主要在沉淀物。结论：DNA 是遗传物质。噬菌体不能直接用培养基标记，需先标记大肠杆菌。\n- 烟草花叶病毒实验证明 RNA 也可以是遗传物质。结论：DNA 是主要的遗传物质。\n- DNA 双螺旋结构（沃森和克里克，1953）：两条链反向平行；脱氧核糖与磷酸交替连接构成基本骨架在外侧；碱基在内侧以氢键配对：A–T（2 个氢键）、G–C（3 个氢键）。G–C 含量越高，DNA 越稳定。\n- 碱基计算：双链中 A = T、G = C，嘈呤 = 嘧啶；一条链中 (A+G)/(T+C) = a，则互补链中为 1/a；(A+T)/(G+C) 在两条链及整个 DNA 中相等。\n- DNA 复制：半保留复制（梅塞尔森和斯塔尔，¹⁵N 标记 + 密度梯度离心）；边解旋边复制；需要模板、原料（4 种脱氧核苷酸）、能量、酶（解旋酶、DNA 聚合酶）。一个 DNA 复制 n 次得 2ⁿ 个 DNA，含母链的始终是 2 个。\n- 基因通常是有遗传效应的 DNA 片段（RNA 病毒中是 RNA 片段）；遗传信息蒴藏在碱基排列顺序中。\n\n### 5. 基因的表达\n\n| 过程 | 场所 | 模板 | 原料 | 产物 | 配对 |\n| --- | --- | --- | --- | --- | --- |\n| 复制 | 主要在细胞核 | DNA 两条链 | 脱氧核苷酸 | DNA | A–T、G–C |\n| 转录 | 主要在细胞核 | DNA 一条链 | 核糖核苷酸 | RNA | A–U、T–A、G–C |\n| 翻译 | 核糖体 | mRNA | 氨基酸 | 多肽链 | 密码子–反密码子：A–U、G–C |\n\n- 密码子：mRNA 上决定 1 个氨基酸的 3 个相邻碱基，共 64 种（含终止密码子）。tRNA 一端携带氨基酸，另一端有反密码子。密码简并性增强容错性。\n- 数量关系（忽略终止密码子）：DNA 碱基数 : mRNA 碱基数 : 氨基酸数 = 6 : 3 : 1。\n- 一个 mRNA 可结合多个核糖体，短时间合成大量相同蛋白质。原核生物边转录边翻译。\n- 中心法则（克里克）：DNA → DNA（复制）；DNA → RNA（转录）；RNA → 蛋白质（翻译）；补充：RNA → RNA（RNA 复制）、RNA → DNA（逆转录，如 HIV）。\n- 基因控制性状：① 通过控制酶的合成控制代谢过程，间接控制性状（白化病、豌豆皱粒）；② 通过控制蛋白质结构直接控制性状（镰刀型细胞贫血症、囊性纤维化）。\n- 表观遗传：基因碱基序列不变，但基因表达和表型发生可遗传变化，如 DNA 甲基化（柳穿鱼、小鼠毛色）。\n\n### 6. 基因突变及其他变异\n\n- 基因突变：DNA 分子中发生碱基的替换、增添或缺失，引起基因碱基序列改变；产生新基因（等位基因），是生物变异的根本来源。特点：普遍性、随机性、不定向性、低频性、多害少利。例：镰刀型细胞贫血症（一个碱基对替换，谷氨酸 → 缬氨酸）。\n- 基因重组：减 Ⅰ 前期交叉互换、减 Ⅰ 后期自由组合；不产生新基因，产生新基因型；是有性生殖生物多样性的重要原因。\n- 染色体结构变异：缺失（猫叫综合征，5 号染色体部分缺失）、重复、易位（非同源染色体之间）、倒位。\n- 染色体数目变异：个别增减（21 三体综合征）与整倍增减。染色体组：一组非同源染色体。由受精卵发育而来，含几个染色体组即为几倍体；由配子直接发育而来，不论几个组都是单倍体。\n- 多倍体育种：秋水仙素（或低温）抑制纺锤体形成，如无子西瓜（三倍体联会紊乱）。单倍体育种：花药离体培养 → 秋水仙素处理，明显缩短育种年限。\n- 人类遗传病：单基因遗传病、多基因遗传病（原发性高血压、青少年型糖尿病）、染色体异常遗传病。监测和预防：遗传咨询、产前诊断（羊水检查、B 超、基因检测）。调查发病率在人群中随机抽样，调查遗传方式在患者家系中调查。\n\n### 7. 生物的进化\n\n- 进化证据：化石（最直接）、比较解剖学（同源器官）、胚胎学、细胞和分子水平（细胞色素 c 序列差异）。\n- 拉马克：用进废退、获得性遗传。达尔文：自然选择，局限是未能解释遗传变异本质，着眼于个体。\n- 现代生物进化理论：种群是生物进化的基本单位；突变和基因重组提供进化原材料（可遗传变异）；自然选择导致种群基因频率定向改变，决定进化方向；隔离是物种形成的必要条件。进化的实质是种群基因频率的改变。\n- 物种形成的标志是生殖隔离。常见途径：地理隔离 → 基因库差异 → 生殖隔离（加拉帕戈斯群岛地雀）；多倍体可不经地理隔离快速形成新物种。\n- 协同进化：不同物种之间、生物与无机环境之间在相互影响中不断进化和发展；形成生物多样性。\n- 基因频率计算：A 频率 = AA 频率 + ½ Aa 频率。遗传平衡（哈迪—温伯格）：种群足够大、随机交配、无迁入迁出、无突变、无自然选择时：\n\n```latex\np + q = 1, \\qquad p^2 + 2pq + q^2 = 1\n```\n\n- 例：某常染色体隐性病发病率 1/10000，则 q = 1/100，携带者 2pq ≈ 1/50。\n\n## 第五部分 高中选择性必修 1·稳态与调节\n\n神经—体液—免疫调节网络是机体维持稳态的主要调节机制；植物则主要靠激素调节与环境因素共同调控生命活动。\n\n### 1. 人体的内环境与稳态\n\n- 体液 = 细胞内液（约 2/3）+ 细胞外液（约 1/3）；细胞外液即内环境 = 血浆 + 组织液 + 淋巴液。\n- 转化关系：血浆 ⇄ 组织液 → 淋巴液 → 血浆（单向）。血浆与组织液的主要差别是血浆含较多蛋白质。\n- 不属于内环境的成分：血红蛋白、呼吸酶、消化道和尿道中的液体。\n- 理化性质：渗透压（主要取决于无机盐和蛋白质，90% 以上来源于 Na⁺ 和 Cl⁻）、酸碱度（pH 7.35–7.45，靠 HCO₃⁻/H₂CO₃ 等缓冲对）、温度（约 37 ℃）。\n- 组织水肿原因：营养不良、肾小球肾炎（血浆蛋白减少）、淋巴循环受阻、过敏（毛细血管通透性增大）。\n- 稳态：正常机体通过调节作用，使各器官、系统协调活动，共同维持内环境相对稳定的状态；是机体进行正常生命活动的必要条件。调节能力有限。\n\n### 2. 神经调节\n\n- 神经系统组成：中枢神经系统（脑、脊髓）+ 外周神经系统（脑神经、脊神经）。自主神经系统（交感、副交感）是支配内脏、血管和腺体的传出神经，不受意识支配；交感兴奋时心跳加快、胃肠蠕动减弱。\n- 神经元：胞体、树突、轴突；神经胶质细胞支持、保护、营养和修复神经元。\n- 静息电位：外正内负，由 K⁺ 外流（协助扩散）形成。动作电位：外负内正，由 Na⁺ 内流（协助扩散）形成。钠钾泵（主动运输）恢复离子分布。\n- 兴奋在神经纤维上以电信号双向传导；膜内局部电流方向与兴奋传导方向一致。细胞外 Na⁺ 浓度降低 → 动作电位峰值降低。\n- 突触：突触前膜 → 突触间隙 → 突触后膜。信号转换：电信号 → 化学信号 → 电信号。神经递质以胞吐释放，只能单向传递，有突触延搞。递质作用后被降解或回收。\n- 分级调节：低级中枢（脊髓）受高级中枢（大脑皮层）调控，如排尿反射。大脑言语区：W 区（书写）、V 区（视觉性语言）、S 区（运动性语言，布罗卡区）、H 区（听觉性语言）。\n- 条件反射的建立需要非条件刺激强化，否则会消退；消退是新的学习过程。学习和记忆是脑的高级功能。\n\n### 3. 体液调节\n\n- 激素调节发现：贝利斯和斯塔林发现促胰液素（由小肠黏膜分泌），是人们发现的第一种激素。\n- 激素调节特点：通过体液运输；作用于靶器官、靶细胞；作为信使传递信息；微量和高效。激素一经靶细胞接受并起作用后就失活。\n\n| 内分泌腺 | 激素 | 主要作用 |\n| --- | --- | --- |\n| 下丘脑 | 促……激素释放激素、抗利尿激素（垂体释放） | 调控垂体；促进肾小管和集合管重吸收水 |\n| 垂体 | 生长激素、促甲状腺激素、促性腺激素 | 促进生长；调节甲状腺、性腺 |\n| 甲状腺 | 甲状腺激素 | 提高细胞代谢速率，促进生长发育，提高神经系统兴奋性 |\n| 肾上腺 | 肾上腺素（髓质）、醛固酮与皮质醇（皮质） | 升血糖、应急；保钠排钾 |\n| 胰岛 | 胰岛素（B 细胞）、胰高血糖素（A 细胞） | 降血糖（唯一）；升血糖 |\n| 性腺 | 雄性激素、雌性激素 | 促进生殖器官发育、维持第二性征 |\n\n- 分级调节与反馈调节：下丘脑 → TRH → 垂体 → TSH → 甲状腺 → 甲状腺激素；甲状腺激素过多时抑制下丘脑和垂体（负反馈）。缺碘时甲状腺激素低，TRH、TSH 升高，甲状腺肿大。\n- 血糖调节：正常 3.9–6.1 mmol/L。来源：食物消化吸收、肝糖原分解、非糖物质转化；去路：氧化分解、合成糖原、转化为脂肪等。肌糖原不能直接分解为葡萄糖。胰岛素与胰高血糖素相抗衡，胰高血糖素与肾上腺素协同。\n- 体温调节：中枢在下丘脑，冷觉和热觉在大脑皮层形成。寒冷时：皮肤血管收缩、汗腺分泌减少（减少散热），骨骼肌战栗、甲状腺激素和肾上腺素增加（增加产热）。体温稳定时产热 = 散热。\n- 水盐平衡：饮水不足 → 细胞外液渗透压升高 → 下丘脑渗透压感受器 → 抗利尿激素增加 → 重吸收水增加 → 尿量减少；同时大脑皮层产生渴觉。\n- 神经调节 vs 体液调节：前者反应迅速、准确、时间短、范围局限；后者反应较缓、范围广、时间长。不少内分泌腺受神经系统调节，激素也可影响神经系统发育（幼年缺甲状腺激素影响脑发育）。\n\n### 4. 免疫调节\n\n- 免疫系统：免疫器官（骨髓、胸腺、脾、淋巴结、扁桃体）、免疫细胞（树突状细胞、巨噬细胞、B 细胞、T 细胞）、免疫活性物质（抗体、细胞因子、溶菌酶）。B 细胞在骨髓中成熟，T 细胞在胸腺中成熟。\n- 免疫系统三大功能：免疫防御、免疫自稳、免疫监视。\n- 体液免疫：病原体与 B 细胞接触（第一信号）+ 辅助性 T 细胞表面特定分子变化并与 B 细胞结合（第二信号），在细胞因子作用下 B 细胞增殖分化为浆细胞（分泌抗体，唯一不能识别抗原的）和记忆 B 细胞。\n- 细胞免疫：细胞毒性 T 细胞识别并裂解被病原体感染的靶细胞，释放的病原体再由抗体或吞噬细胞清除。\n- 二次免疫：记忆细胞迅速增殖分化，反应更快、更强、抗体更多。疫苗利用此原理。\n- 免疫失调：过敏反应（已免疫机体再次接触过敏原，有明显遗传倾向）；自身免疫病（类风湿性关节炎、系统性红斑狼疮）；免疫缺陷病（艾滋病，HIV 主要攻击辅助性 T 细胞）。\n- 器官移植主要问题是免疫排斥，关键在于 HLA 配型；使用免疫抑制剂。\n\n### 5. 植物生命活动的调节\n\n- 生长素发现史：达尔文（尖端受单侧光刺激，向下传递某种“影响”）→ 鲍森—詹森（可透过琼脂片）→ 拜尔（分布不均引起弯曲）→ 温特（琼脂块实验，命名生长素）→ 生长素化学本质是吲哚乙酸（IAA）。\n- 向光性原因：单侧光使生长素在尖端由向光侧运往背光侧，背光侧生长更快。感光部位是尖端，弯曲部位是尖端下方。\n- 运输：极性运输（形态学上端 → 下端，主动运输）；成熟组织中可经韧皮部进行非极性运输。\n- 作用特点：低浓度促进生长，高浓度抑制生长；敏感度根 > 芽 > 茎。体现这一特点的例：顶端优势（打顶解除）、根的向地性；茎的背地性和向光性只体现促进。\n\n| 植物激素 | 主要合成部位 | 主要作用 |\n| --- | --- | --- |\n| 生长素 | 芽、幼嫩的叶、发育中的种子 | 促进细胞伸长生长、诱导细胞分化、促进扇插枝条生根、影响果实发育 |\n| 赤霉素 | 幼芽、幼根、未成熟种子 | 促进细胞伸长、促进种子萌发、开花和果实发育（水稻“恶苗病”） |\n| 细胞分裂素 | 主要在根尖 | 促进细胞分裂、促进芽分化、延缓叶片衰老 |\n| 脱落酸 | 根冠、萎蔫的叶片 | 抑制细胞分裂、促进气孔关闭、促进叶和果实衰老脱落、维持种子休眠 |\n| 乙烯 | 植物体各个部位 | 促进果实成熟、促进开花、促进叶花果脱落 |\n\n- 激素间关系：生长素与细胞分裂素协同促进细胞分裂；赤霉素促进种子萌发而脱落酸抑制，二者作用相反。决定器官生长发育的往往是激素的相对含量。\n- 植物生长调节剂：人工合成，如 2,4-D、NAA（生长素类）、乙烯利（催熟）、矮壮素。\n- 环境因素：光作为信号（光敏色素吸收红光和远红光），调控种子萌发、开花；温度（春化作用、年轮）；重力（平衡石假说）。植物生长发育 = 基因表达调控 + 激素调节 + 环境因素调节。\n\n## 第六部分 高中选择性必修 2·生物与环境\n\n本册从种群、群落、生态系统三个层次解释生物与环境的关系，落脚到可持续发展。\n\n### 1. 种群\n\n- 种群数量特征：种群密度（最基本）；出生率和死亡率、迁入率和迁出率直接决定种群密度；年龄结构（增长型、稳定型、衰退型）预测变化趋势；性别比例影响出生率（性引诱剂诱杀害虫雄性）。\n- 调查方法：样方法（植物、活动能力弱的动物；随机取样，五点取样法或等距取样法；计数“计上不计下，计左不计右”）、标记重捕法（活动能力强的动物）、黑光灯诱捕法（趋光性昆虫）。\n\n```latex\nN = \\frac{\\text{初次捕获并标记数} \\times \\text{重捕总数}}{\\text{重捕中标记数}}\n```\n\n- 标记物脱落或被标记个体更难捕获 → 估算值偏大。\n- “J”形增长：食物和空间充裕、气候适宜、没有敌害等理想条件；λ 为该种群数量是前一年的倍数。\n\n```latex\nN_t = N_0 \\lambda^t\n```\n\n- “S”形增长：资源和空间有限，存在环境容纳量 K（一定环境条件所能维持的种群最大数量）。K/2 时增长速率最大，渔业捕捞后保留在 K/2 左右；防治鼠害应降低 K 值（硬化地面、妥善存放食物）。\n- 影响种群数量的因素：非密度制约因素（气候、山火等）与密度制约因素（食物、天敌、寄生等）。\n- 探究培养液中酵母菌数量变化：血细胞计数板（先盖盖玻片再滴培养液）、抽样前轻轻振荡、酒精浓度过高先稀释。\n\n### 2. 群落\n\n- 群落：同一时间聚集在一定区域中各种生物种群的集合。区别不同群落的重要特征是物种组成；丰富度是物种数目的多少。\n- 种间关系：原始合作（寄居蟹与海葵，分开仍能独立生活）、互利共生（豆科植物与根瘤菌）、捕食、种间竞争（大小草履虫）、寄生（噬菌体与细菌）。捕食曲线“先增加者先减少为被捕食者”。\n- 空间结构：垂直结构（分层，植物受光照影响，动物受栖息空间和食物影响）与水平结构（镶嵌分布）。一片竹林里的竹子高低错落不是垂直结构（同一种群）。\n- 生态位：一个物种在群落中的地位或作用（栖息地、食物、天敌与其他物种的关系）。生态位重叠越多，竞争越激烈。\n- 群落演替：初生演替（裸岩、沙丘、冰川泥：地衣 → 苔藓 → 草本 → 灌木 → 乔木）与次生演替（弃耕农田、火灾后森林，保留土壤条件和繁殖体，速度快）。人类活动使演替按不同于自然演替的速度和方向进行。干旱地区未必能演替到森林。\n- 群落类型：荒漠、草原、森林生物群落等，生物各自适应其环境。\n- 土壤小动物丰富度调查：取样器取样；统计法为记名计算法和目测估计法；诱虫器利用趋暗、趋湿、避高温。\n\n### 3. 生态系统的结构\n\n- 组成成分：非生物的物质和能量、生产者（自养型，含硝化细菌、蓝细菌）、消费者、分解者（腐生细菌和真菌，还有蚯蚓、秃鹫等腐食动物）。生产者是生态系统的基石。\n- 营养结构：食物链和食物网；生产者是第一营养级，初级消费者是第二营养级。食物网越复杂，生态系统抵抗外界干扰能力越强。\n\n### 4. 生态系统的功能：能量流动、物质循环、信息传递\n\n- 能量流动起点：生产者固定的太阳能。某营养级同化量 = 摄入量 − 粪便量；同化量 = 呼吸散失 + 用于自身生长发育繁殖（流向下一营养级 + 流向分解者 + 未利用）。粪便中的能量属于上一营养级。\n- 特点：单向流动、逐级递减；相邻营养级传递效率约 10%–20%。食物链一般不超过 5 个营养级。\n\n```latex\n\\text{能量传递效率} = \\frac{\\text{下一营养级同化量}}{\\text{本营养级同化量}} \\times 100\\%\n```\n\n- 生态金字塔：能量金字塔永远正置；数量金字塔可倒置（一棵树上很多虫）；生物量金字塔可倒置（海洋浮游植物）。\n- 研究能量流动的意义：实现能量多级利用（桑基鱼塘、秸秆喂畜、粪便制沼气），提高能量利用率（不是传递效率）；调整能量流动关系，使能量持续高效流向对人类最有益的部分（除草、杀虫）。\n- 碳循环：碳在生物群落与无机环境之间主要以 CO₂ 形式循环，在生物群落内部以含碳有机物形式传递。进入生物群落：光合作用、化能合成；返回：呼吸作用、分解作用、化石燃料燃烧。物质循环具有全球性。\n- 碳达峰与碳中和：我国力争 2030 年前碳达峰、2060 年前碳中和。\n- 生物富集：难以降解的化合物（铅、镉、汞、DDT）在机体内浓度超过环境浓度，沿食物链逐渐在顶级消费者中积累，也具有全球性。\n- 能量流动与物质循环：物质是能量沿食物链（网）流动的载体，能量是物质在生态系统中循环往复的动力；二者同时进行、相互依存。\n- 信息传递：物理信息（光、声、温度、磁力）、化学信息（性外激素、生物碱）、行为信息（蜜蜂跳舞、孔雀开屏）。作用：生命活动的正常进行、生物种群的繁衍离不开信息传递；调节种间关系，维持生态系统平衡与稳定。信息传递往往是双向的。\n\n### 5. 生态系统的稳定性\n\n- 生态平衡：结构平衡、功能平衡、收支平衡。负反馈调节是生态系统自我调节能力的基础。\n- 抵抗力稳定性 vs 恢复力稳定性：一般组分越多、食物网越复杂，抵抗力稳定性越高，恢复力稳定性越低（热带雨林 vs 草原）；但冻原、荒漠二者都低。\n- 制作生态缸：密闭、透明、放在散射光下，生物成分齐全且比例适当。\n\n### 6. 人与环境\n\n- 生态足迹：维持某一人口生存所需的生产资源和吸纳废物的土地及水域面积。生活方式不同，生态足迹大小不同。\n- 全球性生态环境问题：全球气候变暖、臭氧层破坏、酸雨、水资源短缺、土地荒漠化、生物多样性丧失、环境污染。\n- 生物多样性的价值：直接价值（食用、药用、科研、文学艺术创作、旅游观赏）、间接价值（生态功能，明显大于直接价值）、潜在价值。\n- 保护措施：就地保护（最有效，建立自然保护区、国家公园）、易地保护（动物园、植物园、繁育中心）、建立精子库和种子库等生物技术保护、法制管理。保护不意味着禁止开发利用，而是合理利用。\n- 生态工程基本原理：自生、循环、协调、整体。实例：农村综合发展型生态工程、湿地生态恢复、矿区废弃地生态恢复（关键是植被恢复及其所必需的土壤微生物群落重建）。\n- 可持续发展：“在不牺牲未来几代人需要的情况下，满足我们这代人的需要”；“绿水青山就是金山银山”。\n\n## 第七部分 高中选择性必修 3·生物技术与工程\n\n本册四大模块——发酵工程、细胞工程、基因工程、生物技术的安全性与伦理问题——都围绕“如何按人的意愿利用和改造生物”。\n\n### 1. 传统发酵技术\n\n| 产品 | 菌种 | 代谢类型 | 关键条件 |\n| --- | --- | --- | --- |\n| 果酒 | 酵母菌（真核） | 兼性厌氧 | 先通气后密封，18–30 ℃，定时排气；发酵瓶留约 1/3 空间 |\n| 果醋 | 醋酸菌（原核） | 好氧 | 持续通入无菌空气，30–35 ℃；糖源充足时分解糖，缺糖时将乙醇变为乙醛再变为醋酸 |\n| 腐乳 | 毛霉等（真核） | 好氧 | 蛋白酶和脂肪酶分解蛋白质和脂肪 |\n| 泡菜 | 乳酸菌（原核） | 厌氧 | 泡菜坐用水密封，盐水精过研煮后冷却；亚硝酸盐含量先升后降 |\n\n- 果酒鉴定：酸性重铬酸钾 → 灰绿色。果酒 → 果醋：升温并通入无菌空气。\n\n### 2. 微生物的培养技术及应用\n\n- 培养基成分：水、碳源、氮源、无机盐，并满足 pH、特殊营养物质和氧气的需求。按物理性质分液体、固体（加琼脂）培养基；按功能分选择培养基（允许特定种类生长）与鉴别培养基。\n- 无菌技术：消毒（煮沸、巴氏消毒、化学药剂、紫外线）与灭菌（湿热灭菌——高压蒸汽灭菌锅用于培养基；干热灭菌——玻璃器皿；灶烧灭菌——接种环）。灭菌杀死包括芽孢和孢子在内的全部微生物。\n- 倒平板：培养基冷却至 50 ℃ 左右，酒精灯旁操作，凝固后将平板倒置（防水滴污染、防水分蒸发）。\n- 纯化方法：平板划线法（每次划线前后都灶烧接种环，从上一次划线末端开始）与稀释涂布平板法（可用于计数）。\n- 计数：选菌落数 30–300 的平板。估算值偏小，因为两个或多个细胞连在一起时只长出一个菌落。另有显微镜直接计数（结果偏大，含死菌）。\n\n```latex\n\\text{每克样品菌数} = \\frac{C}{V} \\times M\n```\n\n- （C：平均菌落数；V：涂布体积 mL；M：稀释倍数）\n- 分离分解尿素的细菌：以尿素为唯一氮源的选择培养基；分解尿素产氨使 pH 升高，酷红指示剂变红。分解纤维素的微生物：刚果红染色，菌落周围出现透明圈。\n- 发酵工程：选育菌种 → 扩大培养 → 配制培养基 → 灭菌 → 接种 → 发酵罐内发酵（中心环节，控制温度、pH、溶解氧）→ 分离提纯。产品：啤酒、味精（谷氨酸棒状杆菌）、抗生素、单细胞蛋白（微生物菌体本身）、微生物农药。\n\n### 3. 植物细胞工程\n\n- 植物组织培养：离体外植体 →（脱分化）→ 愈伤组织 →（再分化）→ 芽、根 → 完整植株。原理：植物细胞全能性。生长素与细胞分裂素比值高利于生根，低利于生芽。愈伤组织诱导一般不需光，再分化需光。\n- 植物体细胞杂交：纤维素酶和果胶酶去壁 → 原生质体融合（PEG、电融合、离心）→ 再生细胞壁（融合完成的标志）→ 组织培养。意义：打破生殖隔离，实现远缘杂交育种（白菜—甘蓝）。\n- 应用：快速繁殖（微型繁殖）、作物脱毒（茂尖分生组织几乎不含病毒）、单倍体育种、突变体利用、细胞产物的工厂化生产（紫杉醇）。\n\n### 4. 动物细胞工程\n\n- 动物细胞培养：用胰蛋白酶或胶原蛋白酶分散细胞；培养基常加入血清；95% 空气 + 5% CO₂（维持 pH）；存在细胞贴壁生长和接触抑制，需传代培养。\n- 干细胞：胚胎干细胞（ES 细胞）具有发育的全能性；诱导多能干细胞（iPS 细胞）由体细胞诱导，可避免免疫排斥和伦理问题。\n- 动物细胞融合：可用灭活病毒诱导（动物特有）。最重要的用途是制备单克隆抗体。\n- 单克隆抗体制备：免疫小鼠获得 B 淋巴细胞 + 骨髓瘤细胞 → 融合 → 第一次筛选（特定选择培养基，得杂交瘤细胞）→ 第二次筛选（克隆化培养和抗体检测，得能产生所需抗体的杂交瘤细胞）→ 体外培养或小鼠腹腔内增殖。杂交瘤细胞既能大量增殖又能产生特异性抗体。应用：诊断试剂、抗体—药物偶联物（ADC）。\n- 动物体细胞核移植：去核的 MⅡ 中期卵母细胞 + 供体体细胞核 → 重构胚 → 胚胎移植。证明动物细胞核具有全能性。克隆羊“多莉”（1996）、我国体细胞克隆猴“中中”“华华”（2017–2018）。克隆动物性状主要与供核者相同。\n- 胚胎工程：体外受精（精子获能、卵母细胞培养到 MⅡ 中期）、胚胎移植（供体与受体同期发情处理，受体对外来胚胎基本不发生免疫排斥）、胚胎分割（桑葚胚或囊胚，囊胚内细胞团要均等分割，属无性繁殖）。\n- 早期胚胎发育：受精卵 → 卵裂（细胞数增加，总体积不增加）→ 桑葚胚 → 囊胚（内细胞团发育为胎儿各种组织，滋养层发育为胎膜和胎盘）→ 原肠胚。\n\n### 5. 基因工程\n\n- 三种基本工具：限制性内切核酸酶（“分子手术刀”，识别特定核苷酸序列并切开磷酸二酯键，产生黏性末端或平末端）；DNA 连接酶（“分子缝合针”，E. coli DNA 连接酶只连黏性末端，T4 DNA 连接酶两种都能连）；载体（“分子运输车”，常用质粒，需有限制酶切点、标记基因、能自我复制）。\n- 四个基本步骤：\n  1. 目的基因的筛选与获取（从基因文库中获取、PCR 扩增、人工合成）\n  2. 基因表达载体的构建（核心步骤）：启动子 + 目的基因 + 终止子 + 标记基因 + 复制原点。启动子是 RNA 聚合酶识别和结合的部位\n  3. 将目的基因导入受体细胞：植物——农杆菌转化法（Ti 质粒的 T-DNA 可转移并整合到染色体 DNA 上）、花粉管通道法；动物——显微注射法（受精卵）；微生物——Ca²⁺ 处理使细胞处于易吸收周围 DNA 的状态\n  4. 目的基因的检测与鉴定：分子水平（PCR 检测是否插入和转录，抗原—抗体杂交检测是否翻译）、个体生物学水平（抗虫、抗病接种实验）\n- PCR：变性（90 ℃ 以上，双链解开）→ 复性（50 ℃ 左右，引物与模板结合）→ 延伸（72 ℃ 左右，耐高温的 Taq DNA 聚合酶从引物 3′ 端延伸）。需要两种引物、四种 dNTP、Mg²⁺。理论上 n 次循环后产物为 2ⁿ 倍。产物用缺脂糖凝胶电泳鉴定。\n- DNA 的粗提取：DNA 不溶于酒精（预冷的体积分数 95% 酒精），溶于 2 mol/L NaCl；二苯胺沪水浴加热呈蓝色。\n- 蛋白质工程：从预期的蛋白质功能出发 → 设计预期结构 → 推测氨基酸序列 → 找到对应的核苷酸序列，修饰或合成基因。被称为第二代基因工程。\n- 应用：转基因抗虫棉（Bt 毒蛋白基因）、乳腺生物反应器（目的基因与乳腺蛋白基因启动子等调控元件重组）、工程菌生产胰岛素、基因治疗。\n- 基因编辑：CRISPR/Cas9 系统由 sgRNA 引导 Cas9 在特定位点切断 DNA，实现定点敲除或修改；2020 年诺贝尔化学奖。\n\n### 6. 生物技术的安全性与伦理问题\n\n- 转基因产品安全性：食物安全、生物安全（基因漂移、影响生物多样性）、环境安全。我国对转基因产品实行标识制度。\n- 伦理：我国不赞成、不允许、不支持、不接受任何生殖性克隆人实验，不反对治疗性克隆；试管婴儿与“设计试管婴儿”（植入前遗传学诊断）的区别；基因检测与基因歧视。\n- 禁止生物武器：我国在任何情况下不发展、不生产、不储存生物武器，并反对其技术和设备的扩散。\n\n## 第八部分 实验与科学探究方法汇总\n\n实验题的关键是找准自变量、因变量和无关变量，并遵循对照原则和单一变量原则。\n\n### 1. 科学探究的一般过程\n\n1. 提出问题\n2. 作出假设\n3. 制定计划（设置对照组与实验组、控制变量、设置重复组）\n4. 实施计划，收集数据\n5. 得出结论（与假设不符时应重新假设或重做实验）\n6. 表达和交流\n\n### 2. 常用研究方法\n\n| 方法 | 典型实例 |\n| --- | --- |\n| 不完全归纳法 | 细胞学说的建立 |\n| 假说—演绎法 | 孟德尔遗传定律、摩尔根果蝇实验、DNA 半保留复制的证明 |\n| 类比推理法 | 萨顿提出基因在染色体上 |\n| 同位素标记法 | 分泌蛋白运输（³H）、鲁宾和卡门（¹⁸O）、卡尔文循环（¹⁴C）、噬菌体侵染（³⁵S、³²P）、半保留复制（¹⁵N，稳定同位素） |\n| 模型建构法 | DNA 双螺旋（物理模型）、种群增长曲线（数学模型）、血糖调节图解（概念模型） |\n| 差速离心法 | 分离细胞器 |\n| 密度梯度离心法 | DNA 半保留复制实验 |\n| 纸层析法 | 分离绿叶中的色素 |\n| 加法原理 / 减法原理 | 转化实验中艾弗里分别用酶去除物质（减法）；切除腺体再补充激素（先减后加） |\n| 荷光标记法 | 人鼠细胞融合实验证明细胞膜具有流动性、基因在染色体上的定位 |\n\n### 3. 高中教材重要实验速查\n\n| 实验 | 材料 | 试剂或关键操作 | 现象或结果 |\n| --- | --- | --- | --- |\n| 检测还原糖 | 苹果、梨匀浆 | 斐林试剂（甲乙液等量混合、现配现用），50–65 ℃ 水浴 | 砖红色沉淀 |\n| 检测脂肪 | 花生子叶切片 | 苏丹Ⅲ染色，体积分数 50% 酒精洗去浮色，显微镜观察 | 橘黄色脂肪颗粒 |\n| 检测蛋白质 | 蛋清、豆浆 | 双缩脲试剂，先 A 后 B | 紫色 |\n| 用高倍镜观察叶绿体和细胞质流动 | 藓类小叶、黑藻 | 保持有水状态 | 绿色、扁平楕球形叶绿体随细胞质流动 |\n| 植物细胞质壁分离与复原 | 紫色洋葱外表皮 | 0.3 g/mL 蔗糖溶液 → 清水，引流法，低倍镜即可观察 | 液泡变小、颜色变深；复原 |\n| 探究酶的高效性 | 过氧化氢、肝脏研磨液、FeCl₃ | 比较气泡产生速率、卫生香复燃 | 酶组更快 |\n| 探究酵母菌细胞呼吸方式 | 酵母菌培养液 | 有氧组通气前用 NaOH 吸收 CO₂；无氧组封口放置一段时间再连接 | 两组都产生 CO₂，只有无氧组产生酒精 |\n| 绿叶中色素的提取和分离 | 新鲜菠菜叶 | 无水乙醇提取；SiO₂ 助研磨充分；CaCO₃ 防色素被破坏；层析液不能没及滤液细线 | 四条色素带 |\n| 观察根尖分生区有丝分裂 | 洋葱根尖 2–3 mm | 解离（盐酸 + 酒精）→ 漂洗 → 染色（甘紫溶液或醇酸洋红）→ 制片 | 大多数细胞处于间期；细胞已死亡，不能看到动态过程 |\n| 低温诱导植物细胞染色体数目变化 | 洋葱根尖 | 4 ℃ 低温；卡诺氏液固定，体积分数 95% 酒精冲洗 | 少数细胞染色体数加倍 |\n| 性状分离比模拟 | 两个小桶与彩球 | 每桶两种球数量相等，抓取后放回摇匀 | 组合接近 1:2:1 |\n| 探究生长素类似物促进扇插枝条生根的最适浓度 | 枝条 | 先做预实验确定大致范围；浸泡法（低浓度、时间长）或氾蘸法（高浓度、时间短） | 生根数最多的浓度附近即最适浓度 |\n| DNA 的粗提取与鉴定 | 洋葱、鸡血细胞液 | 预冷酒精析出；2 mol/L NaCl 溶解 | 二苯胺沪水浴后显蓝色 |\n\n### 4. 初中经典探究\n\n- 光对鼠妇生活的影响（自变量：光；每组 10 只，取平均值减少误差）。\n- 种子萌发的环境条件（水、空气、温度，分别设置对照）。\n- 绿叶在光下制造淀粉；光合作用产生氧气（金鱼藻、带火星的小木条复燃）；吸收 CO₂（NaOH 吸收对照）。\n- 馒头在口腔中的变化：37 ℃ 水浴，清水对照，滴碘液不变蓝说明淀粉已被分解。\n- 观察小鱼尾鳍内血液流动：红细胞单行通过的是毛细血管；用湿棉絮包裹鱼鳃保持呼吸。\n\n## 附录\n\n### A. 易混概念辨析\n\n| 易混概念 | 关键区别 |\n| --- | --- |\n| 原核生物 / 真核生物 | 有无核膜；“菌”字前带“杆、球、螺旋、弧”多为细菌（原核），酵母菌、霉菌、蘑菇为真菌（真核） |\n| 蓝细菌 / 绿藻 | 蓝细菌是原核生物无叶绿体；绿藻是真核生物有叶绿体 |\n| 扩散 / 渗透 | 渗透是水（溶剂）分子通过半透膜的扩散 |\n| 半透膜 / 选择透过性膜 | 半透膜可以是非生物材料，按孔径大小筛选；选择透过性膜是活的生物膜 |\n| 消毒 / 灭菌 | 消毒杀死部分微生物；灭菌杀死全部，包括芽孢和孢子 |\n| 染色体 / 染色单体 / DNA | 数染色体看着丝粒；复制后一条染色体含 2 条染色单体、2 个 DNA |\n| 同源染色体 / 姐妹染色单体 | 前者一条来自父方、一条来自母方；后者由同一条染色体复制而来 |\n| 基因突变 / 染色体变异 | 前者光镜下看不到，产生新基因；后者光镜下可见 |\n| 物种 / 种群 | 物种以生殖隔离划界；种群是一定区域内同种生物全部个体 |\n| 初生演替 / 次生演替 | 起点是否保留土壤条件和繁殖体 |\n| 摄入量 / 同化量 | 同化量 = 摄入量 − 粪便量 |\n| 传递效率 / 利用率 | 传递效率是相邻营养级同化量之比，一般不能人为提高；利用率可通过多级利用提高 |\n| 非特异性免疫 / 特异性免疫 | 前者生来就有、对多种病原体都起作用（第一、二道防线）；后者后天获得、针对特定抗原（第三道防线） |\n| 抗原 / 抗体 | 抗原引起免疫反应（疫苗、病原体）；抗体是浆细胞分泌的免疫球蛋白 |\n| 激素 / 酶 | 激素只传递信息、用后失活；酶催化反应、反应前后不变 |\n| 外分泌腺 / 内分泌腺 | 前者有导管（汗腺、唾液腺、肝脏）；后者无导管，分泌物直接进入血液；胰腺兼有两者 |\n| 动脉血 / 动脉中的血 | 以含氧量区分；肺动脉中流的是静脉血 |\n| 排泄 / 排遗 | 排泄排出代谢废物；排遗排出食物残渣 |\n\n### B. 重要数据\n\n| 项目 | 数值 |\n| --- | --- |\n| 人体染色体 | 23 对（46 条），其中 22 对常染色体 + 1 对性染色体 |\n| 人类基因组测序 | 24 条染色体（22 + X + Y），约 30 亿碱基对，约 2 万个蛋白质编码基因 |\n| 氨基酸种类 | 人体蛋白质中 21 种，必需氨基酸成人 8 种 |\n| 密码子 | 64 种（含 3 种一般终止密码子） |\n| 血浆 pH | 7.35–7.45 |\n| 空腹血糖 | 3.9–6.1 mmol/L |\n| 人体体温 | 约 37 ℃ |\n| 原尿 / 终尿 | 约 180 L/天 / 约 1.5 L/天 |\n| 能量传递效率 | 10%–20% |\n| 分裂间期所占时间 | 约 90%–95% |\n| 人体骨骼 | 成人约 206 块 |\n| 大气中 CO₂ 体积分数 | 约 0.04% |\n\n### C. 生物学史年表\n\n| 时间 | 人物 | 事件 |\n| --- | --- | --- |\n| 1665 | 罗伯特·胡克 | 用显微镜观察软木切片，命名“细胞” |\n| 1674 前后 | 列文虎克 | 首次观察到活的细菌等微生物 |\n| 1753 | 林奈 | 推行双名法 |\n| 1771 | 普利斯特利 | 植物可以更新空气 |\n| 1838–1839 | 施莱登、施旺 | 建立细胞学说 |\n| 1858 | 德尔向 | 细胞通过分裂产生新细胞 |\n| 1859 | 达尔文 | 出版《物种起源》 |\n| 1862 前后 | 巴斯德 | 鹅颈瓶实验 |\n| 1866 | 孟德尔 | 发表豌豆杂交实验，揭示遗传定律 |\n| 1902 | 贝利斯、斯塔林 | 发现促胰液素 |\n| 1903 | 萨顿 | 提出基因在染色体上的假说 |\n| 1910 | 摩尔根 | 果蝇白眼实验 |\n| 1928 | 格里菲思 | 肺炎链球菌转化实验；同年弗莱明发现青霉素 |\n| 1944 | 艾弗里等 | 证明 DNA 是转化因子 |\n| 1952 | 赫尔希、蔡斯 | 噬菌体侵染实验 |\n| 1953 | 沃森、克里克 | DNA 双螺旋结构模型；同年米勒实验 |\n| 1958 | 梅塞尔森、斯塔尔；克里克 | 证明半保留复制；提出中心法则 |\n| 1965 | 中国科学家 | 世界上首次人工合成具有生物活性的结晶牛胰岛素 |\n| 1972 | 辛格、尼科尔森 | 生物膜流动镶嵌模型 |\n| 1973 | 科恩、博伊尔 | 第一次 DNA 重组实验，基因工程诞生 |\n| 1983 | 穆利斯 | 发明 PCR 技术 |\n| 1996 | 英国罗斯林研究所 | 克隆羊“多莉”诞生 |\n| 2003 | 多国科学家（含中国） | 人类基因组计划完成 |\n| 2006 | 山中伸弥 | 建立 iPS 细胞 |\n| 2012 | 杜德纳、卡彭蒂耶 | CRISPR/Cas9 基因编辑技术 |\n| 2015 | 屠呦呦 | 因发现青蒿素获诺贝尔生理学或医学奖 |\n| 2018 | 中国科学院神经科学研究所 | 体细胞克隆猴“中中”“华华”公布 |\n| 2021 | 中国科学院天津工业生物技术研究所 | 实验室内从 CO₂ 到淀粉的人工合成 |\n\n### D. 常用术语中英对照\n\n| 中文 | 英文 |\n| --- | --- |\n| 细胞 / 细胞膜 / 细胞核 | cell / cell membrane / nucleus |\n| 线粒体 / 叶绿体 / 核糖体 | mitochondrion / chloroplast / ribosome |\n| 内质网 / 高尔基体 / 溶酶体 | endoplasmic reticulum / Golgi apparatus / lysosome |\n| 蛋白质 / 氨基酸 / 酶 | protein / amino acid / enzyme |\n| 光合作用 / 细胞呼吸 | photosynthesis / cellular respiration |\n| 有丝分裂 / 减数分裂 | mitosis / meiosis |\n| 基因 / 等位基因 / 基因型 / 表型 | gene / allele / genotype / phenotype |\n| 显性 / 隐性 / 纯合子 / 杂合子 | dominant / recessive / homozygote / heterozygote |\n| 转录 / 翻译 / 密码子 | transcription / translation / codon |\n| 突变 / 自然选择 / 进化 | mutation / natural selection / evolution |\n| 稳态 / 内环境 / 反馈 | homeostasis / internal environment / feedback |\n| 神经元 / 突触 / 神经递质 | neuron / synapse / neurotransmitter |\n| 激素 / 抗原 / 抗体 | hormone / antigen / antibody |\n| 种群 / 群落 / 生态系统 / 生物圈 | population / community / ecosystem / biosphere |\n| 食物链 / 食物网 / 生态位 | food chain / food web / niche |\n| 生物多样性 / 可持续发展 | biodiversity / sustainable development |\n| 质粒 / 限制酶 / 聚合酶链式反应 | plasmid / restriction enzyme / PCR |\n| 单克隆抗体 / 干细胞 / 基因编辑 | monoclonal antibody / stem cell / gene editing |", "extras": [], "parts": [["导读", "导读"], ["小学", "小学科学中的生命世界"], ["初中", "初中生物全册"], ["高中", "必修 1 · 分子与细胞"], ["高中", "必修 2 · 遗传与进化"], ["高中", "选择性必修 1 · 稳态与调节"], ["高中", "选择性必修 2 · 生物与环境"], ["高中", "选择性必修 3 · 生物技术与工程"], ["实验", "实验与科学探究方法"], ["附录", "附录"]]}, "earth": {"title": "地球科学知识大全", "format": "md", "content": "## 导读\n\n地球科学研究我们脚下的岩石、头顶的大气、流动的水和地球在宇宙中的位置。在国内课程中，它分散在小学科学的“地球与宇宙”领域、初中地理（部分地区为科学课）和高中地理的自然地理部分。本册按学段把这些内容串成一条线：小学认识现象，初中学会读图和描述分布，高中用原理解释成因和过程。\n\n| 学段 | 对应课程 | 核心问题 |\n| --- | --- | --- |\n| 小学 1–6 年级 | 科学（地球与宇宙领域） | 地球是什么样的？昼夜和四季怎样形成？ |\n| 初中 7–8 年级 | 地理七上、七下、八上、八下 | 怎样用地图描述地球？世界和中国的自然环境有什么特点？ |\n| 高中必修 1 | 地理（自然地理） | 大气、水、地貌、土壤、植被各有什么规律？ |\n| 选择性必修 1 | 自然地理基础 | 地球运动、岩石圈、大气运动、洋流的原理是什么？ |\n| 选择性必修 2、3 及必修 2 | 区域发展、资源环境、人文地理 | 人类怎样与自然环境协调发展？ |\n\n**地球的圈层**（贯穿全部学段）：外部圈层为大气圈、水圈、生物圈；内部圈层为地壳、地幔、地核。岩石圈由地壳和上地幔顶部（软流层以上）组成，是人类活动的主要舞台。\n\n**使用建议**：读图是地球科学的基本功，几乎每个知识点都对应一种图：经纬网图、等高线图、光照图、气压带风带图、洋流图、地质剖面图。复习时每学一条规律，就在图上找到它的位置。\n\n## 第一部分 小学科学中的地球与宇宙\n\n小学阶段以观察和模拟实验为主，目标是知道昼夜、四季、月相等现象的成因，认识地球表面的岩石、土壤和水。\n\n### 1. 地球的形状与表面\n\n- 地球是一个两极稍扁、赤道略鼓的球体，平均半径约 6371 km，赤道周长约 4 万 km。\n- 地球是球体的证据：远去的船先消失船身、后消失桅杆；月食时地球影子是圆形；麦哲伦船队环球航行；卫星照片。\n- 地球表面约 71% 是海洋、29% 是陆地，因此从太空看地球是一颗“蓝色星球”。\n- 地球表面有高山、高原、平原、丘陵、盆地等地形，也有河流、湖泊、海洋等水体。\n\n### 2. 昼夜与四季\n\n- 地球不停地自西向东自转，一周约一天，形成昼夜交替；太阳因此看起来东升西落。\n- 地球绕太阳公转一周约一年；地轴倾斜且指向不变，使太阳直射点南北移动，形成四季。\n- 一天中影子的变化：早晚长、正午短；北半球正午影子朝北。\n- 模拟实验：用手电筒当太阳、地球仪当地球，转动地球仪观察昼夜交替。\n\n### 3. 月球与太阳系\n\n- 月球是地球唯一的天然卫星，本身不发光，反射太阳光；表面有环形山，没有大气和液态水。\n- 月相变化周期约 29.5 天：新月 → 上弦月 → 满月 → 下弦月 → 新月。农历初一前后为新月，十五前后为满月。\n- 太阳系八大行星由近及远：水星、金星、地球、火星、木星、土星、天王星、海王星。\n- 太阳是离地球最近的恒星，日地距离约 1.5 亿 km，阳光到达地球约需 8 分 20 秒。\n- 星座：北斗七星属于大熊座；沿“勺口”两颗星连线延长约 5 倍可找到北极星，北极星指示正北。\n\n### 4. 岩石、土壤与水\n\n- 常见岩石：花岗岩（颗粒明显）、砂岩（摸起来粗糙）、页岩（层状易剥开）、大理岩（遇稀盐酸冒泡）。\n- 岩石在风、水、温度变化和生物作用下会逐渐破碎，这叫风化；风化产物与腐殖质等混合形成土壤。\n- 土壤由沙、黏土、腐殖质、水和空气组成；砂质土透水性好，黏质土保水性好，壤土最适合植物生长。\n- 水的循环：蒸发 → 凝结成云 → 降水 → 汇入河流湖海或渗入地下 → 再蒸发。\n\n### 5. 天气与自然灾害\n\n- 天气要素：气温、降水量、风向风速、云量；常用工具有温度计、雨量器、风向标。\n- 气温一天中一般午后 2 时左右最高，日出前后最低。\n- 常见自然灾害：地震、火山喷发、台风、洪水、干旱、泥石流。地震时“伏地、遮挡、手抓牢”，就近躲避在坚固桌下或承重墙角。\n\n## 第二部分 初中：地球与地图\n\n初中地理第一课就是地球仪和地图：学会用经纬网定位、用比例尺量距离、用等高线读地形，这是整个地球科学的读图基础。\n\n### 1. 经纬网\n\n| 比较 | 纬线 | 经线 |\n| --- | --- | --- |\n| 形状 | 圆，相互平行 | 半圆，交于两极 |\n| 长度 | 赤道最长，向两极递减 | 都相等 |\n| 指示方向 | 东西方向 | 南北方向 |\n| 度数 | 0°（赤道）至 90°N/S | 0°（本初子午线）至 180°E/W |\n| 分界 | 赤道分南北半球 | 20°W 和 160°E 组成的经线圈分东西半球 |\n\n- 低纬度 0°–30°，中纬度 30°–60°，高纬度 60°–90°。\n- 判读口诀：北纬向北度数增大，东经向东度数增大。\n- 赤道上经度相差 1° 约 111 km；同一经线上纬度相差 1° 也约 111 km。\n\n### 2. 地球的运动\n\n| 运动 | 方向 | 周期 | 产生的现象 |\n| --- | --- | --- | --- |\n| 自转 | 自西向东（北极上空看逆时针） | 约 24 小时 | 昼夜交替、时间差异 |\n| 公转 | 自西向东（北极上空看逆时针） | 约 365 天 | 四季变化、昼夜长短变化、五带划分 |\n\n- 二分二至：春分（3 月 21 日前后）、秋分（9 月 23 日前后）太阳直射赤道，全球昼夜平分；夏至（6 月 22 日前后）直射北回归线，北半球昼最长；冬至（12 月 22 日前后）直射南回归线，北半球昼最短。\n- 五带：热带（南北回归线之间，有太阳直射）、北温带和南温带、北寒带和南寒带（极圈以内，有极昼极夜）。\n\n### 3. 地图三要素\n\n- 比例尺 = 图上距离 / 实地距离。比例尺越大，表示范围越小、内容越详细。\n- 方向：一般地图“上北下南、左西右东”；有指向标的按指向标；经纬网图按经纬线定方向。\n- 图例和注记：用符号和文字表示地理事物。\n\n### 4. 等高线地形图\n\n- 海拔：从海平面算起的垂直高度；相对高度：两地海拔之差。\n- 等高线密集处坡陡，稀疏处坡缓。\n- 山脊：等高线向海拔低处凸出；山谷：等高线向海拔高处凸出（“凸高为谷，凸低为脊”）；山谷常有河流。\n- 鞍部：两个山顶之间相对低洼的部位；陡崖：多条等高线重合处。\n- 分层设色地形图：绿色表示平原，黄色、褐色表示高原和山地，蓝色表示水域。\n\n## 第三部分 初中：陆地与海洋、天气与气候\n\n这一部分回答世界自然环境的“分布”问题：海陆怎样分布、为什么会变化，以及气温降水和气候类型的全球格局。\n\n### 1. 大洲和大洋\n\n- 七大洲按面积排序：亚洲 > 非洲 > 北美洲 > 南美洲 > 南极洲 > 欧洲 > 大洋洲。\n- 四大洋按面积排序：太平洋 > 大西洋 > 印度洋 > 北冰洋。太平洋最大、最深，北冰洋最小、最浅。\n- 洲界：亚欧（乌拉尔山、乌拉尔河、大高加索山、土耳其海峡）；亚非（苏伊士运河）；南北美（巴拿马运河）；亚洲与北美（白令海峡）。\n- 世界最高峰珠穆朗玛峰海拔 8848.86 m（2020 年中国、尼泊尔联合测定）；最深处马里亚纳海沟约 11 000 m。\n\n### 2. 海陆的变迁与板块构造\n\n- 大陆漂移学说：1912 年魏格纳提出，证据有大西洋两岸轮廓吻合、古生物化石和地层相同。\n- 板块构造学说：岩石圈由六大板块组成——亚欧板块、非洲板块、美洲板块、印度洋板块、太平洋板块、南极洲板块。\n- 板块内部较稳定，交界地带地壳活跃，多火山、地震。世界两大火山地震带：环太平洋带、地中海—喜马拉雅带。\n- 喜马拉雅山由印度洋板块与亚欧板块碰撞挤压形成；红海和东非大裂谷由板块张裂形成，红海在不断扩大。\n\n### 3. 天气与气候\n\n- 天气是短时间内的大气状况，多变；气候是多年天气的平均状况，相对稳定。“东边日出西边雨”说天气，“四季如春”说气候。\n- 天气预报符号：晴、多云、阴、雨、雪等；风向标的箭杆指风的来向，风尾羽表示风级。\n- 空气质量指数越大，空气质量越差。\n- 气温分布：从低纬向高纬递减；同纬度夏季陆地比海洋热、冬季陆地比海洋冷；海拔每升高 100 m 气温约下降 0.6 ℃。\n- 降水分布：赤道附近多雨，两极少雨；回归线附近大陆西岸少雨、东岸多雨；中纬度沿海多雨、内陆少雨。\n- 气温曲线与降水柱状图（气候资料图）是判断气候类型的主要依据：先看气温定温度带，再看降水定类型。\n\n### 4. 世界主要气候类型\n\n| 气候类型 | 分布 | 特点 |\n| --- | --- | --- |\n| 热带雨林气候 | 赤道附近（亚马孙平原、刚果盆地） | 全年高温多雨 |\n| 热带草原气候 | 热带雨林两侧（非洲为主） | 全年高温，分明显干湿两季 |\n| 热带沙漠气候 | 回归线附近大陆内部和西岸（撒哈拉） | 全年炎热干燥 |\n| 热带季风气候 | 亚洲南部（印度半岛、中南半岛） | 全年高温，分旱雨两季 |\n| 亚热带季风气候 | 亚洲东部 25°–35°N（中国东南部） | 夏季高温多雨，冬季温和少雨 |\n| 地中海气候 | 30°–40° 大陆西岸 | 夏季炎热干燥，冬季温和多雨 |\n| 温带海洋性气候 | 40°–60° 大陆西岸（西欧） | 全年温和湿润 |\n| 温带季风气候 | 亚洲东部 35°–55°N（中国华北） | 夏季高温多雨，冬季寒冷干燥 |\n| 温带大陆性气候 | 温带大陆内部 | 冬冷夏热，降水少 |\n| 寒带气候、高原山地气候 | 极地；青藏高原等 | 终年寒冷；气候随海拔变化 |\n\n## 第四部分 初中：中国与世界的自然地理\n\n初中区域地理以中国为重点。记住几条重要地理界线，就能把中国的地形、气候、河流串成一个整体。\n\n### 1. 中国的地形\n\n- 地势西高东低，呈三级阶梯分布。第一、二级阶梯界线：昆仑山—祁连山—横断山脉；第二、三级阶梯界线：大兴安岭—太行山—巫山—雪峰山。\n- 地势影响：大河多自西向东流；有利于海洋水汽深入内陆；阶梯交界处水能丰富。\n- 地形复杂多样，山区面积广大（约占 2/3）。\n- 四大高原：青藏高原（世界最高，“世界屋脊”）、内蒙古高原、黄土高原（水土流失严重）、云贵高原（喀斯特地貌）。\n- 四大盆地：塔里木盆地（最大）、准噶尔盆地、柴达木盆地（海拔最高，“聚宝盆”）、四川盆地（“紫色盆地”）。\n- 三大平原：东北平原（最大，黑土）、华北平原、长江中下游平原（河湖密布，“鱼米之乡”）。\n\n### 2. 中国的气候\n\n- 冬季南北温差大，夏季普遍高温（青藏高原除外）。1 月 0 ℃ 等温线大致沿秦岭—淮河一线。\n- 降水从东南沿海向西北内陆递减。800 mm 等降水量线大致沿秦岭—淮河—青藏高原东南边缘；400 mm 等降水量线大致沿大兴安岭—张家口—兰州—拉萨—喜马拉雅山脉东段。\n- 季风气候显著：夏季风来自海洋，温暖湿润；冬季风来自蒙古、西伯利亚，寒冷干燥。季风区与非季风区界线：大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山。\n- 主要气象灾害：寒潮、台风、洪涝、干旱、沙尘暴。\n\n### 3. 秦岭—淮河一线的意义\n\n- 1 月 0 ℃ 等温线、800 mm 年等降水量线经过此线。\n- 暖温带与亚热带、湿润区与半湿润区的分界线。\n- 北方与南方的分界线：北方旱地、小麦、河流有结冰期；南方水田、水稻、河流无结冰期。\n\n### 4. 中国的河流湖泊\n\n- 长江全长约 6300 km，我国第一长河，水能资源最丰富，“黄金水道”。上中游分界宜昌，中下游分界湖口。三峡工程位于宜昌附近。\n- 黄河全长约 5464 km，我国第二长河。中游流经黄土高原，带来大量泥沙；下游形成“地上河”（悬河）。上中游分界河口（内蒙古），中下游分界旧孟津。\n- 外流河主要分布在东部季风区，内流河主要在西北；塔里木河是我国最长的内流河。\n- 最大淡水湖鄱阳湖，最大咸水湖青海湖。\n\n## 第五部分 高中：宇宙中的地球\n\n高中地理从“地球在哪里”讲起：地球所处的天体系统、太阳对地球的影响、地球的圈层结构和漫长历史。\n\n### 1. 天体与天体系统\n\n- 天体：宇宙间物质的存在形式，如恒星、行星、卫星、星云、彗星、流星体。判断依据：位于宇宙空间、是物质。陨石落地后不再是天体。\n- 天体系统层次：地月系 ⊂ 太阳系 ⊂ 银河系 ⊂ 可观测宇宙。银河系的直径约 10 万光年；与银河系同级的是河外星系。\n- 1 光年约 9.46 × 10¹² km；1 天文单位（AU）约 1.5 × 10⁸ km（日地平均距离）。\n- 八大行星分类：类地行星（水、金、地、火）、巨行星（木、土）、远日行星（天王、海王）。小行星带位于火星与木星轨道之间。\n- 地球存在生命的条件：外部——太阳稳定、行星各行其道互不干扰；自身——日地距离适中（温度适宜）、质量体积适中（吸引大气）、有液态水。\n\n### 2. 太阳对地球的影响\n\n- 太阳辐射：能量来自太阳内部的核聚变；是地球大气运动、水循环和生物活动的主要动力，煤炭、石油是地质时期储存的太阳能。\n- 我国太阳辐射总量最丰富的地区是青藏高原（海拔高、空气稀薄、晴天多），最贫乏的是四川盆地（多阴雨雾）。\n- 太阳大气由内到外：光球层（黑子）、色球层（耀斑、日珥）、日冕层（太阳风）。太阳活动周期约 11 年，黑子和耀斑是主要标志。\n- 太阳活动的影响：扰动电离层，干扰短波无线电通信；扰动地球磁场，产生磁暴；高纬度地区出现极光；可能与部分地区降水年际变化相关。\n\n### 3. 地球的圈层结构\n\n| 界面 / 圈层 | 深度 | 特点 |\n| --- | --- | --- |\n| 地壳 | 平均约 17 km（大陆 39–41 km，大洋 5–10 km） | 由岩石组成，厚度不均 |\n| 莫霍界面 | 大陆部分平均约 33 km | 纵波、横波速度都明显增加 |\n| 地幔 | 莫霍界面至 2900 km | 上地幔中有软流层（80–400 km），一般认为是岩浆发源地 |\n| 古登堡界面 | 约 2900 km | 纵波速度突然下降，横波消失 |\n| 地核 | 2900 km 至地心 | 外核可能为液态（横波不能通过），内核为固态 |\n\n- 地震波：纵波（P 波）传播快，能通过固、液、气；横波（S 波）传播慢，只能通过固体。\n- 岩石圈 = 地壳 + 上地幔顶部（软流层以上）。\n\n### 4. 地球的历史\n\n- 化石和地层是研究地球历史的主要依据；一般下层岩层老、上层新。\n- 地质年代由老到新：太古宙 → 元古宙 → 古生代 → 中生代 → 新生代。\n\n| 地质年代 | 生物演化 | 重要事件 |\n| --- | --- | --- |\n| 太古宙、元古宙 | 原核生物、真核生物出现 | 重要的成铁时期 |\n| 古生代 | 海洋无脊椎动物 → 鱼类 → 两栖类；蕨类植物繁盛 | 重要的成煤期；末期约 90% 以上物种灭绝 |\n| 中生代 | 爬行动物（恐龙）盛行；裸子植物繁盛 | 重要的成煤期；末期恐龙灭绝 |\n| 新生代 | 被子植物繁盛；哺乳动物快速发展；第四纪出现人类 | 现代海陆格局形成 |\n\n## 第六部分 高中：地球的运动\n\n地球运动是高中地理最需要空间想象的部分。抓住两条主线：自转产生时间差和地转偏向，公转加上黄赤交角产生太阳直射点移动。\n\n### 1. 自转与公转的基本特征\n\n| 特征 | 自转 | 公转 |\n| --- | --- | --- |\n| 方向 | 自西向东；北极上空逆时针，南极上空顺时针 | 自西向东 |\n| 周期 | 恒星日 23 时 56 分 4 秒（真正周期）；太阳日 24 小时 | 恒星年 365 日 6 时 9 分 10 秒 |\n| 速度 | 角速度约 15°/h（两极为 0）；线速度赤道约 1670 km/h，向两极递减，60° 处约为赤道的一半 | 1 月初近日点最快，7 月初远日点最慢 |\n\n- 黄赤交角：黄道平面与赤道平面的夹角，目前约 23°26′。它决定了回归线的纬度为 23°26′，极圈的纬度为 66°34′。\n\n### 2. 自转的地理意义\n\n- 昼夜交替：晨昏线（圈）把地球分为昼半球和夜半球；顺着自转方向，由夜进入昼的是晨线，由昼进入夜的是昏线。\n- 地方时：经度每隔 15° 相差 1 小时，每隔 1° 相差 4 分钟，东早西晚。\n\n```latex\n\\text{所求地方时} = \\text{已知地方时} \\pm \\text{经度差} \\times 4\\,\\text{min/°}\\quad(\\text{东加西减})\n```\n\n- 时区与区时：全球分为 24 个时区，每个时区跨 15°，以中央经线的地方时为区时。北京时间是东八区区时，即 120°E 的地方时。\n- 日界线：国际日期变更线大致沿 180° 经线；自西向东越过日界线，日期减一天；自东向西越过，日期加一天。\n- 地转偏向：水平运动的物体北半球向右偏、南半球向左偏，赤道上不偏。影响河流冲刷（北半球河流右岸冲刷更强）、风向和洋流。\n\n### 3. 公转的地理意义\n\n- 太阳直射点在南北回归线之间往返移动，周期为一个回归年（约 365 日 5 时 48 分 46 秒）。\n- 昼夜长短：太阳直射哪个半球，哪个半球昼长夜短，且纬度越高昼越长；赤道上全年昼夜平分；春秋分日全球昼夜平分。夏至日北极圈及以北出现极昼。\n- 昼长计算：昼长 = 日落时间 − 日出时间 = 2 ×（12 − 日出时间）。\n- 正午太阳高度：太阳直射点处为 90°，由直射点向南北两侧递减。\n\n```latex\nH = 90^\\circ - \\left|\\varphi - \\delta\\right|\n```\n\n- 式中 φ 为当地纬度，δ 为太阳直射点纬度（同在北半球或南半球取同号，不同半球取异号）。夏至日北回归线及以北地区正午太阳高度达到一年中最大值。\n- 应用：楼间距（以冬至日正午太阳高度计算，保证底层采光）、太阳能热水器倾角（倾角 + 正午太阳高度 = 90°）。\n- 四季与五带：天文四季以昼长和正午太阳高度划分；我国气候统计上以 3–5 月为春季、6–8 月为夏季、9–11 月为秋季、12–2 月为冬季。\n\n## 第七部分 高中：大气圈\n\n大气部分的主线是“太阳辐射 → 地面受热 → 冷热不均 → 气压差异 → 大气运动 → 天气和气候”，每一步都有固定的图来表达。\n\n### 1. 大气的组成与垂直分层\n\n- 干洁空气：氮约 78%，氧约 21%，二氧化碳约 0.04%（光合作用原料、吸收地面长波辐射保温），臭氧（吸收紫外线，“地球生命的保护伞”）。水汽和杂质是成云致雨的必要条件。\n\n| 层次 | 高度 | 特点 |\n| --- | --- | --- |\n| 对流层 | 低纬 17–18 km，中纬 10–12 km，高纬 8–9 km | 气温随高度增加而递减（约 0.6 ℃/100 m）；对流运动显著；天气现象复杂多变 |\n| 平流层 | 对流层顶至 50–55 km | 气温随高度增加而上升（臭氧吸收紫外线）；以水平运动为主，适合航空飞行 |\n| 高层大气 | 平流层顶以上 | 有电离层，能反射无线电短波 |\n\n### 2. 大气的受热过程\n\n- 三句话：太阳暖大地（短波辐射穿过大气，被地面吸收），大地暖大气（地面长波辐射是近地面大气的直接热源），大气还大地（大气逆辐射对地面起保温作用）。\n- 大气对太阳辐射的削弱作用：吸收（臭氧吸收紫外线，水汽和二氧化碳吸收红外线）、反射（云层越厚反射越强）、散射（晴朗天空呈蔚蓝色）。\n- 应用：晴朗的夜晚多霜冻（大气逆辐射弱）；阴天昼夜温差小；青藏高原太阳辐射强但气温低（空气稀薄，大气吸收地面辐射少）；塑料大棚、秸秆覆盖保温。\n\n### 3. 热力环流与风\n\n- 热力环流：地面受热不均 → 空气垂直运动（热处上升、冷处下沉）→ 同一水平面产生气压差 → 空气水平运动。近地面受热处形成低压，高空相反。\n- 实例：海陆风（白天吹海风，夜晚吹陆风）、山谷风（白天吹谷风，夜晚吹山风，山谷夜雨多）、城市热岛环流（近地面风从郊区吹向城市）。\n- 形成风的直接原因是水平气压梯度力，它垂直于等压线、由高压指向低压，是风形成的根本动力。\n- 高空的风只受气压梯度力和地转偏向力，风向最终与等压线平行；近地面的风还受摩擦力，风向与等压线斜交。\n- 等压线越密集，水平气压梯度力越大，风速越大。\n\n### 4. 气压带和风带\n\n- 全球七个气压带、六个风带：赤道低气压带（0° 附近）、副热带高气压带（约 30°）、副极地低气压带（约 60°）、极地高气压带（90°）；信风带（北半球东北信风、南半球东南信风）、盛行西风带、极地东风带。\n- 气压带、风带随太阳直射点的移动而季节性移动，北半球大致夏季北移、冬季南移。\n- 海陆热力性质差异使北半球的气压带被切断：1 月亚欧大陆上形成亚洲高压（蒙古—西伯利亚高压），7 月形成亚洲低压（印度低压）。\n- 季风：东亚季风主要由海陆热力性质差异形成；南亚夏季风（西南季风）主要由气压带、风带季节移动（东南信风越过赤道右偏）形成。\n\n### 5. 常见天气系统\n\n| 天气系统 | 特点 | 天气 |\n| --- | --- | --- |\n| 冷锋 | 冷气团主动向暖气团移动 | 降水多在锋后；过境时阴雨、大风、降温；过境后气温下降、气压升高、天气转晴 |\n| 暖锋 | 暖气团主动向冷气团移动 | 降水多在锋前，连续性降水；过境后气温升高、气压降低 |\n| 准静止锋 | 冷暖气团势力相当 | 阴雨天气持续时间长，如江淮地区梅雨 |\n| 气旋（低压） | 北半球按逆时针方向向中心辐合，中心气流上升 | 多阴雨；台风是强烈发展的热带气旋 |\n| 反气旋（高压） | 北半球按顺时针方向向外辐散，中心气流下沉 | 多晴朗；如长江流域伏旱（副热带高压控制） |\n\n### 6. 气候类型的成因\n\n| 气候类型 | 主要成因 |\n| --- | --- |\n| 热带雨林气候 | 赤道低气压带控制，盛行上升气流 |\n| 热带草原气候 | 赤道低气压带与信风带交替控制 |\n| 热带沙漠气候 | 副热带高气压带和信风带控制 |\n| 热带季风气候 | 气压带风带季节移动和海陆热力性质差异 |\n| 亚热带季风气候、温带季风气候 | 海陆热力性质差异 |\n| 地中海气候 | 副热带高气压带与西风带交替控制：夏季受副高控制干燥，冬季受西风控制多雨 |\n| 温带海洋性气候 | 全年受西风带控制，受海洋影响大 |\n| 温带大陆性气候 | 深居内陆，远离海洋 |\n\n### 7. 全球气候变化\n\n- 原因：人类大量燃烧化石燃料和毁林，大气中二氧化碳等温室气体浓度升高，增强了温室效应。\n- 影响：海平面上升，极端天气增多，冰川退缩，物种分布变化。\n- 应对：减少温室气体排放、提高能源效率、发展清洁能源、植树造林增加碳汇；我国力争 2030 年前碳达峰、2060 年前碳中和。\n\n## 第八部分 高中：水圈\n\n水圈部分的主线是水循环：海洋和陆地之间、地表和地下之间的水怎样联系，以及洋流怎样在全球输送热量。\n\n### 1. 水循环\n\n- 类型：海陆间循环（最重要，使陆地淡水不断更新）、陆地内循环（补给陆地水少）、海上内循环（水量最大）。\n- 环节：蒸发、水汽输送、降水、地表径流、下渗、地下径流、植物蒸腾。人类目前影响最大的环节是地表径流（修水库、跨流域调水）。\n- 意义：维持全球水量动态平衡；促进物质迁移和能量交换；塑造地表形态。\n- 城市化对水循环的影响：地面硬化使下渗减少、地表径流增加，汇流加快，城市易发生内涝；对策是建设“海绵城市”（透水铺装、下凹式绿地、雨水花园）。\n\n### 2. 陆地水体的相互关系\n\n- 河流补给类型：雨水补给（最普遍）、季节性积雪融水（东北春汛）、冰川融水（西北夏季，随气温变化）、湖泊水、地下水（最稳定）。\n- 湖泊对河流有调节作用：洪水期蓄水、枯水期补给。\n- 河流与地下水常互为补给：丰水期河水补给地下水，枯水期地下水补给河水。\n\n### 3. 海水的性质\n\n- 海水温度：表层水温从低纬向高纬递减；随深度增加而降低（1000 m 以下变化很小）；同纬度暖流流经处水温高。\n- 海水盐度：世界大洋平均盐度约 35‰；表层盐度从副热带海区向南北两侧递减（副热带海区蒸发旺盛、降水少，盐度最高）；河流注入处盐度低。世界盐度最高的是红海，最低的是波罗的海。\n- 海水密度：主要受温度和盐度影响，一般温度越低、盐度越高，密度越大。\n- 海水运动：波浪、潮汐（月球和太阳引力作用，农历初一、十五前后为大潮）、洋流。\n\n### 4. 洋流\n\n- 成因分类：风海流（盛行风吹拂，如西风漂流）、密度流（密度差异，如直布罗陀海峡表层海水由大西洋流入地中海）、补偿流（如秘鲁寒流处的上升流）。\n- 性质分类：从水温高的海区流向水温低的海区为暖流，反之为寒流。\n- 分布规律：中低纬海区形成以副热带为中心的大洋环流，北半球呈顺时针、南半球呈逆时针；北半球中高纬海区形成以副极地为中心的逆时针环流；南半球中高纬有西风漂流。大洋东岸（大陆西岸）中低纬多寒流，大洋西岸（大陆东岸）中低纬多暖流。\n- 北印度洋季风洋流：冬季逆时针，夏季顺时针（“冬逆夏顺”）。\n- 洋流的影响：暖流增温增湿（西欧温带海洋性气候与北大西洋暖流），寒流降温减湿（沿岸沙漠延伸到海边，如秘鲁、澳大利亚西岸）；寒暖流交汇或上升流处形成渔场；加快污染物扩散但扩大污染范围；影响航速（顺流快、逆流慢）。\n- 世界四大渔场：北海道渔场（日本暖流与千岛寒流交汇）、纽芬兰渔场（墨西哥湾暖流与拉布拉多寒流交汇，因过度捕捞一度衰退）、北海渔场（北大西洋暖流与东格陵兰寒流交汇）、秘鲁渔场（上升流）。\n- 海—气相互作用：厄尔尼诺现象指赤道附近中、东太平洋表层海水异常升温，秘鲁沿岸上升流减弱、渔业减产，南美西岸多暴雨，澳大利亚东部、印度尼西亚易干旱。拉尼娜现象表现相反。\n\n## 第九部分 高中：岩石圈与地貌\n\n地貌是内力作用和外力作用共同塑造的结果：内力作用使地表变得高低不平，外力作用削高填低，使地表趋于平坦。\n\n### 1. 岩石与岩石圈物质循环\n\n| 岩石类型 | 成因 | 特点与举例 |\n| --- | --- | --- |\n| 岩浆岩（侵入岩） | 岩浆侵入地壳上部冷凝 | 晶体颗粒较大；花岗岩 |\n| 岩浆岩（喷出岩） | 岩浆喷出地表冷凝 | 多气孔、颗粒细；玄武岩 |\n| 沉积岩 | 外力作用下沉积物固结成岩 | 有层理构造，常含化石；石灰岩、砂岩、页岩、砾岩 |\n| 变质岩 | 原有岩石在高温高压下发生变质 | 片理构造；石灰岩 → 大理岩，砂岩 → 石英岩，页岩 → 板岩，花岗岩 → 片麻岩 |\n\n- 岩石圈物质循环：岩浆 → 冷凝成岩浆岩 → 外力作用形成沉积岩 → 变质作用形成变质岩 → 重熔再生为岩浆。三大类岩石都可以经变质作用变为变质岩，经重熔再生变为岩浆。\n- 能找到化石的是沉积岩；煤、石油、天然气多储存于沉积岩中。\n\n### 2. 内力作用与构造地貌\n\n- 内力作用能量来自地球内部（放射性元素衰变产生的热能），表现为地壳运动、岩浆活动、变质作用、地震。地壳运动是主要形式，分为水平运动（形成断裂带、褶皱山脉）和垂直运动（地势起伏、海陆变迁）。\n- 褶皱：背斜岩层向上拱起，中心老、两翼新；向斜岩层向下弯曲，中心新、两翼老。判断背斜、向斜看岩层的弯曲形态和新老关系，不能只看地表高低。\n- 地形倒置：背斜顶部受张力易被侵蚀成谷，向斜槽部受挤压坚实不易侵蚀而成山，即“背斜成谷、向斜成山”。\n- 应用：背斜是良好的储油、储气构造，适合修隧道；向斜是良好的储水构造，适合打井。\n- 断层：岩体受力断裂并沿断裂面发生明显位移。上升岩块形成山岭或高地（华山、泰山），下沉岩块形成谷地或低地（东非大裂谷、渭河平原）。断层处易形成泉水、湖泊；修建水库、大桥、隧道应避开断层。\n- 板块边界：生长边界（张裂）形成裂谷、海洋和大洋中脊，如东非大裂谷、红海、大西洋中脊；消亡边界（碰撞挤压）中，大洋板块与大陆板块相撞形成海沟、岛弧或海岸山脉（日本群岛、安第斯山脉），大陆板块之间相撞形成巨大山脉（喜马拉雅山脉）。\n\n### 3. 外力作用与常见地貌\n\n- 外力作用能量主要来自太阳辐射，表现为风化、侵蚀、搬运、堆积、固结成岩。\n- 地域差异：干旱、半干旱地区以风力作用为主（风蚀蘑菇、雅丹地貌、沙丘）；湿润地区以流水作用为主（河谷、冲积平原、三角洲）；高山和高纬地区以冰川作用为主（冰斗、角峰、U 形谷）；沿海地区以海浪作用为主（海蚀崖、海蚀柱、沙滩）。\n- 新月形沙丘：缓坡是迎风坡，陡坡是背风坡。\n- 喀斯特地貌：可溶性岩石（石灰岩）被富含二氧化碳的水溶蚀形成，地表有峰林、峰丛、孤峰、溶蚀洼地，地下有溶洞、石钟乳、石笋、石柱；我国主要分布在广西、云南、贵州。\n- 堆积物的分选性：流水和风力堆积物颗粒大小分层明显（分选性好），冰川堆积物大小混杂（分选性差）。\n\n### 4. 河流地貌\n\n| 河段 | 主要作用 | 地貌 |\n| --- | --- | --- |\n| 上游（山区） | 下蚀和溯源侵蚀 | V 形谷，多峡谷、瀑布 |\n| 中下游 | 侧蚀与堆积 | 河谷展宽、河道弯曲（河曲），凹岸侵蚀、凸岸堆积；牛轭湖 |\n| 出山口 | 流速骤减，泥沙堆积 | 冲积扇（洪积扇），扇顶颗粒粗、扇缘颗粒细 |\n| 中下游平原 | 洪水期泛滥堆积 | 河漫滩平原 |\n| 入海口 | 流速降低并受海水顶托 | 三角洲 |\n\n- 平直河道：北半球受地转偏向力影响右岸冲刷较重；弯曲河道：凹岸侵蚀、凸岸堆积，港口宜建在凹岸，聚落和农田多在凸岸。\n- 河流地貌与聚落：平原地区聚落多沿河分布；山区聚落多分布在河谷和冲积扇上。\n\n### 5. 地貌的观察\n\n- 观察顺序：先观察高大的地貌，再观察面积较大的地貌，最后观察小地貌。\n- 观察内容：高度（海拔、相对高度）、坡度、地面起伏、沟谷特征（数量、深度、形状）。\n- 等高线地形剖面图：选定剖面线，确定交点高度，按比例绘制坡面。\n\n## 第十部分 高中：自然环境的整体性与差异性\n\n自然环境的各个要素相互联系，构成一个整体；同时它又在空间上呈现有规律的差异。这一部分把前面大气、水、地貌、生物、土壤的知识综合起来。\n\n### 1. 植被与土壤\n\n- 植被与环境：热带雨林植物种类丰富、群落结构复杂，常见板状根、茎花、藤本和附生植物；落叶阔叶林秋冬落叶；常绿硬叶林（地中海气候区）叶片革质、利于减少蒸腾；亚寒带针叶林以云杉、冷杉、落叶松为主；荒漠植被根系发达、叶片退化，耐旱。\n- 植被的垂直分布：山地从山麓到山顶，植被类型的变化与从低纬到高纬的变化类似。\n- 土壤组成：矿物质（最基本）、有机质（肥力的重要标志）、水分和空气。\n- 成土因素：成土母质（物质基础）、生物（最活跃因素，有机质来源）、气候（影响风化和有机质积累，湿热地区有机质分解快、积累少）、地貌（影响水热再分配）、时间。人类活动可以改良土壤，也可以导致土壤退化。\n- 森林土壤剖面一般为：有机层、腐殖质层、淋溶层、淀积层、母质层、母岩层。\n- 我国东北黑土有机质含量高、肥力高，因为气候冷湿，有机质分解慢、积累多；南方红壤酸性强、肥力较低。\n\n### 2. 自然环境的整体性\n\n- 各要素通过物质迁移和能量交换相互联系，形成整体，表现为“牵一发而动全身”：一个要素变化会引起其他要素乃至整个环境的变化。\n- 例：黄土高原植被破坏 → 水土流失加剧 → 土壤肥力下降、沟壑纵横 → 黄河含沙量增大、下游河床抬升。\n\n### 3. 自然环境的地域差异\n\n| 规律 | 主导因素 | 表现 |\n| --- | --- | --- |\n| 纬度地带性（由赤道到两极） | 热量 | 自然带沿纬线方向延伸、沿经线方向更替，在低纬和高纬地区最明显 |\n| 经度地带性（由沿海向内陆） | 水分 | 自然带沿经线方向延伸、沿纬线方向更替，在中纬度地区最明显（如我国温带从东到西：森林 → 草原 → 荒漠） |\n| 垂直地带性（山麓到山顶） | 水热条件随海拔变化 | 山地垂直自然带；山麓自然带与当地水平自然带一致；纬度越低、山体越高，垂直带谱越复杂 |\n| 地方性分异 | 地形、洋流、地下水等局部因素 | 如沙漠中的绿洲、东非高原的热带草原 |\n\n## 第十一部分 高中：自然灾害与人地协调\n\n自然灾害是自然变异作用于人类社会造成的损失。高中阶段要求认识主要灾害的成因，掌握避险方法，并了解地理信息技术在防灾减灾中的作用。\n\n### 1. 主要自然灾害\n\n| 类型 | 灾害 | 要点 |\n| --- | --- | --- |\n| 地质灾害 | 地震 | 震级表示释放能量大小，一次地震只有一个震级；烈度表示破坏程度，随距震中距离增加而减小，一次地震有多个烈度。纵波先到，人先感到上下颠簸 |\n| 地质灾害 | 滑坡、泥石流 | 多发于地形陡峭、岩体破碎、暴雨集中的山区；泥石流来临时应向沟谷两侧山坡高处跑，不要顺沟谷方向跑 |\n| 气象灾害 | 台风 | 中心附近风力达 12 级及以上的热带气旋；北半球呈逆时针旋转；带来狂风、暴雨、风暴潮；台风眼内风平浪静 |\n| 气象灾害 | 寒潮 | 冷空气大规模南下，气温骤降、大风、霜冻 |\n| 气象灾害 | 干旱、洪涝 | 我国季风气候降水季节和年际变化大，旱涝灾害频繁 |\n\n- 地震避险：室内就近躲在坚固桌下、内墙角；室外远离建筑物、电线杆；不乘电梯、不跳楼。\n- 防灾减灾：监测预报、工程措施（防洪堤、水库）、非工程措施（应急预案、避险演练）。\n\n### 2. 地理信息技术\n\n| 技术 | 全称 | 作用 |\n| --- | --- | --- |\n| RS | 遥感 | 获取地表信息，如监测洪水范围、森林火灾、作物长势 |\n| GNSS | 全球卫星导航系统 | 定位和导航，我国北斗卫星导航系统 2020 年全面建成 |\n| GIS | 地理信息系统 | 存储、分析、管理地理数据，如灾情评估、城市规划、最佳路径分析 |\n\n### 3. 资源、环境与可持续发展\n\n- 自然资源：可再生资源（太阳能、风能、水能、生物资源）与非可再生资源（矿产、化石燃料）。\n- 主要环境问题：环境污染（大气、水、土壤）、生态破坏（水土流失、土地荒漠化、生物多样性减少）、全球性问题（全球变暖、臭氧层破坏、酸雨）。\n- 我国区域生态问题与治理：黄土高原水土流失（淤地坝、梯田、退耕还林还草）；西北荒漠化（草方格沙障、三北防护林、合理利用水资源）；西南石漠化（封山育林、发展特色产业）；湿地保护。\n- 可持续发展的原则：公平性、持续性、共同性。“绿水青山就是金山银山”。\n\n## 第十二部分 地理实践与观测\n\n地球科学的很多规律可以通过模拟实验和野外观测来验证。实验题的关键与其他学科一样：明确自变量，控制无关变量，设置对照。\n\n### 1. 常用模拟实验\n\n| 实验 | 器材 | 观察到的现象 | 说明的原理 |\n| --- | --- | --- | --- |\n| 昼夜交替模拟 | 地球仪、手电筒 | 转动地球仪，亮暗区域交替 | 地球自转产生昼夜交替 |\n| 四季形成模拟 | 地球仪、台灯 | 保持地轴倾斜方向不变绕灯公转，直射位置南北移动 | 公转 + 黄赤交角 |\n| 热力环流实验 | 透明箱、热水、冰块、线香 | 烟从冰块一侧流向热水一侧，热水上方上升 | 冷热不均引起空气运动 |\n| 温室效应模拟 | 两个玻璃瓶、温度计、光源 | 加盖或充入二氧化碳的瓶内温度更高 | 大气逆辐射保温 |\n| 水土流失模拟 | 两块坡面（有草皮与裸土）、喷壶 | 裸土坡面流出的水更浑浊 | 植被保持水土 |\n| 河流冲刷模拟 | 沙盘、流水 | 弯道外侧被冲刷，内侧堆积 | 凹岸侵蚀、凸岸堆积 |\n| 板块运动模拟 | 两本书、纸张 | 两书相对挤压，纸张拱起 | 板块碰撞形成褶皱山脉 |\n\n### 2. 野外观测与测量\n\n- 立竿测影测正午太阳高度：在水平地面竖立长度为 L 的竿，测正午影长 S，则：\n\n```latex\n\\tan H = \\frac{L}{S}\n```\n\n- 正午影子最短时，对应当地地方时 12 时，可据此推算当地经度。\n- 简易气象观测：百叶箱离地约 1.5 m，白色、通风、门朝北（北半球），避免阳光直射；记录气温、降水、风向和云量。\n- 岩石标本观察：看颗粒（大小、形状）、看构造（层理、气孔、片理）、看是否有化石、滴稀盐酸检验碳酸盐。\n- 等高线模型制作：用泡沫板按等高线逐层叠加，体会等高线疏密与坡度的关系。\n- 土壤观察：挖土壤剖面，观察颜色、质地和分层；用简易方法比较不同土壤的渗水速度。\n\n### 3. 读图方法\n\n1. 看图名、图例和比例尺，确定图的主题与范围\n2. 用经纬网或标志性地物定位区域\n3. 读出要素的分布特点（高低、多少、疏密、变化趋势）\n4. 联系原理分析成因（纬度、海陆位置、地形、洋流、人类活动）\n5. 推导影响或提出措施\n\n## 附录\n\n### A. 常用数据\n\n| 项目 | 数值 |\n| --- | --- |\n| 地球平均半径 | 约 6371 km |\n| 赤道周长 | 约 4 万 km |\n| 地球表面海陆比例 | 海洋约 71%，陆地约 29% |\n| 黄赤交角 | 约 23°26′ |\n| 恒星日 / 太阳日 | 23 时 56 分 4 秒 / 24 小时 |\n| 日地平均距离 | 约 1.5 亿 km（1 AU） |\n| 月地平均距离 | 约 38.4 万 km |\n| 1 光年 | 约 9.46 × 10¹² km |\n| 对流层气温垂直递减率 | 约 0.6 ℃/100 m |\n| 大洋平均盐度 | 约 35‰ |\n| 珠穆朗玛峰海拔 | 8848.86 m |\n| 长江 / 黄河长度 | 约 6300 km / 约 5464 km |\n| 太阳活动周期 | 约 11 年 |\n\n### B. 易混概念辨析\n\n| 易混概念 | 关键区别 |\n| --- | --- |\n| 天气 / 气候 | 天气是短时间大气状况，多变；气候是多年平均状况，稳定 |\n| 恒星日 / 太阳日 | 恒星日是地球自转的真正周期；太阳日是昼夜交替的周期，比恒星日长约 4 分钟 |\n| 地方时 / 区时 | 地方时因经度而异；区时是一个时区统一使用的中央经线地方时 |\n| 震级 / 烈度 | 震级只有一个，表示能量；烈度有多个，表示破坏程度 |\n| 背斜 / 向斜 | 看岩层弯曲方向和新老关系，不看地表高低 |\n| 风化 / 侵蚀 | 风化使岩石破碎、原地留存；侵蚀把物质从原处剥离带走 |\n| 暖流 / 寒流 | 看流向（由暖到冷为暖流），不看水温的绝对高低 |\n| 气旋 / 锋面气旋 | 气旋是低压系统；锋面气旋是有锋面伴随的温带气旋 |\n| 晨线 / 昏线 | 顺着自转方向，由夜到昼为晨线，由昼到夜为昏线 |\n| 地理信息技术 RS / GNSS / GIS | 获取信息 / 定位导航 / 分析处理 |\n\n### C. 地球科学史年表\n\n| 时间 | 人物 | 事件 |\n| --- | --- | --- |\n| 132 年 | 张衡 | 制成候风地动仪 |\n| 1088 年前后 | 沈括 | 《梦溪笔谈》记载地磁偏角和化石成因 |\n| 1519–1522 年 | 麦哲伦船队 | 首次环球航行，证明地球是球体 |\n| 1543 年 | 哥白尼 | 提出日心说 |\n| 1609–1619 年 | 开普勒 | 提出行星运动三定律 |\n| 1640 年前 | 徐霞客 | 考察并记录西南喀斯特地貌 |\n| 1830–1833 年 | 赖尔 | 《地质学原理》奠定“将今论古”的方法 |\n| 1909 年 | 莫霍洛维奇 | 发现地壳与地幔的分界面（莫霍界面） |\n| 1912 年 | 魏格纳 | 提出大陆漂移学说 |\n| 1914 年 | 古登堡 | 确定地幔与地核的分界面（古登堡界面） |\n| 1950 年代 | 李四光 | 创立地质力学，推动东部石油勘探 |\n| 1960 年代初 | 赫斯、迪茨 | 提出海底扩张学说 |\n| 1968 年 | 勒皮雄等 | 提出板块构造学说 |\n| 1970 年 | 中国 | 第一颗人造地球卫星“东方红一号”发射 |\n| 2019 年 | 中国 | 嫦娥四号首次在月球背面软着陆 |\n| 2020 年 | 中国 | 北斗三号全球卫星导航系统全面建成；珠峰高程测定为 8848.86 m |\n| 2021 年 | 中国 | 祝融号火星车登陆火星 |\n\n### D. 常用术语中英对照\n\n| 中文 | 英文 |\n| --- | --- |\n| 地球科学 / 地理学 | earth science / geography |\n| 经度 / 纬度 / 本初子午线 | longitude / latitude / prime meridian |\n| 自转 / 公转 / 黄赤交角 | rotation / revolution / obliquity of the ecliptic |\n| 时区 / 国际日期变更线 | time zone / International Date Line |\n| 大气圈 / 水圈 / 岩石圈 / 生物圈 | atmosphere / hydrosphere / lithosphere / biosphere |\n| 地壳 / 地幔 / 地核 | crust / mantle / core |\n| 对流层 / 平流层 / 臭氧层 | troposphere / stratosphere / ozone layer |\n| 气压带 / 风带 / 季风 | pressure belt / wind belt / monsoon |\n| 锋面 / 气旋 / 反气旋 / 台风 | front / cyclone / anticyclone / typhoon |\n| 洋流 / 上升流 / 厄尔尼诺 | ocean current / upwelling / El Niño |\n| 水循环 / 径流 / 下渗 | water cycle / runoff / infiltration |\n| 岩浆岩 / 沉积岩 / 变质岩 | igneous rock / sedimentary rock / metamorphic rock |\n| 板块构造 / 褶皱 / 断层 | plate tectonics / fold / fault |\n| 风化 / 侵蚀 / 堆积 | weathering / erosion / deposition |\n| 喀斯特 / 三角洲 / 冲积扇 | karst / delta / alluvial fan |\n| 地震 / 震级 / 烈度 | earthquake / magnitude / intensity |\n| 遥感 / 地理信息系统 | remote sensing / geographic information system |\n| 可持续发展 | sustainable development |", "extras": [], "parts": [["导读", "导读"], ["小学", "小学科学中的地球与宇宙"], ["初中", "地球与地图"], ["初中", "陆地与海洋、天气与气候"], ["初中", "中国与世界的自然地理"], ["高中", "宇宙中的地球"], ["高中", "地球的运动"], ["高中", "大气圈"], ["高中", "水圈"], ["高中", "岩石圈与地貌"], ["高中", "自然环境的整体性与差异性"], ["高中", "自然灾害与人地协调"], ["实验", "地理实践与观测"], ["附录", "附录"]]}}</script>
<script>
(function(){
const SUBJECTS=JSON.parse(document.getElementById('data').textContent);
const ORDER=['math','physics','chemistry','biology','earth'];
const CN=['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
const chip=st=>st&&st!=='导读'&&st!=='附录'?'<em class="stg" data-stage="'+st+'">'+st+'</em>':'';
const META={
  math:{name:'数学',sym:'MATHEMATICS · y = f(x)',color:'var(--math)'},
  physics:{name:'物理',sym:'PHYSICS · F = ma',color:'var(--phy)'},
  chemistry:{name:'化学',sym:'CHEMISTRY · n = m/M',color:'var(--chem)'},
  biology:{name:'生物',sym:'BIOLOGY · DNA → RNA → 蛋白质',color:'var(--bio)'},
  earth:{name:'地球科学',sym:'EARTH · H = 90° − |φ − δ|',color:'var(--geo)'}
};
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- render each subject once ---------- */
const docs={};      // id -> {el, heads:[{id,level,text}], title, typeset:false}
const index=[];     // search sections
function render(id){
  const s=SUBJECTS[id];
  let html=s.format==='md'?marked.parse(s.content,{gfm:true}):s.content;
  const box=document.createElement('article');
  box.className='doc';
  box.innerHTML='<div class="dochead"><div class="sym">'+META[id].sym+'</div><h1>'+s.title+'</h1></div>'+html;
  // site-only additions: appended at the end of part N, or inserted before part N
  const h2s=[...box.querySelectorAll(':scope > h2')];
  (s.extras||[]).forEach(e=>{
    const tmp=document.createElement('div');tmp.innerHTML=marked.parse(e.md,{gfm:true});
    const ref=e.mode==='before'?h2s[e.at]:h2s[e.at+1]||null;
    [...tmp.childNodes].forEach(nd=>box.insertBefore(nd,ref));
  });
  box.querySelectorAll('pre > code.language-latex').forEach(c=>{
    const d=document.createElement('div');d.className='math';d.textContent='\\['+c.textContent.trim()+'\\]';
    c.parentElement.replaceWith(d);
  });
  box.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
  box.querySelectorAll('input[type=checkbox]').forEach(i=>i.disabled=false);
  // unified structure: 导读 → 第N部分 (with stage tag) → 附录; sections numbered N.M, appendix A/B/C
  const heads=[];let n=0,pi=-1,partNo=0,sub=0,stage='',isApp=false;
  box.querySelectorAll('h2,h3').forEach(h=>{
    let label='';
    if(h.tagName==='H2'){
      pi++;const p=s.parts[pi];stage=p[0];sub=0;isApp=stage==='附录';
      if(stage==='导读'||isApp){label='';h.innerHTML='<span class="ht2">'+p[1]+'</span>'}
      else{partNo++;label='第'+CN[partNo]+'部分';h.innerHTML='<span class="pn">'+label+'<em class="stg" data-stage="'+stage+'">'+stage+'</em></span><span class="ht2">'+p[1]+'</span>'}
      h.dataset.stage=stage;
    }else{
      const raw=h.textContent.trim();sub++;
      if(isApp){h.textContent=String.fromCharCode(64+sub)+'. '+raw.replace(/^[A-Z][.．、]\s*/,'')}
      else if(partNo&&stage!=='导读'){h.textContent=partNo+'.'+sub+' '+raw.replace(/^(\d+(\.\d+)*[.．、]?|[一二三四五六七八九十]+、)\s*/,'')}
    }
    h.id=id.slice(0,3)+'-'+(++n);
    const text=h.tagName==='H2'?(label?label+' ':'')+h.querySelector('.ht2').textContent:h.textContent.trim();
    heads.push({id:h.id,level:+h.tagName[1],text,stage:h.tagName==='H2'?stage:'',short:h.tagName==='H2'?h.querySelector('.ht2').textContent:text});
  });
  // search index: split at h2/h3
  let cur=null,parent='';
  const flush=()=>{if(cur&&cur.text.trim())index.push(cur)};
  [...box.children].forEach(el=>{
    if(el.tagName==='H2'||el.tagName==='H3'){
      flush();
      const hd=heads.find(x=>x.id===el.id);
      if(el.tagName==='H2')parent=hd.text;
      cur={subject:id,id:el.id,title:hd.text,parent:el.tagName==='H3'?parent:'',text:hd.text+'\n'};
    }else if(cur){cur.text+=(el.classList.contains('math')?'':el.innerText||el.textContent)+'\n'}
  });
  flush();
  docs[id]={el:box,heads,title:s.title,typeset:false};
}

/* ---------- views ---------- */
const main=$('#main'),rail=$('#rail');
let view={kind:'home'};

function tabs(){
  $('#tabs').innerHTML=ORDER.map(id=>{
    const has=!!SUBJECTS[id];
    return '<button class="tab" type="button" data-s="'+id+'" '+(has?'':'disabled title="尚未加入"')+' aria-current="'+(view.kind==='doc'&&view.subject===id)+'"><i style="background:'+META[id].color+'"></i>'+META[id].name+'</button>';
  }).join('');
}
function stages(id){return ['小学','初中','高中'].filter(st=>docs[id].heads.some(h=>h.stage===st)).join(' → ')}
function showHome(){
  view={kind:'home'};document.body.dataset.subject='';
  const cards=ORDER.map(id=>{
    const m=META[id];
    if(!SUBJECTS[id])return '';
    const d=docs[id];const h2=d.heads.filter(h=>h.level===2);const h3=d.heads.filter(h=>h.level===3).length;
    return '<div class="card" style="--c:'+m.color+'"><div class="sym">'+m.sym+'</div><h2><button type="button" data-s="'+id+'">'+d.title+'</button></h2><ol>'+
      h2.map(h=>'<li><a href="#'+id+'" data-s="'+id+'" data-h="'+h.id+'">'+chip(h.stage)+'<span>'+h.short+'</span></a></li>').join('')+
      '</ol><div class="meta">'+h2.filter(h=>h.stage!=='导读'&&h.stage!=='附录').length+' 个部分 · '+h3+' 个小节 · '+stages(id)+'</div></div>';

  rail.innerHTML='<h4>学科</h4><ol>'+ORDER.filter(id=>SUBJECTS[id]).map(id=>'<li class="l2"><a href="#'+id+'" data-s="'+id+'">'+META[id].name+' · '+docs[id].title+'</a></li>').join('')+'</ol>';
  tabs();window.scrollTo(0,0);setHash('');

function showDoc(id,headId){

  view={kind:'search',q};document.body.dataset.subject='';

    if(!terms.every(w=>t.includes(w.toLowerCase())))return;

/* ---------- scroll spy ---------- */
let spyRaf=0;

$('#totop').onclick=()=>window.scrollTo({top:0});
const themeBtn=$('#theme');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function themeLabel(){themeBtn.textContent=isDark()?'浅色':'深色'}
const saved=store.get('theme');if(saved)document.documentElement.dataset.theme=saved;
themeBtn.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;store.set('theme',t);themeLabel()};
themeLabel();

/* ---------- boot ---------- */
ORDER.forEach(id=>{if(SUBJECTS[id])render(id)});
const total=index.length;

})();
