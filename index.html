<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>理科知识大全</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with subject tabs + search; sticky chapter rail on the left; one reading column. Each subject tints the UI with its own pigment. */
:root{
  --paper:#f5f7f6; --sheet:#ffffff; --ink:#18211e; --ink-2:#4d5a55; --rule:#dde4e1; --wash:#eaf0ed;
  --math:#c0244f; --phy:#2f58c9; --chem:#8a3fbf; --bio:#25864a; --geo:#a66d16;
  --accent:var(--phy);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --sheet:#182120; --ink:#e3ebe8; --ink-2:#9fb0aa; --rule:#2a3532; --wash:#1f2a28;
  --math:#f27a9a; --phy:#7d9cf5; --chem:#c393ec; --bio:#6cc98d; --geo:#e0a94e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --sheet:#182120; --ink:#e3ebe8; --ink-2:#9fb0aa; --rule:#2a3532; --wash:#1f2a28;
  --math:#f27a9a; --phy:#7d9cf5; --chem:#c393ec; --bio:#6cc98d; --geo:#e0a94e; color-scheme:dark}
body[data-subject="math"]{--accent:var(--math)}
body[data-subject="physics"]{--accent:var(--phy)}
body[data-subject="chemistry"]{--accent:var(--chem)}
body[data-subject="biology"]{--accent:var(--bio)}
body[data-subject="earth"]{--accent:var(--geo)}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1240px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tab i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tab:hover{color:var(--ink);background:var(--wash)}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--rule);background:var(--sheet)}
.tab[disabled]{opacity:.45;cursor:not-allowed}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:1 1 220px;justify-content:flex-end;min-width:0}
.search{position:relative;flex:1 1 220px;max-width:320px;min-width:0}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-2);fill:none;stroke-width:2}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.iconbtn:hover{color:var(--ink)}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 80px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:14px;padding-right:6px}
.rail h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--ink-2);font-weight:500}
.rail ol{list-style:none;margin:0;padding:0}
.rail li a{display:block;padding:3px 10px;border-left:2px solid var(--rule);text-decoration:none;color:var(--ink-2);line-height:1.5}
.rail li a:hover{color:var(--ink)}
.rail li a.on{color:var(--ink);border-left-color:var(--accent);font-weight:500}
.rail li.l3 a{padding-left:24px;font-size:13px}
.rail li.l2{margin-top:6px}
.tocbtn{display:none}
main{min-width:0}

/* home */
.hero{padding-block:8px 28px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.2;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:62ch}
.ladder{display:flex;gap:8px;margin-top:18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.stg{font-style:normal;font-size:11.5px;font-weight:500;letter-spacing:.06em;padding:1px 7px;border-radius:4px;border:1px solid var(--stg,var(--ink-2));color:var(--stg,var(--ink-2));white-space:nowrap;line-height:1.5;display:inline-block;font-family:var(--f-body)}
.stg[data-stage="初中"]{background:color-mix(in srgb,var(--stg,var(--ink-2)) 14%,transparent)}
.stg[data-stage="高中"]{background:var(--stg,var(--ink-2));color:var(--sheet)}
.stg[data-stage="实验"],.stg[data-stage="方法"]{border-style:dashed}
.doc,.rail{--stg:var(--accent)}
.card{--stg:var(--c)}
.doc h2 .pn{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em;margin-bottom:4px}
.doc h2 .ht2{display:block}
.rail .stg{margin-left:6px;font-size:10.5px;padding:0 5px;vertical-align:1px}
.card ol a{display:flex;gap:8px;align-items:center}
.card ol a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card ol .stg{flex:none;font-size:10.5px;padding:0 5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .sym{font-family:var(--f-mono);font-size:13px;color:var(--c);letter-spacing:.06em}
.card h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.3}
.card h2 button{all:unset;cursor:pointer}
.card h2 button:hover{color:var(--c)}
.card ol{margin:0;padding:0;list-style:none;font-size:14px;border-top:1px solid var(--rule)}
.card ol li{border-bottom:1px solid var(--rule)}
.card ol a{padding:6px 0;color:var(--ink);text-decoration:none}
.card ol a:hover{color:var(--c)}
.card .meta{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:auto}
.card.pending{border-style:dashed;background:transparent}
.card.pending p{margin:0;font-size:14px;color:var(--ink-2)}

/* document */
.doc{max-width:800px}
.doc .dochead{border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:8px}
.doc .dochead .sym{font-family:var(--f-mono);color:var(--accent);font-size:13px;letter-spacing:.08em}
.doc .dochead h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.4vw,40px);margin:4px 0 0;line-height:1.25;text-wrap:balance}
.doc h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.35;margin:56px 0 14px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance;scroll-margin-top:90px}
.doc h3{font-size:19px;font-weight:700;margin:32px 0 8px;scroll-margin-top:90px;display:flex;gap:10px;align-items:baseline}
.doc h3::before{content:"";flex:none;width:6px;height:6px;background:var(--accent);border-radius:1px;transform:translateY(-3px)}
.doc p,.doc li{max-width:68ch}
.doc ul,.doc ol{padding-left:1.4em}
.doc li{margin:3px 0}
.doc li p{margin:0}
.doc strong{font-weight:700;color:var(--ink)}
.doc code{font-family:var(--f-mono);font-size:.9em;background:var(--wash);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.tw table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
.tw th{text-align:left;font-weight:700;background:var(--wash);white-space:nowrap}
.tw th,.tw td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tw tr:last-child td{border-bottom:0}
.tw td{font-variant-numeric:tabular-nums}
.math{overflow-x:auto;margin:14px 0;padding:14px 18px;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;text-align:center}
.math mjx-container{margin:0!important}
.doc input[type=checkbox]{accent-color:var(--accent);margin-right:6px}
.doc ul:has(input[type=checkbox]){list-style:none;padding-left:.4em}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 18%,transparent)}to{background:transparent}}

/* search results */
.results{max-width:800px}
.results h1{font-family:var(--f-display);font-size:28px;margin:0 0 4px}
.results .count{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.hit{display:block;text-decoration:none;color:var(--ink);padding:12px 0;border-bottom:1px solid var(--rule)}
.hit:hover .ht{color:var(--c)}
.hit .hs{font-size:12px;color:var(--c);font-family:var(--f-mono);letter-spacing:.04em}
.hit .ht{font-weight:700;margin:2px 0}
.hit .hx{font-size:14px;color:var(--ink-2);line-height:1.6}

.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15}
footer{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 40px;color:var(--ink-2);font-size:13px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;max-height:70vh;background:var(--sheet);border-top:1px solid var(--rule);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
  .rail:not(.open){display:none}
  .tocbtn{display:inline-block}
  .tools{flex-basis:100%}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}html{scroll-behavior:auto}}
</style>

<script id="data" type="application/json">{"math": {"title": "数学知识大全", "format": "md", "content": "## 导读\n\n数学从小学到高中沿两条主线发展：数与代数（从整数运算到函数与导数）、图形与几何（从认识图形到坐标与向量），统计与概率贯穿其中。本册按学段整理概念、公式和常用结论，内容以人教版教材和课程标准为参照。\n\n| 学段 | 学习重点 | 核心能力 |\n| --- | --- | --- |\n| 小学 1–6 年级 | 整数、小数、分数运算；常见图形的周长、面积、体积；简单统计 | 计算、数感、空间观念 |\n| 初中 7–9 年级 | 实数、方程与不等式、一次函数和二次函数、三角形与圆、概率初步 | 代数推理、几何证明 |\n| 高中必修 | 集合与逻辑、函数、三角函数、平面向量、复数、立体几何、统计与概率 | 函数观点、数形结合 |\n| 高中选择性必修 | 空间向量、解析几何、数列、导数、计数原理、概率分布 | 运算求解、建模 |\n\n**使用建议**\n\n- 公式要和图形或推导一起记，例如等差数列求和对应“倒序相加”，弦长公式对应“联立消元 + 韦达定理”。\n- 每部分末尾的“易错点”和附录 B 是复习时的高频失分清单。\n- 第十四部分的数学思想方法贯穿所有学段，适合最后通读。\n\n## 第一部分 小学：数与运算\n\n小学的“数”从自然数扩展到小数、分数和负数，运算从四则运算到简便计算。这些是后续代数的地基。\n\n### 1. 整数与运算律\n\n- 数位顺序：个、十、百、千、万、十万、百万、千万、亿；每相邻两个计数单位之间的进率是 10。\n- 四则运算顺序：先乘除后加减；有括号先算括号里面的。\n- 运算律：加法交换律 a + b = b + a；加法结合律 (a + b) + c = a + (b + c)；乘法交换律 ab = ba；乘法结合律 (ab)c = a(bc)；乘法分配律 (a + b)c = ac + bc。\n- 简便计算：凑整（25 × 4 = 100，125 × 8 = 1000）；拆分（99 × 37 = 100 × 37 − 37）。\n\n### 2. 因数与倍数\n\n- 2 的倍数个位是 0、2、4、6、8；5 的倍数个位是 0 或 5；3 的倍数各位数字之和是 3 的倍数。\n- 质数只有 1 和它本身两个因数（2 是唯一的偶质数）；合数至少有三个因数；1 既不是质数也不是合数。100 以内有 25 个质数。\n- 分解质因数：60 = 2 × 2 × 3 × 5。\n- 最大公因数用于“平均分成最多几份”，最小公倍数用于“同时再次相遇”。两数乘积 = 最大公因数 × 最小公倍数。\n\n### 3. 小数、分数与百分数\n\n- 分数的基本性质：分子分母同时乘或除以同一个不为零的数，分数大小不变。约分用最大公因数，通分用最小公倍数。\n- 分数加减：同分母直接加减分子；异分母先通分。分数乘法：分子乘分子、分母乘分母；除以一个数等于乘它的倒数。\n- 常用互化：1/2 = 0.5 = 50%，1/4 = 0.25 = 25%，1/5 = 0.2 = 20%，1/8 = 0.125 = 12.5%，3/4 = 0.75 = 75%。\n- 最简分数能化成有限小数的条件：分母只含质因数 2 和 5。\n- 百分数应用：折扣（八折 = 80%）、成数（三成 = 30%）、利率（利息 = 本金 × 利率 × 存期）、税率、增长率。\n\n### 4. 比和比例\n\n- 比的基本性质：前项后项同乘或同除以同一个不为零的数，比值不变。\n- 比例的基本性质：两个外项之积等于两个内项之积，a : b = c : d ⇔ ad = bc。\n- 正比例：y/x = k（一定），图像是过原点的直线；反比例：xy = k（一定）。\n- 比例尺 = 图上距离 / 实际距离；按比分配问题先求总份数。\n\n### 5. 负数与数轴\n\n- 正数和负数表示意义相反的量（零上与零下、收入与支出）。0 既不是正数也不是负数。\n- 数轴上右边的数总比左边的大。\n\n## 第二部分 小学：图形、统计与应用\n\n图形部分要能推导而不只是背公式：长方形面积 → 平行四边形（剪拼）→ 三角形、梯形（拼成平行四边形）→ 圆（分割近似为长方形）。\n\n### 1. 平面图形\n\n| 图形 | 周长 | 面积 |\n| --- | --- | --- |\n| 长方形 | C = 2(a + b) | S = ab |\n| 正方形 | C = 4a | S = a² |\n| 平行四边形 | — | S = ah |\n| 三角形 | — | S = ah ÷ 2 |\n| 梯形 | — | S = (a + b)h ÷ 2 |\n| 圆 | C = 2πr = πd | S = πr² |\n\n- 圆周率 π ≈ 3.14，是一个无限不循环小数；祖冲之把它精确到 3.1415926 与 3.1415927 之间。\n- 半圆的周长 = πr + 2r；圆环面积 = π(R² − r²)。\n- 面积单位进率：1 m² = 100 dm² = 10000 cm²；1 公顷 = 10000 m²；1 km² = 100 公顷。\n\n### 2. 立体图形\n\n| 图形 | 表面积 | 体积 |\n| --- | --- | --- |\n| 长方体 | S = 2(ab + bh + ah) | V = abh |\n| 正方体 | S = 6a² | V = a³ |\n| 圆柱 | S = 2πr² + 2πrh | V = πr²h |\n| 圆锥 | — | V = ⅓πr²h |\n\n- 等底等高的圆锥体积是圆柱的 1/3。\n- 体积单位进率：1 m³ = 1000 dm³，1 dm³ = 1 L = 1000 mL = 1000 cm³。\n\n### 3. 位置、方向与图形运动\n\n- 用数对（列，行）确定位置；用方向和距离确定位置，如“北偏东 30°，500 m 处”。\n- 图形的运动：平移、旋转、轴对称。长方形有 2 条对称轴，正方形 4 条，圆有无数条。\n\n### 4. 统计与可能性\n\n- 统计图：条形统计图看数量多少，折线统计图看变化趋势，扇形统计图看部分与整体的关系。\n- 平均数受极端值影响；中位数是排序后中间的数；众数是出现次数最多的数。\n- 可能性有大有小：袋中红球越多，摸到红球的可能性越大。\n\n### 5. 典型应用题\n\n| 类型 | 数量关系 |\n| --- | --- |\n| 行程问题 | 路程 = 速度 × 时间；相遇时间 = 总路程 ÷ 速度和；追及时间 = 路程差 ÷ 速度差 |\n| 工程问题 | 把工作总量看作 1，工作效率 = 1 ÷ 单独完成时间；合作时间 = 1 ÷ 效率和 |\n| 鸡兔同笼 | 假设全是鸡：兔数 =（总脚数 − 2 × 总头数）÷ 2 |\n| 植树问题 | 两端都种：棵数 = 间隔数 + 1；两端不种：间隔数 − 1；封闭路线：棵数 = 间隔数 |\n| 和差问题 | 大数 =（和 + 差）÷ 2，小数 =（和 − 差）÷ 2 |\n| 浓度问题 | 浓度 = 溶质 ÷ 溶液 × 100% |\n\n## 第三部分 初中：数与代数\n\n初中代数从有理数扩展到实数，从算式走向代数式和方程。“用字母表示数”是从算术到代数的关键一步。\n\n### 1. 有理数与实数\n\n- 有理数：整数和分数统称有理数，都可以写成 p/q（q ≠ 0）的形式。无理数：无限不循环小数，如 √2、π。有理数和无理数统称实数，实数与数轴上的点一一对应。\n- 相反数：a 与 −a；绝对值：|a| = a（a ≥ 0），|a| = −a（a < 0）。\n- 有理数运算：同号相加取相同符号，异号相加取绝对值较大数的符号；减去一个数等于加上它的相反数；两数相乘同号得正、异号得负。\n- 乘方：负数的偶次幂为正，奇次幂为负；−2² = −4，而 (−2)² = 4。\n- 科学记数法：a × 10ⁿ（1 ≤ |a| < 10）。近似数精确到哪一位看最后一位数字所在的数位。\n- 平方根与立方根：正数有两个平方根，0 的平方根是 0，负数没有平方根；任何数都有唯一的立方根。\n\n### 2. 整式与因式分解\n\n- 同类项：所含字母相同，相同字母的指数也相同；合并同类项时系数相加，字母和指数不变。\n- 幂的运算：aᵐ · aⁿ = aᵐ⁺ⁿ；(aᵐ)ⁿ = aᵐⁿ；(ab)ⁿ = aⁿbⁿ；aᵐ ÷ aⁿ = aᵐ⁻ⁿ；a⁰ = 1（a ≠ 0）；a⁻ᵖ = 1/aᵖ。\n- 乘法公式：\n\n```latex\n(a+b)(a-b) = a^2 - b^2,\\qquad (a\\pm b)^2 = a^2 \\pm 2ab + b^2\n```\n\n- 因式分解步骤：先提公因式，再用公式法（平方差、完全平方），二次三项式用十字相乘法，最后检查每个因式是否还能分解。例：x² − 5x + 6 = (x − 2)(x − 3)。\n\n### 3. 分式与二次根式\n\n- 分式有意义的条件：分母不为零；分式值为零的条件：分子为零且分母不为零。\n- 分式运算先因式分解再约分；解分式方程要检验，使最简公分母为零的根是增根。\n- 二次根式 √a 有意义的条件 a ≥ 0；√(a²) = |a|。\n- 运算：√a · √b = √(ab)（a ≥ 0，b ≥ 0）；分母有理化：1/√2 = √2/2。\n\n### 4. 方程与不等式\n\n- 一元一次方程步骤：去分母 → 去括号 → 移项 → 合并同类项 → 系数化为 1。去分母时不含分母的项也要乘最简公分母。\n- 二元一次方程组：代入消元法、加减消元法。\n- 一元二次方程 ax² + bx + c = 0（a ≠ 0）的解法：直接开平方法、配方法、公式法、因式分解法。\n\n```latex\nx = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}\n```\n\n- 判别式 Δ = b² − 4ac：Δ > 0 有两个不等实根，Δ = 0 有两个相等实根，Δ < 0 没有实根。\n- 根与系数的关系（韦达定理）：x₁ + x₂ = −b/a，x₁x₂ = c/a。\n- 不等式性质：两边同乘或同除以同一个负数，不等号方向改变。不等式组解集口诀：“同大取大，同小取小，大小小大中间找，大大小小找不到。”\n- 应用题：行程、工程、销售（利润 = 售价 − 进价，利润率 = 利润 ÷ 进价）、增长率（a(1 + x)² = b）。\n\n## 第四部分 初中：函数\n\n函数描述一个量随另一个量变化的规律。初中学习一次函数、反比例函数、二次函数三类，重点是“解析式—图像—性质”三者互相转化。\n\n### 1. 平面直角坐标系\n\n- 四个象限点的坐标符号：第一象限 (+, +)，第二 (−, +)，第三 (−, −)，第四 (+, −)；坐标轴上的点不属于任何象限。\n- 点 (x, y) 关于 x 轴对称的点为 (x, −y)，关于 y 轴为 (−x, y)，关于原点为 (−x, −y)。\n- 两点距离：√[(x₁ − x₂)² + (y₁ − y₂)²]；中点坐标：((x₁ + x₂)/2, (y₁ + y₂)/2)。\n\n### 2. 一次函数与反比例函数\n\n| 函数 | 解析式 | 图像 | 性质 |\n| --- | --- | --- | --- |\n| 正比例函数 | y = kx（k ≠ 0） | 过原点的直线 | k > 0 时 y 随 x 增大而增大 |\n| 一次函数 | y = kx + b（k ≠ 0） | 直线，与 y 轴交于 (0, b) | k 决定增减，b 决定与 y 轴交点 |\n| 反比例函数 | y = k/x（k ≠ 0） | 双曲线 | k > 0 时位于一、三象限，在每个象限内 y 随 x 增大而减小 |\n\n- 两条直线平行：k 相等、b 不等；一次函数与一元一次方程、不等式的关系：kx + b > 0 的解集就是直线在 x 轴上方部分对应的 x 范围。\n- 反比例函数中，过图像上一点作两坐标轴的垂线，所围矩形面积为 |k|。\n- 待定系数法：设出解析式，代入已知点，解方程组求系数。\n\n### 3. 二次函数\n\n```latex\ny = ax^2 + bx + c = a\\left(x + \\frac{b}{2a}\\right)^2 + \\frac{4ac - b^2}{4a}\n```\n\n- 顶点 (−b/2a, (4ac − b²)/4a)，对称轴 x = −b/2a。a > 0 开口向上、有最小值；a < 0 开口向下、有最大值。\n- 三种表达式：一般式 y = ax² + bx + c；顶点式 y = a(x − h)² + k；交点式 y = a(x − x₁)(x − x₂)。\n- 图像平移：“左加右减（括号内 x），上加下减（整体）”。\n- 与 x 轴交点个数由 Δ 决定。a、b 同号时对称轴在 y 轴左侧（“左同右异”）。\n- 实际问题求最值：注意自变量的取值范围，顶点不在范围内时最值在端点取得。\n\n## 第五部分 初中：图形与几何\n\n初中几何的核心是演绎证明：从定义和基本事实出发，经过严密推理得到定理。三角形是一切图形的基础。\n\n### 1. 相交线、平行线与三角形\n\n- 对顶角相等；同位角相等、内错角相等、同旁内角互补 ⇔ 两直线平行。\n- 三角形三边关系：两边之和大于第三边，两边之差小于第三边。内角和 180°，外角等于不相邻两个内角之和。\n- n 边形内角和 (n − 2) × 180°，外角和恒为 360°。\n- 三角形的重要线段：中线（交于重心）、角平分线（交于内心，到三边距离相等）、高（交于垂心）；垂直平分线交于外心（到三个顶点距离相等）。\n- 中位线：平行于第三边且等于第三边的一半。\n\n### 2. 全等与相似\n\n| 关系 | 判定 |\n| --- | --- |\n| 全等三角形 | SSS、SAS、ASA、AAS；直角三角形还有 HL。注意 SSA 不能判定全等 |\n| 相似三角形 | 两角对应相等；两边成比例且夹角相等；三边成比例 |\n\n- 相似三角形对应边、对应高、对应中线、周长之比等于相似比，面积比等于相似比的平方。\n- 平行线分线段成比例；“A 字型”“8 字型”“母子型（射影定理）”是常见相似模型。\n\n### 3. 特殊三角形与勾股定理\n\n- 等腰三角形“三线合一”：顶角平分线、底边中线、底边上的高重合。等边三角形三个角都是 60°。\n- 直角三角形：30° 角所对直角边等于斜边的一半；斜边中线等于斜边的一半。\n- 勾股定理：a² + b² = c²；逆定理可判定直角三角形。常见勾股数：3、4、5；5、12、13；8、15、17；7、24、25。\n\n### 4. 四边形\n\n| 图形 | 判定（任选其一） | 特有性质 |\n| --- | --- | --- |\n| 平行四边形 | 两组对边分别平行；两组对边分别相等；一组对边平行且相等；对角线互相平分 | 对边相等、对角相等、对角线互相平分；中心对称 |\n| 矩形 | 有一个角是直角的平行四边形；对角线相等的平行四边形 | 四个角都是直角，对角线相等 |\n| 菱形 | 邻边相等的平行四边形；对角线互相垂直的平行四边形 | 四边相等，对角线互相垂直平分且平分每组对角；面积 = 对角线乘积的一半 |\n| 正方形 | 既是矩形又是菱形 | 兼有矩形和菱形的全部性质 |\n| 梯形 | 一组对边平行、另一组对边不平行 | 等腰梯形同一底上的两角相等，对角线相等 |\n\n### 5. 锐角三角函数\n\n- 在 Rt△ABC 中（∠C = 90°）：sinA = 对边/斜边，cosA = 邻边/斜边，tanA = 对边/邻边。\n- 特殊角：sin30° = 1/2，sin45° = √2/2，sin60° = √3/2；cos30° = √3/2，cos45° = √2/2，cos60° = 1/2；tan30° = √3/3，tan45° = 1，tan60° = √3。\n- 关系：sin²A + cos²A = 1，tanA = sinA/cosA，sinA = cos(90° − A)。\n- 应用：仰角、俯角、坡度 i = 铅直高度 / 水平宽度 = tanα。\n\n### 6. 圆\n\n- 垂径定理：垂直于弦的直径平分弦，并且平分弦所对的两条弧。\n- 圆周角定理：同弧所对的圆周角等于它所对圆心角的一半；直径所对的圆周角是直角；圆内接四边形对角互补。\n- 切线：经过半径外端且垂直于这条半径的直线；切线长定理：从圆外一点引的两条切线长相等。\n- 点与圆、直线与圆的位置关系：比较 d 与 r。\n- 弧长 l = nπr/180，扇形面积 S = nπr²/360 = ½lr；圆锥侧面积 S = πrl（l 为母线长）。\n- 正多边形与圆：正六边形边长等于外接圆半径。\n\n### 7. 图形变换与尺规作图\n\n- 平移、旋转、轴对称都不改变图形的形状和大小；位似是特殊的相似。\n- 五种基本尺规作图：作一条线段等于已知线段、作一个角等于已知角、作角的平分线、作线段的垂直平分线、过一点作已知直线的垂线。\n- 最短路径：“将军饮马”利用轴对称把折线转化为直线（两点之间线段最短）。\n\n## 第六部分 初中：统计与概率\n\n### 1. 数据的收集与描述\n\n- 全面调查（普查）与抽样调查；样本要有代表性，样本容量是样本中个体的数目，没有单位。\n- 频数分布直方图：组距、组数、频数；频率 = 频数 / 总数。\n\n### 2. 数据的分析\n\n- 集中趋势：平均数、中位数、众数；加权平均数 x̄ = (x₁w₁ + … + xₙwₙ)/(w₁ + … + wₙ)。\n- 离散程度：方差越大，数据波动越大。\n\n```latex\ns^2 = \\frac{1}{n}\\left[(x_1-\\bar{x})^2 + (x_2-\\bar{x})^2 + \\cdots + (x_n-\\bar{x})^2\\right]\n```\n\n- 每个数据都加上同一个数，平均数也加上这个数，方差不变；每个数据都乘以 a，方差变为原来的 a² 倍。\n\n### 3. 概率初步\n\n- 必然事件概率为 1，不可能事件概率为 0，随机事件概率在 0 和 1 之间。\n- 古典概型：P(A) = m/n；用列表法或树状图列出所有等可能的结果。注意“放回”和“不放回”的区别。\n- 大量重复试验中，事件发生的频率稳定于概率，可用频率估计概率。\n\n## 第七部分 高中：集合、逻辑与不等式\n\n高中数学开篇用集合语言统一描述数学对象，用逻辑用语规范推理，不等式是后续求最值、范围的基本工具。\n\n### 1. 集合\n\n- 元素的三个特性：确定性、互异性、无序性。常用数集：N（自然数）、N* 或 N₊（正整数）、Z（整数）、Q（有理数）、R（实数）。\n- 关系与运算：子集 A ⊆ B；交集 A ∩ B；并集 A ∪ B；补集 ∁_U A。\n- 含 n 个元素的集合有 2ⁿ 个子集，2ⁿ − 1 个真子集。空集是任何集合的子集。\n- 易错点：由 A ⊆ B 求参数时，不要漏掉 A = ∅ 的情况。\n\n### 2. 常用逻辑用语\n\n- 充分条件与必要条件：p ⇒ q，则 p 是 q 的充分条件，q 是 p 的必要条件；“小范围推出大范围”。\n- 全称量词命题“∀x ∈ M，p(x)”的否定是存在量词命题“∃x ∈ M，¬p(x)”，反之亦然。否定命题时只否定结论，量词也要改变。\n\n### 3. 不等式\n\n- 一元二次不等式：结合二次函数图像求解，“大于取两边，小于取中间”（a > 0 时）。\n- 基本不等式：\n\n```latex\n\\frac{a+b}{2} \\ge \\sqrt{ab}\\quad (a>0,\\ b>0)\n```\n\n- 等号成立当且仅当 a = b。使用口诀：“一正二定三相等”。积为定值时和有最小值，和为定值时积有最大值。\n- 常用变形：a² + b² ≥ 2ab；ab ≤ ((a + b)/2)²；“1 的代换”求最值，如已知 x + y = 1（x, y > 0），求 1/x + 1/y 的最小值为 4。\n\n## 第八部分 高中：函数与导数\n\n函数是高中数学的主线。先用定义域、单调性、奇偶性、周期性刻画函数，再学习指数、对数、幂函数和三角函数，最后用导数统一研究函数的变化。\n\n### 1. 函数的概念与性质\n\n- 函数三要素：定义域、对应关系、值域。求定义域：分母不为零、偶次根号下非负、对数真数大于零、零次幂底数不为零。\n- 单调性：定义法（取值—作差—变形—定号—结论）、图像法、导数法。复合函数单调性“同增异减”。\n- 奇偶性：定义域必须关于原点对称；奇函数 f(−x) = −f(x)，图像关于原点对称，若在 x = 0 处有定义则 f(0) = 0；偶函数 f(−x) = f(x)，图像关于 y 轴对称。\n- 周期性：f(x + T) = f(x)；若 f(x + a) = −f(x)，则周期为 2a。\n- 对称性：若 f(a + x) = f(a − x)，图像关于直线 x = a 对称；若 f(a + x) + f(a − x) = 2b，图像关于点 (a, b) 对称。\n\n### 2. 指数函数、对数函数与幂函数\n\n- 指数运算：aʳ · aˢ = aʳ⁺ˢ；(aʳ)ˢ = aʳˢ；a^(m/n) = ⁿ√(aᵐ)。\n- 对数运算（a > 0 且 a ≠ 1，M、N > 0）：\n\n```latex\n\\log_a(MN) = \\log_a M + \\log_a N,\\quad \\log_a \\frac{M}{N} = \\log_a M - \\log_a N,\\quad \\log_a M^n = n\\log_a M\n```\n\n```latex\n\\log_a b = \\frac{\\log_c b}{\\log_c a}\\ (\\text{换底公式}),\\qquad a^{\\log_a N} = N\n```\n\n| 函数 | 定义域 | 过定点 | 单调性 |\n| --- | --- | --- | --- |\n| y = aˣ（a > 0，a ≠ 1） | R | (0, 1) | a > 1 增；0 < a < 1 减 |\n| y = logₐx（a > 0，a ≠ 1） | (0, +∞) | (1, 0) | a > 1 增；0 < a < 1 减 |\n| y = x^α | 依 α 而定 | (1, 1) | α > 0 时在 (0, +∞) 上增；α < 0 时减 |\n\n- 指数函数与同底的对数函数互为反函数，图像关于直线 y = x 对称。\n- 比较大小：同底用单调性，同指数用幂函数，都不同时找中间量（0 或 1）。\n- 增长快慢：当 x 足够大时，指数函数（a > 1）增长最快，幂函数次之，对数函数最慢（“指数爆炸”）。\n\n### 3. 函数的零点与应用\n\n- 零点存在定理：f(x) 在 [a, b] 上连续且 f(a)f(b) < 0，则在 (a, b) 内至少有一个零点。\n- 方程 f(x) = g(x) 的根 ⇔ 函数 y = f(x) 与 y = g(x) 图像的交点横坐标；含参数问题常用“分离参数 + 数形结合”。\n- 二分法求近似零点；函数模型：一次、二次、指数（复利、人口增长）、对数、分段函数。\n\n### 4. 导数及其应用\n\n- 导数的几何意义：f′(x₀) 是曲线在点 (x₀, f(x₀)) 处切线的斜率。切线方程 y − f(x₀) = f′(x₀)(x − x₀)。求“过”某点的切线时，要先设切点。\n\n| 函数 | 导数 |\n| --- | --- |\n| C（常数） | 0 |\n| xⁿ | nxⁿ⁻¹ |\n| sin x | cos x |\n| cos x | −sin x |\n| eˣ | eˣ |\n| aˣ | aˣ ln a |\n| ln x | 1/x |\n| logₐx | 1/(x ln a) |\n\n- 运算法则：(u ± v)′ = u′ ± v′；(uv)′ = u′v + uv′；(u/v)′ = (u′v − uv′)/v²；复合函数 y = f(g(x)) 的导数 y′ = f′(g(x)) · g′(x)。\n- 单调性：f′(x) > 0 的区间单调递增，f′(x) < 0 的区间单调递减。已知单调性求参数时用 f′(x) ≥ 0（或 ≤ 0）恒成立。\n- 极值与最值：f′(x₀) = 0 且两侧导数异号，x₀ 是极值点（“左正右负”为极大值）；闭区间上的最值在极值点或端点处取得。f′(x₀) = 0 是 x₀ 为极值点的必要不充分条件。\n- 恒成立问题：f(x) ≥ a 恒成立 ⇔ f(x)ₘᵢₙ ≥ a；f(x) ≤ a 恒成立 ⇔ f(x)ₘₐₓ ≤ a。\n- 常用不等式：eˣ ≥ x + 1；ln x ≤ x − 1（x > 0），当且仅当 x = 0 或 x = 1 时取等号。\n\n## 第九部分 高中：三角函数、平面向量与复数\n\n三角函数是描述周期现象的函数模型，平面向量是沟通代数与几何的桥梁，复数则把数系从实数扩充到复平面。\n\n### 1. 任意角与三角函数\n\n- 弧度制：180° = π rad，1 rad ≈ 57.3°。弧长 l = |α|r，扇形面积 S = ½lr = ½|α|r²。\n- 定义：角 α 终边上一点 P(x, y)，r = √(x² + y²)，则 sinα = y/r，cosα = x/r，tanα = y/x。\n- 各象限符号口诀：“一全正，二正弦，三正切，四余弦”。\n- 同角关系：sin²α + cos²α = 1，tanα = sinα/cosα。\n- 诱导公式口诀：“奇变偶不变，符号看象限”（k · π/2 ± α，k 为奇数时函数名改变）。\n\n### 2. 三角恒等变换\n\n```latex\n\\sin(\\alpha \\pm \\beta) = \\sin\\alpha\\cos\\beta \\pm \\cos\\alpha\\sin\\beta,\\qquad \\cos(\\alpha \\pm \\beta) = \\cos\\alpha\\cos\\beta \\mp \\sin\\alpha\\sin\\beta\n```\n\n```latex\n\\tan(\\alpha \\pm \\beta) = \\frac{\\tan\\alpha \\pm \\tan\\beta}{1 \\mp \\tan\\alpha\\tan\\beta}\n```\n\n- 二倍角：sin2α = 2sinα cosα；cos2α = cos²α − sin²α = 2cos²α − 1 = 1 − 2sin²α；tan2α = 2tanα/(1 − tan²α)。\n- 降幂：cos²α = (1 + cos2α)/2，sin²α = (1 − cos2α)/2。\n- 辅助角公式：a sinx + b cosx = √(a² + b²) sin(x + φ)，其中 tanφ = b/a。\n\n### 3. 三角函数的图像与性质\n\n| 函数 | 周期 | 值域 | 对称性 |\n| --- | --- | --- | --- |\n| y = sin x | 2π | [−1, 1] | 奇函数；对称轴 x = π/2 + kπ |\n| y = cos x | 2π | [−1, 1] | 偶函数；对称轴 x = kπ |\n| y = tan x | π | R | 奇函数；定义域 x ≠ π/2 + kπ |\n\n- y = A sin(ωx + φ)：振幅 |A|，周期 T = 2π/|ω|，初相 φ。\n- 图像变换：先平移后伸缩时平移 |φ| 个单位；先伸缩后平移时平移 |φ/ω| 个单位。“左加右减”只针对 x 本身。\n- 五点法作图：令 ωx + φ 分别取 0、π/2、π、3π/2、2π。\n\n### 4. 解三角形\n\n```latex\n\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R,\\qquad a^2 = b^2 + c^2 - 2bc\\cos A\n```\n\n- 面积 S = ½ab sinC = ½bc sinA = ½ac sinB。\n- 选用：已知两角一边或两边及一边对角用正弦定理（后者可能有两解）；已知三边或两边及夹角用余弦定理。\n- 三角形中：A + B + C = π，sin(A + B) = sinC；大边对大角，a > b ⇔ A > B ⇔ sinA > sinB。\n\n### 5. 平面向量\n\n- 线性运算：三角形法则、平行四边形法则；共线定理 b = λa（a ≠ 0）。\n- 坐标运算：a = (x₁, y₁)，b = (x₂, y₂)；a ∥ b ⇔ x₁y₂ − x₂y₁ = 0；a ⊥ b ⇔ x₁x₂ + y₁y₂ = 0。\n- 数量积：a · b = |a||b|cosθ = x₁x₂ + y₁y₂；|a| = √(a · a)；投影向量为 (a · b / |b|²) b。\n- 三点共线：若 OP = λOA + μOB 且 λ + μ = 1，则 P、A、B 共线。\n\n### 6. 复数\n\n- i² = −1；复数 z = a + bi（a, b ∈ R），b = 0 时为实数，a = 0 且 b ≠ 0 时为纯虚数。\n- 共轭复数 z̄ = a − bi；模 |z| = √(a² + b²)；z · z̄ = |z|²。\n- 除法：分子分母同乘分母的共轭复数。复数 a + bi 对应复平面上的点 (a, b)。\n- iⁿ 的周期为 4：i、−1、−i、1。\n\n## 第十部分 高中：数列\n\n数列是定义在正整数集上的函数。等差、等比数列是两类基本模型，求通项和求和是两大核心问题。\n\n### 1. 等差数列与等比数列\n\n| 项目 | 等差数列 | 等比数列 |\n| --- | --- | --- |\n| 定义 | aₙ₊₁ − aₙ = d | aₙ₊₁ / aₙ = q（q ≠ 0） |\n| 通项 | aₙ = a₁ + (n − 1)d | aₙ = a₁qⁿ⁻¹ |\n| 前 n 项和 | Sₙ = n(a₁ + aₙ)/2 = na₁ + n(n − 1)d/2 | q ≠ 1 时 Sₙ = a₁(1 − qⁿ)/(1 − q)；q = 1 时 Sₙ = na₁ |\n| 中项 | 2b = a + c | b² = ac（b ≠ 0） |\n| 下标性质 | m + n = p + q ⇒ aₘ + aₙ = aₚ + a_q | m + n = p + q ⇒ aₘaₙ = aₚa_q |\n| 片段和 | Sₖ、S₂ₖ − Sₖ、S₃ₖ − S₂ₖ 成等差数列 | Sₖ、S₂ₖ − Sₖ、S₃ₖ − S₂ₖ 成等比数列（各段不为零时） |\n\n- 等比数列求和时一定要讨论 q 是否等于 1。\n\n### 2. 求通项的方法\n\n- 已知 Sₙ 求 aₙ：aₙ = Sₙ − Sₙ₋₁（n ≥ 2），并单独验证 n = 1。\n- 累加法：aₙ₊₁ − aₙ = f(n)；累乘法：aₙ₊₁ / aₙ = f(n)。\n- 构造法：aₙ₊₁ = paₙ + q 型，构造 aₙ₊₁ + t = p(aₙ + t) 为等比数列；aₙ₊₁ = paₙ/(qaₙ + p) 型，取倒数构造等差数列。\n\n### 3. 数列求和的方法\n\n- 公式法；分组求和（等差 + 等比）；倒序相加；错位相减（等差 × 等比）；裂项相消：\n\n```latex\n\\frac{1}{n(n+1)} = \\frac{1}{n} - \\frac{1}{n+1},\\qquad \\frac{1}{(2n-1)(2n+1)} = \\frac{1}{2}\\left(\\frac{1}{2n-1} - \\frac{1}{2n+1}\\right)\n```\n\n- 数学归纳法：验证 n = 1（或起始值）成立；假设 n = k 时成立，证明 n = k + 1 时也成立。\n\n## 第十一部分 高中：立体几何\n\n立体几何先用直观图和推理认识空间中点、线、面的位置关系，再用空间向量把几何证明和计算转化为坐标运算。\n\n### 1. 空间几何体\n\n| 几何体 | 表面积 | 体积 |\n| --- | --- | --- |\n| 棱柱、圆柱 | 侧面积 + 2 个底面积；圆柱 2πrh + 2πr² | V = Sh |\n| 棱锥、圆锥 | 侧面积 + 底面积；圆锥 πrl + πr² | V = ⅓Sh |\n| 棱台、圆台 | 侧面积 + 上下底面积；圆台 π(r + r′)l + πr² + πr′² | V = ⅓h(S + √(SS′) + S′) |\n| 球 | 4πR² | ⁴⁄₃πR³ |\n\n- 斜二测画法：平行于 x 轴的线段长度不变，平行于 y 轴的线段长度减半，∠x′O′y′ = 45°；直观图面积是原图形的 √2/4 倍。\n- 外接球：长方体外接球直径等于体对角线长 √(a² + b² + c²)；正方体棱长为 a，外接球半径 √3a/2，内切球半径 a/2。\n\n### 2. 点、线、面的位置关系\n\n- 判定定理（证明“线面平行”等）：\n    - 线面平行：平面外一条直线与平面内一条直线平行\n    - 面面平行：一个平面内两条相交直线都平行于另一个平面\n    - 线面垂直：直线垂直于平面内两条相交直线\n    - 面面垂直：一个平面经过另一个平面的一条垂线\n- 性质定理：线面平行 ⇒ 线线平行（过直线的平面与已知平面的交线）；面面垂直 ⇒ 线面垂直（在一个平面内垂直于交线的直线）。\n- 空间角范围：异面直线所成角 (0°, 90°]；直线与平面所成角 [0°, 90°]；二面角 [0°, 180°]。\n\n### 3. 空间向量\n\n- 设直线方向向量 a、b，平面法向量 m、n：\n    - 线线角：cosθ = |a · b| / (|a||b|)\n    - 线面角：sinθ = |a · n| / (|a||n|)\n    - 二面角：|cosθ| = |m · n| / (|m||n|)，是锐角还是钝角要结合图形判断\n    - 点 P 到平面的距离：d = |AP · n| / |n|（A 为平面内一点）\n- 求法向量：设 n = (x, y, z)，与平面内两个不共线向量的数量积为零，解出一组非零解。\n\n## 第十二部分 高中：平面解析几何\n\n解析几何用坐标和方程研究图形。核心方法是“设—联立—消元—韦达定理”，难点在运算。\n\n### 1. 直线与圆\n\n- 斜率 k = tanα = (y₂ − y₁)/(x₂ − x₁)，倾斜角 α ∈ [0, π)；倾斜角为 90° 时斜率不存在。\n- 直线方程：点斜式 y − y₀ = k(x − x₀)；斜截式 y = kx + b；一般式 Ax + By + C = 0。\n- 两直线平行 k₁ = k₂（截距不等）；垂直 k₁k₂ = −1，或一般式中 A₁A₂ + B₁B₂ = 0。\n- 点到直线距离 d = |Ax₀ + By₀ + C| / √(A² + B²)；两平行线距离 d = |C₁ − C₂| / √(A² + B²)。\n- 圆：标准方程 (x − a)² + (y − b)² = r²；一般方程 x² + y² + Dx + Ey + F = 0（D² + E² − 4F > 0）。\n- 直线与圆的位置关系比较圆心到直线距离 d 与 r；弦长 = 2√(r² − d²)。\n\n### 2. 圆锥曲线\n\n| 曲线 | 定义 | 标准方程（焦点在 x 轴） | 关系与性质 |\n| --- | --- | --- | --- |\n| 椭圆 | \\|PF₁\\| + \\|PF₂\\| = 2a（2a > \\|F₁F₂\\|） | x²/a² + y²/b² = 1（a > b > 0） | a² = b² + c²；离心率 e = c/a ∈ (0, 1) |\n| 双曲线 | \\|\\|PF₁\\| − \\|PF₂\\|\\| = 2a（0 < 2a < \\|F₁F₂\\|） | x²/a² − y²/b² = 1 | c² = a² + b²；e > 1；渐近线 y = ±(b/a)x |\n| 抛物线 | 到定点与定直线距离相等 | y² = 2px（p > 0） | 焦点 (p/2, 0)，准线 x = −p/2；焦半径 \\|PF\\| = x₀ + p/2 |\n\n- 椭圆通径长 2b²/a；焦点三角形面积 S = b² tan(θ/2)（θ 为 ∠F₁PF₂）。\n- 抛物线焦点弦长 |AB| = x₁ + x₂ + p。\n\n### 3. 直线与圆锥曲线\n\n- 通法：设直线 y = kx + m（注意斜率不存在的情况，或设 x = ty + n），与曲线方程联立，消元得关于 x 的一元二次方程，用 Δ > 0 保证有两个交点，用韦达定理表示 x₁ + x₂、x₁x₂。\n- 弦长公式：\n\n```latex\n|AB| = \\sqrt{1+k^2}\\,|x_1 - x_2| = \\sqrt{1+k^2}\\cdot\\sqrt{(x_1+x_2)^2 - 4x_1x_2}\n```\n\n- 中点弦问题用“点差法”：椭圆中 k_AB · k_OM = −b²/a²（M 为弦中点）。\n- 定点、定值问题：先用特殊位置猜出定点或定值，再进行一般性证明。\n\n## 第十三部分 高中：计数原理、概率与统计\n\n### 1. 计数原理\n\n- 分类加法计数原理（分类，每类都能独立完成）；分步乘法计数原理（分步，各步都完成才算完成）。\n\n```latex\nA_n^m = \\frac{n!}{(n-m)!},\\qquad C_n^m = \\frac{n!}{m!\\,(n-m)!},\\qquad C_n^m = C_n^{n-m},\\qquad C_{n+1}^m = C_n^m + C_n^{m-1}\n```\n\n- 常用技巧：特殊元素优先安排；相邻问题“捆绑法”；不相邻问题“插空法”；定序问题用除法；分组分配问题注意平均分组要除以组数的阶乘。\n- 二项式定理：(a + b)ⁿ = Σ Cₙᵏ aⁿ⁻ᵏ bᵏ，通项 Tₖ₊₁ = Cₙᵏ aⁿ⁻ᵏ bᵏ；二项式系数之和为 2ⁿ，奇数项与偶数项二项式系数之和都是 2ⁿ⁻¹。\n\n### 2. 概率\n\n- 互斥事件 P(A ∪ B) = P(A) + P(B)；对立事件 P(Ā) = 1 − P(A)；相互独立事件 P(AB) = P(A)P(B)。\n- 条件概率 P(B|A) = P(AB)/P(A)；全概率公式 P(B) = Σ P(Aᵢ)P(B|Aᵢ)。\n\n| 分布 | 概率 | 期望 | 方差 |\n| --- | --- | --- | --- |\n| 两点分布 | P(X = 1) = p | p | p(1 − p) |\n| 二项分布 B(n, p) | P(X = k) = Cₙᵏ pᵏ(1 − p)ⁿ⁻ᵏ | np | np(1 − p) |\n| 超几何分布 | P(X = k) = C_Mᵏ C_{N−M}^{n−k} / C_Nⁿ | nM/N | — |\n| 正态分布 N(μ, σ²) | 曲线关于 x = μ 对称 | μ | σ² |\n\n- 期望与方差的性质：E(aX + b) = aE(X) + b；D(aX + b) = a²D(X)。\n- 正态分布的 3σ 原则：P(μ − σ ≤ X ≤ μ + σ) ≈ 0.6827，P(μ − 2σ ≤ X ≤ μ + 2σ) ≈ 0.9545，P(μ − 3σ ≤ X ≤ μ + 3σ) ≈ 0.9973。\n- 二项分布与超几何分布的区别：有放回抽取（独立重复）用二项分布，不放回抽取用超几何分布。\n\n### 3. 统计\n\n- 抽样方法：简单随机抽样、分层抽样（按比例）。\n- 用样本估计总体：频率分布直方图中，各小矩形面积之和为 1；众数取最高矩形底边中点；中位数左右两侧面积各为 0.5；平均数为各组中点 × 频率之和。\n- 百分位数：第 p 百分位数，先计算 i = n × p%，i 不是整数时取大于 i 的最小整数位置上的数，是整数时取第 i 项与第 i + 1 项的平均数。\n- 成对数据：相关系数 r 的绝对值越接近 1，线性相关越强；回归直线 ŷ = b̂x + â 必过样本中心点 (x̄, ȳ)；残差平方和越小拟合效果越好。\n- 独立性检验：根据 2 × 2 列联表计算 χ²，与临界值比较（如 α = 0.05 时临界值 3.841）判断两个分类变量是否有关联。\n\n## 第十四部分 数学思想与解题方法\n\n数学思想方法贯穿从小学到高中的全部内容。会解一道题靠知识，会解一类题靠方法。\n\n### 1. 四大数学思想\n\n| 思想 | 含义 | 典型应用 |\n| --- | --- | --- |\n| 函数与方程思想 | 用函数观点分析变量关系，用方程刻画等量关系 | 不等式恒成立转化为函数最值；数列看作特殊函数 |\n| 数形结合思想 | 以形助数、以数解形 | 方程根的个数转化为图像交点；数轴解不等式；向量解几何 |\n| 分类讨论思想 | 按标准不重不漏地分情况 | 含参二次函数、等比数列 q = 1 与否、直线斜率是否存在 |\n| 转化与化归思想 | 把新问题转化为已解决的问题 | 立体问题平面化、陌生问题熟悉化、复杂问题简单化 |\n\n### 2. 常用解题方法\n\n- 配方法：二次函数求最值、圆的一般方程化标准方程。\n- 换元法：整体换元（令 t = 2ˣ）、三角换元（令 x = cosθ）；换元后注意新变量的取值范围。\n- 待定系数法：求函数解析式、直线和圆锥曲线方程、因式分解。\n- 构造法：构造函数证明不等式，构造等比数列求通项。\n- 特殊值法与排除法：选择题中用特殊值验证或排除选项。\n- 反证法：假设结论不成立，推出矛盾。证明“√2 是无理数”“至多”“至少”“唯一性”等命题常用。\n- 数学归纳法：证明与正整数 n 有关的命题。\n\n### 3. 解题的一般步骤（波利亚）\n\n1. 理解题目：已知什么？求什么？条件是否充分？\n2. 拟定方案：见过类似的题吗？能否转化为已知问题？\n3. 执行方案：每一步都检查是否正确\n4. 回顾反思：结果合理吗？能否用别的方法？这个方法还能用在哪里？\n\n## 附录\n\n### A. 常用数值与公式\n\n| 项目 | 数值或公式 |\n| --- | --- |\n| π | ≈ 3.14159 |\n| e | ≈ 2.71828 |\n| √2、√3、√5 | ≈ 1.414、1.732、2.236 |\n| lg2、lg3 | ≈ 0.3010、0.4771 |\n| ln2 | ≈ 0.693 |\n| 1 rad | ≈ 57.3° |\n| 1 到 n 的和 | n(n + 1)/2 |\n| 1² 到 n² 的和 | n(n + 1)(2n + 1)/6 |\n| 1³ 到 n³ 的和 | [n(n + 1)/2]² |\n| 立方和、立方差 | a³ ± b³ = (a ± b)(a² ∓ ab + b²) |\n| 完全立方 | (a ± b)³ = a³ ± 3a²b + 3ab² ± b³ |\n\n### B. 易错点清单\n\n| 易错点 | 正确做法 |\n| --- | --- |\n| −2² 与 (−2)² | −2² = −4，(−2)² = 4 |\n| √(a²) = a | √(a²) = \\|a\\| |\n| 分式方程不检验 | 必须检验增根 |\n| 不等式两边同乘负数 | 不等号方向改变 |\n| 一元二次方程忽略 a ≠ 0 | 二次项系数含参数时先讨论 |\n| 求子集时漏掉空集 | A ⊆ B 中 A 可以是 ∅ |\n| 函数性质不先求定义域 | 单调区间、奇偶性都以定义域为前提 |\n| 等比数列求和不讨论 q | 先判断 q 是否等于 1 |\n| 由 Sₙ 求 aₙ 不验证 n = 1 | aₙ = Sₙ − Sₙ₋₁ 只对 n ≥ 2 成立 |\n| 设直线忽略斜率不存在 | 单独讨论或设 x = ty + m |\n| 直线与圆锥曲线联立不检验 Δ | 用 Δ > 0 保证有两个交点 |\n| 二面角直接取锐角 | 结合图形判断锐角还是钝角 |\n| f′(x₀) = 0 就认为是极值点 | 还要检验两侧导数是否变号 |\n| 基本不等式忽略“三相等” | 检查等号能否取到 |\n\n### C. 数学史年表\n\n| 时间 | 人物 | 事件 |\n| --- | --- | --- |\n| 约公元前 6 世纪 | 毕达哥拉斯学派 | 证明勾股定理（西方称毕达哥拉斯定理），发现无理数 |\n| 约公元前 300 年 | 欧几里得 | 《几何原本》建立公理化演绎体系 |\n| 约公元前 3 世纪 | 阿基米德 | 用穷竭法求面积、体积，估算圆周率 |\n| 公元 1 世纪前后 | 中国 | 《九章算术》成书，最早系统记载负数和方程组解法 |\n| 263 年 | 刘徽 | 注《九章算术》，用割圆术计算圆周率 |\n| 5 世纪 | 祖冲之 | 把圆周率精确到小数点后 7 位 |\n| 1247 年 | 秦九韶 | 《数书九章》提出高次方程数值解法和中国剩余定理的一般解法 |\n| 1261 年 | 杨辉 | 记载“杨辉三角”（二项式系数表） |\n| 1614 年 | 纳皮尔 | 发明对数 |\n| 1637 年 | 笛卡尔 | 创立解析几何 |\n| 1654 年 | 帕斯卡、费马 | 通信讨论赌金分配问题，奠定概率论基础 |\n| 17 世纪后期 | 牛顿、莱布尼茨 | 各自独立创立微积分 |\n| 1748 年 | 欧拉 | 给出欧拉公式 e^(iπ) + 1 = 0 所依据的关系 e^(ix) = cos x + i sin x |\n| 1799 年 | 高斯 | 证明代数基本定理 |\n| 1830 年前后 | 伽罗瓦 | 群论思想，解决五次方程根式求解问题 |\n| 1966 年 | 陈景润 | 证明“1 + 2”，哥德巴赫猜想研究的重要成果 |\n| 1994 年 | 怀尔斯 | 证明费马大定理 |\n\n### D. 常用术语中英对照\n\n| 中文 | 英文 |\n| --- | --- |\n| 整数 / 分数 / 小数 / 百分数 | integer / fraction / decimal / percentage |\n| 有理数 / 无理数 / 实数 / 复数 | rational number / irrational number / real number / complex number |\n| 方程 / 不等式 / 函数 | equation / inequality / function |\n| 定义域 / 值域 / 单调性 | domain / range / monotonicity |\n| 一次函数 / 二次函数 / 反比例函数 | linear function / quadratic function / inverse proportional function |\n| 指数函数 / 对数函数 / 三角函数 | exponential function / logarithmic function / trigonometric function |\n| 导数 / 极值 / 最值 | derivative / extremum / maximum and minimum |\n| 数列 / 等差数列 / 等比数列 | sequence / arithmetic sequence / geometric sequence |\n| 向量 / 数量积 / 法向量 | vector / dot product / normal vector |\n| 三角形 / 全等 / 相似 | triangle / congruent / similar |\n| 勾股定理 / 圆 / 切线 | Pythagorean theorem / circle / tangent line |\n| 椭圆 / 双曲线 / 抛物线 | ellipse / hyperbola / parabola |\n| 排列 / 组合 / 二项式定理 | permutation / combination / binomial theorem |\n| 概率 / 期望 / 方差 / 正态分布 | probability / expectation / variance / normal distribution |\n| 集合 / 子集 / 交集 / 并集 | set / subset / intersection / union |", "extras": [], "parts": [["导读", "导读"], ["小学", "数与运算"], ["小学", "图形、统计与应用"], ["初中", "数与代数"], ["初中", "函数"], ["初中", "图形与几何"], ["初中", "统计与概率"], ["高中", "集合、逻辑与不等式"], ["高中", "函数与导数"], ["高中", "三角函数、平面向量与复数"], ["高中", "数列"], ["高中", "立体几何"], ["高中", "平面解析几何"], ["高中", "计数原理、概率与统计"], ["方法", "数学思想与解题方法"], ["附录", "附录"]]}, "physics": {"title": "物理知识大全", "format": "html", "content": "<h2 id=\"导读\">导读<\/h2>\n<p>物理从小学到高中是一条螺旋上升的路：小学看现象，初中学规律和简单定量计算，高中用矢量、函数和守恒思想统一解释。本文按学段整理核心概念、公式、单位和易错点，内容以人教版课程标准为参照，可作复习提纲或查阅手册。<\/p>\n<table><thead><tr><th>学段<\/th><th>学习重点<\/th><th>数学工具<\/th><th>典型能力<\/th><\/tr><\/thead><tbody><tr><td>小学（科学课）<\/td><td>观察现象、认识材料、简单实验<\/td><td>测量、比较、记录<\/td><td>提出问题、做对比实验<\/td><\/tr><tr><td>初中（8–9 年级）<\/td><td>声光热力电五大板块的基本规律<\/td><td>比例、一元方程<\/td><td>公式计算、控制变量法<\/td><\/tr><tr><td>高中（必修 + 选择性必修）<\/td><td>力学、电磁学为主干，热光原补充<\/td><td>矢量、函数图像、三角、初步微元<\/td><td>建模、守恒分析、图像分析<\/td><\/tr><\/tbody><\/table>\n<p><strong>使用建议<\/strong><\/p>\n<ul><li><p>先看每部分开头一句话，抓住该板块的主线。<\/p><\/li><li><p>公式表中注明了单位和适用条件，条件比公式本身更常考。<\/p><\/li><li><p>「易错点」是考试高频失分处，复习时重点过一遍。<\/p><\/li><\/ul>\n<p>符号约定：g 取 9.8 N/kg（估算取 10 N/kg）；未特别说明时均使用国际单位制。<\/p>\n\n<h2 id=\"第一部分-小学科学中的物理\">第一部分 小学科学中的物理<\/h2>\n<p>小学阶段不要求计算，目标是认识现象、学会观察和做公平的对比实验。下列内容是初中物理的直接前导。<\/p>\n<h3 id=\"1-物体与材料\">1. 物体与材料<\/h3>\n<ul><li><p>物体由材料构成：木材、金属、塑料、玻璃、陶瓷各有硬度、弹性、导热性、导电性等不同性质。<\/p><\/li><li><p>物质有三种常见状态：固态（有形状和体积）、液态（有体积无固定形状）、气态（都不固定）。<\/p><\/li><li><p>水的三态变化：结冰、融化、蒸发、凝结；水在 0 ℃ 结冰，在 100 ℃ 沸腾（标准大气压下）。<\/p><\/li><li><p>热胀冷缩：大多数物体受热体积变大，温度计就是利用液体热胀冷缩制成的。<\/p><\/li><li><p>沉与浮：物体在水中的沉浮与材料和形状有关，橡皮泥捏成船形可以浮起来。<\/p><\/li><\/ul>\n<h3 id=\"2-力与运动\">2. 力与运动<\/h3>\n<ul><li><p>力可以推、拉、压，能改变物体的形状和运动状态；用弹簧测力计测量，单位是牛顿（N）。<\/p><\/li><li><p>重力使物体下落；弹力来自形变的物体；摩擦力阻碍运动，接触面越粗糙摩擦越大。<\/p><\/li><li><p>滚动比滑动省力，轮子和轴承就是这个道理。<\/p><\/li><li><p>简单机械：杠杆、轮轴（方向盘、螺丝刀）、滑轮、斜面都能帮助我们省力或改变方向。<\/p><\/li><li><p>运动的快慢用速度描述；判断运动要先选参照物。<\/p><\/li><\/ul>\n<h3 id=\"3-声光热\">3. 声、光、热<\/h3>\n<ul><li><p>声音由物体振动产生，靠空气、水、固体传播；振动越快音越高，幅度越大声越大。<\/p><\/li><li><p>光沿直线传播，形成影子；光遇到镜面会反射，从空气斜射入水会折射。<\/p><\/li><li><p>白光经三棱镜分解成七色光（彩虹就是这样形成的）。<\/p><\/li><li><p>热的传递有三种方式：传导（金属勺变烫）、对流（烧水时水翻滚）、辐射（晒太阳）。<\/p><\/li><li><p>热总是从高温物体传向低温物体；保温杯和棉衣都是减少热传递。<\/p><\/li><\/ul>\n<h3 id=\"4-电与磁\">4. 电与磁<\/h3>\n<ul><li><p>简单电路由电源（电池）、导线、开关、用电器（小灯泡）组成，必须是闭合回路灯才亮。<\/p><\/li><li><p>导体（铜、铝、铁、石墨、人体）容易导电；绝缘体（塑料、橡胶、干木头）不容易导电。<\/p><\/li><li><p>磁铁有 N、S 两极，同极相斥、异极相吸；指南针利用地磁场指向南北。<\/p><\/li><li><p>电磁铁：通电线圈绕在铁钉上就有磁性，电流越大、匈数越多磁性越强。<\/p><\/li><li><p>安全用电：不用湿手碰开关，不把金属物插入插座。<\/p><\/li><\/ul>\n<h3 id=\"5-地球与宇宙\">5. 地球与宇宙<\/h3>\n<ul><li><p>地球自转产生昼夜，公转加上地轴倾斜产生四季。<\/p><\/li><li><p>月相变化周期约 29.5 天，是月球被太阳照亮部分的可见比例变化。<\/p><\/li><li><p>日食、月食是光的直线传播的结果。<\/p><\/li><\/ul>\n<p><strong>小学必备的科学方法<\/strong>：做对比实验时只改变一个条件，其他条件保持不变；这就是初中「控制变量法」的雏形。<\/p>\n<h3 id=\"6-能量及其转化\">6. 能量及其转化<\/h3>\n<ul><li><p>常见能量形式：动能（运动的物体）、势能（被举高或被拉伸的物体）、热能、光能、电能、化学能（食物、燃料、电池）、声能。<\/p><\/li><li><p>能量可以相互转化：电灯把电能转化为光能和热能；太阳能电池把光能转化为电能；植物把光能转化为化学能储存在体内；人吃饭后把化学能转化为运动的能量和热。<\/p><\/li><li><p>风车、水车利用风和流水的能量；滚动的小球能推动积木，说明运动的物体具有能量。<\/p><\/li><li><p>节约能源：随手关灯、少开空调、多步行和骑自行车，这些行为减少了煤和石油的消耗。<\/p><\/li><\/ul>\n<h3 id=\"7-常用测量与工具\">7. 常用测量与工具<\/h3>\n<table><thead><tr><th>工具<\/th><th>测量的量<\/th><th>使用要点<\/th><\/tr><\/thead><tbody><tr><td>尺子<\/td><td>长度<\/td><td>零刻度线对准被测物体一端，视线与尺面垂直<\/td><\/tr><tr><td>温度计<\/td><td>温度<\/td><td>玻璃泡浸没在被测液体中，不碰容器底和壁，示数稳定后再读<\/td><\/tr><tr><td>弹簧测力计<\/td><td>力<\/td><td>先看量程和分度值，使用前调零，拉力方向与弹簧轴线一致<\/td><\/tr><tr><td>量筒、量杯<\/td><td>液体体积<\/td><td>放在水平桌面上，视线与凹液面最低处相平<\/td><\/tr><tr><td>秒表<\/td><td>时间<\/td><td>开始和停止要及时，多次测量取平均<\/td><\/tr><tr><td>指南针<\/td><td>方向<\/td><td>远离磁铁和铁器，静止时涂色一端（N 极）指北<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>简单机械初体验：撬棍、开瓶器是杠杆；旗杆顶上的滑轮改变用力方向；盘山公路相当于斜面，省力但费距离。<\/p><\/li><\/ul>\n<h2 id=\"第二部分-初中物理上运动声光热现象密度\">第二部分 初中物理（上）：运动、声、光、热现象、密度<\/h2>\n<p>八年级上册从测量开始，建立「物理量 = 数值 + 单位」的观念，主线是速度和密度两个比值定义。<\/p>\n<h3 id=\"1-机械运动\">1. 机械运动<\/h3>\n<ul><li><p><strong>长度与时间<\/strong>：长度主单位米（m），1 km = 1000 m，1 m = 100 cm = 1000 mm；时间主单位秒（s）。刻度尺读数要估读到分度值的下一位。<\/p><\/li><li><p><strong>误差<\/strong>：测量值与真实值之差，不可避免只能减小（多次测量取平均、用更精密仪器）；错误可以避免。<\/p><\/li><li><p><strong>参照物<\/strong>：运动和静止是相对的，选不同参照物结论可能不同。<\/p><\/li><li><p><strong>速度<\/strong>：v = s / t，单位 m/s 或 km/h，1 m/s = 3.6 km/h。<\/p><\/li><li><p><strong>匀速直线运动<\/strong>：速度大小和方向都不变；变速运动用平均速度 = 总路程 / 总时间（不是速度的平均值）。<\/p><\/li><\/ul>\n<h3 id=\"2-声现象\">2. 声现象<\/h3>\n<ul><li><p>声音由物体振动产生，传播需要介质，真空不能传声。<\/p><\/li><li><p>声速：15 ℃ 空气中约 340 m/s；一般 v固 &gt; v液 &gt; v气。<\/p><\/li><li><p>回声测距：s = v × t / 2（t 为发声到听到回声的总时间）。<\/p><\/li><\/ul>\n<table><thead><tr><th>乐音三特性<\/th><th>决定因素<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>音调（高低）<\/td><td>频率<\/td><td>弦越短越紧越细，音调越高<\/td><\/tr><tr><td>响度（大小）<\/td><td>振幅、距发声体远近<\/td><td>用力敲鼓声音更响<\/td><\/tr><tr><td>音色（品质）<\/td><td>发声体材料和结构<\/td><td>闻声辨人<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>人耳听觉范围 20–20000 Hz；低于 20 Hz 是次声波（地震、台风），高于 20000 Hz 是超声波（B 超、声呐）。<\/p><\/li><li><p>声可以传递信息和能量。噪声控制三途径：声源处、传播过程中、人耳处；单位分贝（dB）。<\/p><\/li><\/ul>\n<h3 id=\"3-光现象\">3. 光现象<\/h3>\n<ul><li><p>光在同种均匀介质中沿直线传播（影子、日月食、小孔成像）。真空光速 c = 3 × 10^8 m/s。<\/p><\/li><li><p><strong>反射定律<\/strong>：三线共面、法线居中、反射角等于入射角；光路可逆。镜面反射与漫反射都遵循反射定律。<\/p><\/li><li><p><strong>平面镜成像<\/strong>：等大、等距、垂直、虚像（像与物关于镜面对称）。<\/p><\/li><li><p><strong>折射<\/strong>：光从空气斜射入水或玻璃，折射角小于入射角；水中筷子「变弯」、池水变浅。<\/p><\/li><li><p>光的色散：白光由七色光组成；色光三原色为红、绿、蓝。红外线热效应显著，紫外线能使荧光物质发光。<\/p><\/li><\/ul>\n<p><strong>凸透镜成像规律<\/strong>（f 为焦距，u 为物距）<\/p>\n<table><thead><tr><th>物距<\/th><th>像的性质<\/th><th>像距<\/th><th>应用<\/th><\/tr><\/thead><tbody><tr><td>u &gt; 2f<\/td><td>倒立、缩小、实像<\/td><td>f &lt; v &lt; 2f<\/td><td>照相机、人眼<\/td><\/tr><tr><td>u = 2f<\/td><td>倒立、等大、实像<\/td><td>v = 2f<\/td><td>测焦距<\/td><\/tr><tr><td>f &lt; u &lt; 2f<\/td><td>倒立、放大、实像<\/td><td>v &gt; 2f<\/td><td>投影仪<\/td><\/tr><tr><td>u = f<\/td><td>不成像<\/td><td>—<\/td><td>探照灯（平行光）<\/td><\/tr><tr><td>u &lt; f<\/td><td>正立、放大、虚像<\/td><td>与物同侧<\/td><td>放大镜<\/td><\/tr><\/tbody><\/table>\n<p>口诀：一倍焦距分虚实，二倍焦距分大小；物近像远像变大。近视眼用凹透镜矫正，远视眼用凸透镜矫正。<\/p>\n<h3 id=\"4-物态变化\">4. 物态变化<\/h3>\n<ul><li><p>温度：摄氏度（℃）规定冰水混合物 0 ℃、标准大气压下沸水 100 ℃。体温计量程 35–42 ℃，分度值 0.1 ℃。<\/p><\/li><\/ul>\n<table><thead><tr><th>变化<\/th><th>方向<\/th><th>吸/放热<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>熔化<\/td><td>固 → 液<\/td><td>吸热<\/td><td>冰雪消融<\/td><\/tr><tr><td>凝固<\/td><td>液 → 固<\/td><td>放热<\/td><td>水结冰<\/td><\/tr><tr><td>汽化（蒸发、沸腾）<\/td><td>液 → 气<\/td><td>吸热<\/td><td>湿衣服变干<\/td><\/tr><tr><td>液化<\/td><td>气 → 液<\/td><td>放热<\/td><td>露、雾、「白气」<\/td><\/tr><tr><td>升华<\/td><td>固 → 气<\/td><td>吸热<\/td><td>干冰、樟脑丸变小<\/td><\/tr><tr><td>凝华<\/td><td>气 → 固<\/td><td>放热<\/td><td>霜、雾凇、冰花<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>晶体有固定熔点（冰、金属、海波），非晶体没有（石蜡、玻璃、沥青）。晶体熔化时持续吸热但温度不变。<\/p><\/li><li><p>沸腾条件：达到沸点且继续吸热；气压越高沸点越高（高压锅）。<\/p><\/li><li><p>影响蒸发快慢：温度、表面积、表面空气流速。<\/p><\/li><li><p>易错点：「白气」是小水珠（液化），不是水蒸气；水蒸气看不见。<\/p><\/li><\/ul>\n<h3 id=\"5-质量与密度\">5. 质量与密度<\/h3>\n<ul><li><p><strong>质量<\/strong> m：物体所含物质的多少，不随形状、状态、位置、温度改变；单位 kg，1 t = 1000 kg。天平使用「左物右码」，游码读左侧。<\/p><\/li><li><p><strong>密度<\/strong>：ρ = m / V，单位 kg/m³，1 g/cm³ = 1000 kg/m³。水的密度 1.0 × 10³ kg/m³。<\/p><\/li><li><p>密度是物质特性，与 m、V 无关，但随状态和温度变化（水结冰密度变小、体积变大）。<\/p><\/li><li><p>测密度：天平测质量，量筒用「排水法」测体积。测液体密度先测「杯 + 液」再倒出一部分，可减小残留误差。<\/p><\/li><\/ul>\n<h3 id=\"6-光学作图与透镜应用\">6. 光学作图与透镜应用<\/h3>\n<ul><li><p>反射作图：先画法线（虚线，垂直于镜面），再按反射角等于入射角画光线；光线带箭头，法线和反向延长线用虚线。<\/p><\/li><li><p>平面镜成像作图两种方法：① 对称法：作物体各点关于镜面的对称点，用虚线连接即为像；② 反射定律法：从物点画两条入射光线，反射光线的反向延长线交点就是像点。<\/p><\/li><li><p>凸透镜三条特殊光线：平行于主光轴的光线折射后过焦点；过焦点的光线折射后平行于主光轴；过光心的光线传播方向不变。<\/p><\/li><li><p>凹透镜对光有发散作用：平行于主光轴的光线折射后，反向延长线过虚焦点。<\/p><\/li><li><p>折射作图：光从空气斜射入水或玻璃，折射光线偏向法线；光垂直入射时传播方向不变。看水中的鱼，看到的是偏高的虚像，叉鱼要对准“鱼的下方”。<\/p><\/li><li><p>光学仪器：照相机（u &gt; 2f，缩小实像）；投影仪（f &lt; u &lt; 2f，放大实像，胶片要倒放）；放大镜（u &lt; f，放大虚像）；显微镜物镜相当于投影仪、目镜相当于放大镜；望远镜物镜相当于照相机。<\/p><\/li><li><p>成实像时“物近像远像变大”：要让光屏上的像变大，蜡烛靠近透镜、光屏远离透镜。用纸遮住透镜一半，像仍完整，只是变暗。<\/p><\/li><\/ul>\n<h3 id=\"7-例题精选\">7. 例题精选<\/h3>\n<p><strong>例 1（平均速度）<\/strong>：小明前半程以 4 m/s 骑行，后半程以 6 m/s 骑行，全程平均速度是多少？<\/p>\n<ul><li><p>设半程为 s，则 t₁ = s/4，t₂ = s/6，v = 2s / (s/4 + s/6) = 4.8 m/s。平均速度不是 (4 + 6)/2 = 5 m/s。<\/p><\/li><\/ul>\n<p><strong>例 2（回声）<\/strong>：对着山崖大喊一声，2 s 后听到回声，人离山崖多远？（声速 340 m/s）<\/p>\n<ul><li><p>s = vt / 2 = 340 × 2 / 2 = 340 m。<\/p><\/li><\/ul>\n<p><strong>例 3（密度）<\/strong>：一个空瓶质量 200 g，装满水后总质量 700 g，装满某液体后总质量 600 g，求该液体密度。<\/p>\n<ul><li><p>V = m水 / ρ水 = 500 g ÷ 1 g/cm³ = 500 cm³；ρ液 = 400 g ÷ 500 cm³ = 0.8 g/cm³。关键：同一个瓶子容积不变。<\/p><\/li><\/ul>\n<p><strong>例 4（空心判断）<\/strong>：一个铜球质量 178 g、体积 30 cm³，是否空心？（ρ铜 = 8.9 g/cm³）<\/p>\n<ul><li><p>实心部分体积 V铜 = 178 ÷ 8.9 = 20 cm³ &lt; 30 cm³，是空心的，空心部分 10 cm³。也可以比较密度或质量，但只有比体积能直接求出空心大小。<\/p><\/li><\/ul>\n<h2 id=\"第三部分-初中物理中力压强浮力机械与能\">第三部分 初中物理（中）：力、压强、浮力、机械与能<\/h2>\n<p>八年级下册是初中力学核心：先会受力分析，再用二力平衡、压强、浮力、杠杆公式解题，最后落到功和能。<\/p>\n<h3 id=\"1-力\">1. 力<\/h3>\n<ul><li><p>力是物体对物体的作用，物体间力的作用是相互的；单位牛顿（N）。<\/p><\/li><li><p>力的三要素：大小、方向、作用点，都会影响作用效果；用力的示意图表示。<\/p><\/li><li><p><strong>弹力<\/strong>：弹簧测力计原理是在弹性限度内，弹簧伸长量与拉力成正比。<\/p><\/li><li><p><strong>重力<\/strong>：G = mg，方向竖直向下（重垂线原理），作用点在重心。<\/p><\/li><li><p><strong>摩擦力<\/strong>：滑动摩擦力大小只与压力和接触面粗糙程度有关，与速度、接触面积无关；方向与相对运动（趋势）相反。<\/p><\/li><\/ul>\n<h3 id=\"2-运动和力\">2. 运动和力<\/h3>\n<ul><li><p><strong>牛顿第一定律<\/strong>：一切物体在没有受到力的作用时，总保持静止或匀速直线运动状态。由「实验 + 推理」得出（阻力对物体运动的影响）。<\/p><\/li><li><p><strong>惯性<\/strong>：物体保持原有运动状态不变的性质，只与质量有关。易错：惯性不是力，不能说「受到惯性作用」。<\/p><\/li><li><p><strong>二力平衡<\/strong>：同体、等大、反向、共线。与相互作用力的区别在于：相互作用力作用在两个物体上。<\/p><\/li><li><p>物体静止或匀速直线运动 ⇔ 受平衡力（合力为 0）；受非平衡力时运动状态一定改变。<\/p><\/li><\/ul>\n<h3 id=\"3-压强\">3. 压强<\/h3>\n<table><thead><tr><th>类型<\/th><th>公式<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>固体压强<\/td><td>p = F / S<\/td><td>1 Pa = 1 N/m²；增大压强靠增大 F 或减小 S（刀口磨薄）<\/td><\/tr><tr><td>液体压强<\/td><td>p = ρgh<\/td><td>h 是到自由液面的竖直深度；与容器形状无关；连通器、船闸<\/td><\/tr><tr><td>大气压<\/td><td>p₀ ≈ 1.013 × 10⁵ Pa<\/td><td>马德堡半球证明存在，托里拆利实验测得 760 mm 水银柱；海拔越高气压越低<\/td><\/tr><tr><td>流体压强与流速<\/td><td>—<\/td><td>流速越大压强越小；飞机升力、站台安全线<\/td><\/tr><\/tbody><\/table>\n<p>易错点：压力不一定等于重力，只有水平面上自由静止的物体才 F = G。<\/p>\n<h3 id=\"4-浮力\">4. 浮力<\/h3>\n<ul><li><p>浮力方向竖直向上，源于液体对物体上下表面的压力差。<\/p><\/li><li><p><strong>阿基米德原理<\/strong>：F浮 = G排 = ρ液 g V排。<\/p><\/li><li><p>浮力四种算法：称重法 F浮 = G − F拉；压力差法；原理法；平衡法（漂浮、悬浮时 F浮 = G）。<\/p><\/li><\/ul>\n<table><thead><tr><th>状态<\/th><th>力的关系<\/th><th>密度关系<\/th><\/tr><\/thead><tbody><tr><td>上浮<\/td><td>F浮 &gt; G<\/td><td>ρ物 &lt; ρ液<\/td><\/tr><tr><td>漂浮<\/td><td>F浮 = G<\/td><td>ρ物 &lt; ρ液<\/td><\/tr><tr><td>悬浮<\/td><td>F浮 = G<\/td><td>ρ物 = ρ液<\/td><\/tr><tr><td>下沉<\/td><td>F浮 &lt; G<\/td><td>ρ物 &gt; ρ液<\/td><\/tr><\/tbody><\/table>\n<p>应用：轮船（空心增大 V排）、潜水艇（改变自重）、气球和飞艇、密度计。<\/p>\n<h3 id=\"5-简单机械\">5. 简单机械<\/h3>\n<ul><li><p><strong>杠杆平衡条件<\/strong>：F₁L₁ = F₂L₂。力臂是支点到力的作用线的距离（不是到作用点）。<\/p><\/li><li><p>省力杠杆（撬棒、铡刀）费距离；费力杠杆（钓鱼竿、筷子、青蛙腿）省距离；等臂杠杆（天平）。<\/p><\/li><li><p><strong>滑轮<\/strong>：定滑轮不省力、改变方向；动滑轮省一半力、费一倍距离；滑轮组 F = (G物 + G动) / n，s = nh（n 为承担动滑轮的绳子段数）。<\/p><\/li><li><p>任何机械都不省功。<\/p><\/li><\/ul>\n<h3 id=\"6-功和机械能\">6. 功和机械能<\/h3>\n<table><thead><tr><th>物理量<\/th><th>公式<\/th><th>单位<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>功<\/td><td>W = Fs<\/td><td>焦耳 J<\/td><td>力和沿力方向的距离缺一不可；掬着东西水平走，掬力不做功<\/td><\/tr><tr><td>功率<\/td><td>P = W / t = Fv<\/td><td>瓦特 W<\/td><td>表示做功快慢；汽车上坡换低挡可增大牵引力<\/td><\/tr><tr><td>机械效率<\/td><td>η = W有 / W总<\/td><td>无<\/td><td>总小于 1；滑轮组 η = G / (nF)，增大物重、减小动滑轮重可提高<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>动能与质量和速度有关；重力势能与质量和高度有关；弹性势能与弹性形变程度有关。<\/p><\/li><li><p>只有动能和势能相互转化（无摩擦）时，机械能守恒；单摆、滚摆、卫星远近地点运动是典型例子。<\/p><\/li><\/ul>\n<h3 id=\"7-受力分析与解题技巧\">7. 受力分析与解题技巧<\/h3>\n<ul><li><p>判断摩擦力：静止或匀速时用二力平衡求摩擦力；物体被压在竖直墙上静止时，摩擦力等于重力，与压力大小无关。<\/p><\/li><li><p>惯性常见题：匀速行驶的火车上竖直跳起，仍落回原处；飞机投弹要在目标上方之前投下。<\/p><\/li><li><p>压强先后顺序：固体先求压力 F，再用 p = F/S；液体先用 p = ρgh 求压强，再用 F = pS 求压力。<\/p><\/li><li><p>柱形固体（长方体、圆柱体）对水平面的压强也可用 p = ρgh。<\/p><\/li><li><p>容器形状与底部压力：口大底小的容器，液体对底部压力小于液体重力；直壁容器两者相等；口小底大的容器压力大于重力。<\/p><\/li><li><p>浮力解题三步：① 判断状态（漂浮、悬浮、沉底）；② 选公式（漂浮、悬浮用 F浮 = G，知道排开体积用阿基米德）；③ 注意 V排 与 V物 是否相等（浸没时才相等）。<\/p><\/li><li><p>漂浮物体浸入液体的体积比：V排 / V物 = ρ物 / ρ液。密度计漂浮在不同液体中浮力相同，液体密度越大浸入越浅。<\/p><\/li><li><p>冰化水问题：漂浮在水面上的冰熔化后，水面不变。<\/p><\/li><li><p>滑轮组转向判断：数与动滑轮相连的绳子段数 n；不计摩擦和绳重时 F = (G物 + G动) / n。<\/p><\/li><li><p>杠杆最小力：以支点到力的作用点的连线作为力臂时力臂最长，所需的力最小，力与该连线垂直。<\/p><\/li><\/ul>\n<h3 id=\"8-例题精选\">8. 例题精选<\/h3>\n<p><strong>例 1（液体压强）<\/strong>：水深 0.5 m 的水桶底面积 0.02 m²，求水对桶底的压强和压力。（g = 10 N/kg）<\/p>\n<ul><li><p>p = ρgh = 1.0 × 10³ × 10 × 0.5 = 5 × 10³ Pa；F = pS = 5 × 10³ × 0.02 = 100 N。<\/p><\/li><\/ul>\n<p><strong>例 2（称重法测密度）<\/strong>：石块在空气中用测力计称得 5 N，浸没在水中称得 3 N，求石块密度。<\/p>\n<ul><li><p>F浮 = 5 − 3 = 2 N；V = F浮 / (ρ水 g) = 2 × 10⁻⁴ m³；m = G/g = 0.5 kg；ρ = m/V = 2.5 × 10³ kg/m³。结论可以记为 ρ物 = G / F浮 × ρ水。<\/p><\/li><\/ul>\n<p><strong>例 3（滑轮组效率）<\/strong>：用 n = 3 的滑轮组将 600 N 的重物匀速提升 2 m，拉力 250 N，求有用功、总功和机械效率。<\/p>\n<ul><li><p>W有 = Gh = 1200 J；s = nh = 6 m，W总 = Fs = 1500 J；η = 1200 / 1500 = 80%。不计摩擦时动滑轮重 G动 = nF − G = 150 N。<\/p><\/li><\/ul>\n<p><strong>例 4（功率）<\/strong>：汽车以 72 km/h 匀速行驶，受到的阻力为 2000 N，求发动机功率。<\/p>\n<ul><li><p>匀速时牵引力 F = f = 2000 N，v = 20 m/s，P = Fv = 4 × 10⁴ W。先把 km/h 换成 m/s 是最常见的失分点。<\/p><\/li><\/ul>\n<h2 id=\"第四部分-初中物理下内能电学电与磁能源\">第四部分 初中物理（下）：内能、电学、电与磁、能源<\/h2>\n<p>九年级以电学为重心，核心是欧姆定律加串并联规律，再延伸到电功率和家庭电路；热学部分则是 Q = cmΔt 的计算。<\/p>\n<h3 id=\"1-内能与热机\">1. 内能与热机<\/h3>\n<ul><li><p><strong>分子动理论<\/strong>：物质由分子、原子构成；分子永不停息地做无规则运动（扩散现象，温度越高越剧烈）；分子间同时存在引力和斥力。<\/p><\/li><li><p><strong>内能<\/strong>：物体内所有分子动能和分子势能的总和，一切物体都有内能。改变内能两种方式：做功和热传递（等效）。<\/p><\/li><li><p><strong>比热容<\/strong>：Q = cmΔt，水的比热容 4.2 × 10³ J/(kg·℃)，比热容大所以用水做冷却剂、沿海温差小。<\/p><\/li><li><p><strong>热值<\/strong>：Q放 = mq（气体用 Vq）。热机效率 η = W有用 / Q放。<\/p><\/li><li><p><strong>四冲程汽油机<\/strong>：吸气、压缩、做功、排气；压缩冲程机械能 → 内能，做功冲程内能 → 机械能。一个工作循环：曲轴转 2 圈、做功 1 次。<\/p><\/li><li><p>易错点：温度、热量、内能区分——热量是过程量，只能说「吸收/放出」，不能说「含有」。<\/p><\/li><\/ul>\n<h3 id=\"2-电流与电路\">2. 电流与电路<\/h3>\n<ul><li><p>摩擦起电的实质是电子转移；同种电荷相斥、异种电荷相吸；验电器原理是同种电荷相斥。<\/p><\/li><li><p>电荷定向移动形成电流，规定正电荷定向移动方向为电流方向（与电子实际移动方向相反）。<\/p><\/li><li><p>电路三种状态：通路、断路、短路（电源短路会烧坏电源）。<\/p><\/li><li><p>电流表串联、电压表并联；都要「正进负出」，量程先用大量程试触。<\/p><\/li><li><p>导体电阻由材料、长度、横截面积、温度决定，与电压、电流无关。滑动变阻器靠改变接入电阻丝长度变阻，接法「一上一下」。<\/p><\/li><\/ul>\n<h3 id=\"3-欧姆定律与串并联\">3. 欧姆定律与串并联<\/h3>\n<pre><code class=\"language-latex\">I = \\frac{U}{R}<\/code><\/pre>\n<table><thead><tr><th>规律<\/th><th>串联<\/th><th>并联<\/th><\/tr><\/thead><tbody><tr><td>电流<\/td><td>I = I₁ = I₂<\/td><td>I = I₁ + I₂<\/td><\/tr><tr><td>电压<\/td><td>U = U₁ + U₂<\/td><td>U = U₁ = U₂<\/td><\/tr><tr><td>电阻<\/td><td>R = R₁ + R₂<\/td><td>1/R = 1/R₁ + 1/R₂<\/td><\/tr><tr><td>分配关系<\/td><td>U₁ : U₂ = R₁ : R₂（分压）<\/td><td>I₁ : I₂ = R₂ : R₁（分流）<\/td><\/tr><tr><td>功率分配<\/td><td>P₁ : P₂ = R₁ : R₂<\/td><td>P₁ : P₂ = R₂ : R₁<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>伏安法测电阻：R = U / I；定值电阻多次测量取平均，小灯泡电阻随温度变化不取平均。<\/p><\/li><li><p>动态电路分析顺序：局部电阻变化 → 总电阻 → 总电流 → 各部分电压。<\/p><\/li><\/ul>\n<h3 id=\"4-电功与电功率\">4. 电功与电功率<\/h3>\n<table><thead><tr><th>物理量<\/th><th>定义式<\/th><th>纯电阻电路可用<\/th><th>单位<\/th><\/tr><\/thead><tbody><tr><td>电功<\/td><td>W = UIt<\/td><td>W = I²Rt = U²t/R<\/td><td>J；1 kW·h = 3.6 × 10⁶ J<\/td><\/tr><tr><td>电功率<\/td><td>P = UI<\/td><td>P = I²R = U²/R<\/td><td>W<\/td><\/tr><tr><td>焦耳热<\/td><td>Q = I²Rt<\/td><td>Q = W<\/td><td>J<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>额定功率是额定电压下的功率；灯泡亮度由实际功率决定。<\/p><\/li><li><p>电动机不是纯电阻：W = UIt &gt; Q = I²Rt。<\/p><\/li><\/ul>\n<h3 id=\"5-家庭电路与安全用电\">5. 家庭电路与安全用电<\/h3>\n<ul><li><p>我国家庭电路电压 220 V，对人体安全电压不高于 36 V。<\/p><\/li><li><p>组成顺序：进户线 → 电能表 → 总开关 → 保险丝（空气开关）→ 用电器；用电器之间并联。<\/p><\/li><li><p>开关接火线；三孔插座「左零右火上接地」；试电笔接触火线氖管发光。<\/p><\/li><li><p>电流过大的两个原因：短路、总功率过大。触电时先切断电源。<\/p><\/li><\/ul>\n<h3 id=\"6-电与磁\">6. 电与磁<\/h3>\n<table><thead><tr><th>现象<\/th><th>发现者<\/th><th>能量转化<\/th><th>应用<\/th><\/tr><\/thead><tbody><tr><td>电流的磁效应<\/td><td>奥斯特<\/td><td>—<\/td><td>电磁铁、电磁继电器<\/td><\/tr><tr><td>磁场对电流有力的作用<\/td><td>—<\/td><td>电能 → 机械能<\/td><td>电动机、扬声器<\/td><\/tr><tr><td>电磁感应<\/td><td>法拉第<\/td><td>机械能 → 电能<\/td><td>发电机、动圈式话筒<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>磁感线在磁体外部从 N 极出发回到 S 极；地理南极附近是地磁 N 极（沈括最早记载磁偏角）。<\/p><\/li><li><p>安培定则：右手握住螺线管，四指指向电流方向，大拇指所指为 N 极。<\/p><\/li><li><p>产生感应电流条件：闭合电路的一部分导体在磁场中做切割磁感线运动。<\/p><\/li><\/ul>\n<h3 id=\"7-信息与能源\">7. 信息与能源<\/h3>\n<ul><li><p>电磁波在真空中的速度为 3 × 10^8 m/s，c = λf；手机、广播、卫星通信都靠电磁波。<\/p><\/li><li><p>一次能源（煤、石油、太阳能）与二次能源（电能）；可再生（风能、水能、太阳能）与不可再生（化石能源、核能）。<\/p><\/li><li><p>核电站利用可控核裂变；太阳内部发生核聚变。<\/p><\/li><li><p>能量守恒定律：能量既不会凭空产生也不会凭空消失，只会转化或转移；能量转化有方向性。<\/p><\/li><\/ul>\n<h2 id=\"第五部分-高中力学\">第五部分 高中力学<\/h2>\n<p>高中力学的主线是三大观点：力与运动（牛顿定律）、能量（动能定理与机械能守恒）、动量（动量定理与动量守恒）；与初中最大的区别是量都有方向。<\/p>\n<h3 id=\"1-运动的描述与匀变速直线运动\">1. 运动的描述与匀变速直线运动<\/h3>\n<ul><li><p>质点、参考系、时刻与时间间隔；位移（矢量）与路程（标量）。<\/p><\/li><li><p>加速度 a = Δv / Δt，描述速度变化的快慢，方向与 Δv 相同；a 与 v 同向加速、反向减速。<\/p><\/li><\/ul>\n<table><thead><tr><th>匀变速直线运动公式<\/th><th>表达式<\/th><\/tr><\/thead><tbody><tr><td>速度公式<\/td><td>v = v₀ + at<\/td><\/tr><tr><td>位移公式<\/td><td>x = v₀t + ½at²<\/td><\/tr><tr><td>速度位移关系<\/td><td>v² − v₀² = 2ax<\/td><\/tr><tr><td>平均速度<\/td><td>v̄ = (v₀ + v) / 2 = 中间时刻速度<\/td><\/tr><tr><td>逐差相等<\/td><td>Δx = aT²（纸带求加速度）<\/td><\/tr><tr><td>初速为零的比例<\/td><td>连续相等时间内位移比 1 : 3 : 5 : …<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>自由落体：v = gt，h = ½gt²；竖直上抛上升与下降过程对称。<\/p><\/li><li><p>x–t 图斜率为速度；v–t 图斜率为加速度、面积为位移。<\/p><\/li><li><p>易错点：刹车类问题先算停下来的时间，再带入公式。<\/p><\/li><\/ul>\n<h3 id=\"2-相互作用力\">2. 相互作用——力<\/h3>\n<ul><li><p>重力 G = mg；胡克定律 F = kx；滑动摩擦力 f = μFₙ；静摩擦力 0 &lt; f ≤ fₘₐₓ，由平衡或牛二求。<\/p><\/li><li><p>力的合成与分解遵循平行四边形定则；两力合力范围 |F₁ − F₂| ≤ F ≤ F₁ + F₂。<\/p><\/li><li><p>共点力平衡条件 F合 = 0；常用正交分解、合成法、矢量三角形法（动态平衡）。<\/p><\/li><li><p>受力分析顺序：重力 → 弹力 → 摩擦力 → 其他力；只画研究对象受到的力。<\/p><\/li><\/ul>\n<h3 id=\"3-牛顿运动定律\">3. 牛顿运动定律<\/h3>\n<pre><code class=\"language-latex\">F_{\\text{合}} = ma<\/code><\/pre>\n<ul><li><p>第一定律确立惯性和惯性参考系；第二定律有瞬时性、矢量性、独立性；第三定律作用力与反作用力等大反向、作用在不同物体上。<\/p><\/li><li><p>两类基本问题：由受力求运动、由运动求受力；加速度是连接两者的桥梁。<\/p><\/li><li><p>超重：加速度向上；失重：加速度向下；a = g 时完全失重。重力本身不变。<\/p><\/li><li><p>连接体：先整体求加速度，再隔离求内力。板块模型、传送带模型要判断是否相对滑动。<\/p><\/li><li><p>国际单位制力学基本单位：m、kg、s。<\/p><\/li><\/ul>\n<h3 id=\"4-曲线运动与万有引力\">4. 曲线运动与万有引力<\/h3>\n<ul><li><p>曲线运动条件：合力与速度不共线；合力指向轨迹凹侧。运动的合成与分解（小船渡河、关联速度）。<\/p><\/li><li><p><strong>平抛运动<\/strong>：水平 x = v₀t，竖直 y = ½gt²；下落时间只由高度决定；速度偏角正切是位移偏角正切的 2 倍。<\/p><\/li><li><p><strong>匀速圆周运动<\/strong>：v = ωr，T = 2πr / v，向心加速度 a = v²/r = ω²r，向心力 F = mv²/r。同轴转动 ω 相等，皮带传动线速度相等。<\/p><\/li><li><p>竖直面圆周：轻绳最高点 v ≥ √(gr)，轻杆最高点 v ≥ 0。<\/p><\/li><li><p>开普勒三定律：椭圆轨道、面积定律、a³/T² = k。<\/p><\/li><li><p><strong>万有引力<\/strong>：F = Gm₁m₂ / r²，G = 6.67 × 10⁻¹¹ N·m²/kg²（卡文迪许扭秤测定）。<\/p><\/li><li><p>两条思路：地表 GMm/R² = mg（黄金代换 GM = gR²）；环绕 GMm/r² = mv²/r = mω²r = m(2π/T)²r。<\/p><\/li><li><p>卫星规律：轨道越高，v、ω、a 越小，T 越大（「高轨低速长周期」）。<\/p><\/li><li><p>宇宙速度：第一 7.9 km/s（最大环绕速度、最小发射速度），第二 11.2 km/s，第三 16.7 km/s。地球同步卫星周期 24 h、位于赤道上空、高度固定。<\/p><\/li><\/ul>\n<h3 id=\"5-机械能守恒\">5. 机械能守恒<\/h3>\n<table><thead><tr><th>规律<\/th><th>表达式<\/th><th>适用条件<\/th><\/tr><\/thead><tbody><tr><td>功<\/td><td>W = Fl cosα<\/td><td>恒力；变力用图像面积或动能定理<\/td><\/tr><tr><td>功率<\/td><td>P = W/t，P = Fv<\/td><td>机车两种启动：恒功率、恒加速度；vₘ = P / f<\/td><\/tr><tr><td>动能定理<\/td><td>W合 = ½mv₂² − ½mv₁²<\/td><td>任何力、任何过程，首选工具<\/td><\/tr><tr><td>重力势能<\/td><td>Eₚ = mgh，Wɢ = −ΔEₚ<\/td><td>与参考平面选择有关，变化量无关<\/td><\/tr><tr><td>机械能守恒<\/td><td>Eₖ₁ + Eₚ₁ = Eₖ₂ + Eₚ₂<\/td><td>只有重力或弹力做功<\/td><\/tr><tr><td>功能关系<\/td><td>W其他 = ΔE机；Q = f·x相对<\/td><td>摩擦生热用相对路程<\/td><\/tr><\/tbody><\/table>\n<h3 id=\"6-动量守恒定律\">6. 动量守恒定律<\/h3>\n<ul><li><p>动量 p = mv（矢量）；冲量 I = Ft。<\/p><\/li><li><p>动量定理：F合 t = mv₂ − mv₁，解释缓冲现象（安全气囊延长作用时间）。<\/p><\/li><li><p>动量守恒条件：系统不受外力或外力矢量和为零；内力远大于外力时近似守恒；某方向合外力为零则该方向守恒。<\/p><\/li><li><p>碰撞：弹性碰撞动量、动能都守恒；完全非弹性碰撞（共速）动能损失最大。<\/p><\/li><li><p>一动碰一静的弹性碰撞：v₁′ = (m₁ − m₂)v₁ / (m₁ + m₂)，v₂′ = 2m₁v₁ / (m₁ + m₂)；等质量时交换速度。<\/p><\/li><li><p>反冲现象（火箭）、人船模型 m₁x₁ = m₂x₂。<\/p><\/li><\/ul>\n<h3 id=\"7-机械振动与机械波\">7. 机械振动与机械波<\/h3>\n<ul><li><p>简谐运动：回复力 F = −kx；位移 x = A sin(ωt + φ)。远离平衡位置时 x、F、a、Eₚ 增大，v、Eₖ 减小。<\/p><\/li><li><p>单摆周期 T = 2π√(L/g)（摆角很小时），与摆球质量、振幅无关；可用来测 g。<\/p><\/li><li><p>受迫振动频率等于驱动力频率；驱动频率等于固有频率时发生共振。<\/p><\/li><li><p>机械波：横波与纵波；v = λf = λ/T；波速由介质决定，频率由波源决定。质点不随波迁移。<\/p><\/li><li><p>波的图像与振动图像区分：前者横轴是位置 x，后者横轴是时间 t。判断振动方向用「同侧法」或「上下坡法」。<\/p><\/li><li><p>干涉（频率相同）、衍射（障碍物尺寸与波长相近或更小时明显）、多普勒效应（靠近时接收频率升高）。<\/p><\/li><\/ul>\n<h2 id=\"第六部分-高中电磁学\">第六部分 高中电磁学<\/h2>\n<p>电磁学用「场」统一描述电与磁：电场力和洛伦兹力决定带电粒子如何运动，电磁感应把磁变成电，最终归结为麦克斯韦电磁场理论。<\/p>\n<h3 id=\"1-静电场\">1. 静电场<\/h3>\n<table><thead><tr><th>物理量<\/th><th>公式<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>库仑定律<\/td><td>F = kq₁q₂ / r²<\/td><td>k = 9.0 × 10⁹ N·m²/C²；真空中点电荷<\/td><\/tr><tr><td>电场强度<\/td><td>E = F / q<\/td><td>定义式，与试探电荷无关；点电荷 E = kQ/r²；匀强电场 E = U/d<\/td><\/tr><tr><td>电势能与电势<\/td><td>Eₚ = qφ<\/td><td>沿电场线方向电势降低；电场力做正功电势能减小<\/td><\/tr><tr><td>电势差<\/td><td>Uₐᵦ = φₐ − φᵦ = Wₐᵦ / q<\/td><td>与零电势点选择无关<\/td><\/tr><tr><td>电容<\/td><td>C = Q / U，C = εS / (4πkd)<\/td><td>单位法拉 F；接电源 U 不变，断开后 Q 不变<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>电场线不闭合、不相交，密处场强大；等势面与电场线垂直。<\/p><\/li><li><p>静电平衡的导体：内部场强为零、是等势体、电荷分布在外表面（静电屏蔽）。<\/p><\/li><li><p>带电粒子在电场中：加速 qU = ½mv²；偏转（类平抛）y = qUL² / (2mdv₀²)。<\/p><\/li><li><p>元电荷 e = 1.6 × 10⁻¹⁹ C（密立根油滴实验）；电荷守恒。<\/p><\/li><\/ul>\n<h3 id=\"2-恒定电流\">2. 恒定电流<\/h3>\n<ul><li><p>电流 I = q/t = nqSv；电阻定律 R = ρL/S，电阻率 ρ 由材料和温度决定。<\/p><\/li><li><p><strong>闭合电路欧姆定律<\/strong>：I = E / (R + r)；路端电压 U = E − Ir。外电阻增大，I 减小、U 增大。<\/p><\/li><li><p>U–I 图像：纵截距为电动势，斜率绝对值为内阻。<\/p><\/li><li><p>电源输出功率在 R = r 时最大，Pₘ = E² / (4r)；效率 η = U / E。<\/p><\/li><li><p>电表改装：串联大电阻改电压表，并联小电阻改电流表。伏安法「大内小外」：大电阻用内接法（偏大），小电阻用外接法（偏小）。<\/p><\/li><li><p>多用电表欧姆挡：红进黑出，换挡重新欧姆调零，指针尽量指在中央附近。<\/p><\/li><\/ul>\n<h3 id=\"3-磁场\">3. 磁场<\/h3>\n<ul><li><p>磁感应强度 B = F / (IL)（I ⊥ B），单位特斯拉 T；磁通量 Φ = BS⊥，单位 Wb。<\/p><\/li><li><p><strong>安培力<\/strong>：F = BIL sinθ，方向用左手定则。<\/p><\/li><li><p><strong>洛伦兹力<\/strong>：f = qvB，始终与速度垂直，永不做功。<\/p><\/li><li><p>带电粒子在匀强磁场中做圆周运动：r = mv / (qB)，T = 2πm / (qB)（周期与速度无关）。解题三步：定圆心、求半径、算圆心角。<\/p><\/li><li><p>应用：速度选择器（qE = qvB，v = E/B）、质谱仪、回旋加速器、磁流体发电机、霍尔效应。<\/p><\/li><\/ul>\n<h3 id=\"4-电磁感应\">4. 电磁感应<\/h3>\n<pre><code class=\"language-latex\">E = n\\frac{\\Delta \\Phi}{\\Delta t}<\/code><\/pre>\n<ul><li><p>产生感应电流条件：穿过闭合回路的磁通量发生变化。<\/p><\/li><li><p><strong>楞次定律<\/strong>：感应电流的磁场总要阻碍引起感应电流的磁通量变化（增反减同、来拒去留、增缩减扩）；导体切割用右手定则。<\/p><\/li><li><p>导体切割：E = BLv；转动切割 E = ½BL²ω。<\/p><\/li><li><p>自感：阻碍电流变化（日光灯启动、断电自感灯闪亮）；涡流（电磁炉、金属探测器、电磁阻尼）。<\/p><\/li><li><p>单杆模型综合三大观点：安培力 F = B²L²v / R，终态速度由受力平衡求，焦耳热由能量守恒求，电荷量 q = ΔΦ / R。<\/p><\/li><\/ul>\n<h3 id=\"5-交变电流\">5. 交变电流<\/h3>\n<ul><li><p>正弦交流电 e = Eₘ sinωt，Eₘ = nBSω；中性面处磁通量最大、感应电动势为零。<\/p><\/li><li><p>有效值：E = Eₘ / √2（仅正弦交流）；电器铭牌、电表读数、算热量都用有效值，算电荷量用平均值。<\/p><\/li><li><p>理想变压器：U₁/U₂ = n₁/n₂，I₁/I₂ = n₂/n₁，P₁ = P₂；输入功率由输出功率决定。<\/p><\/li><li><p>远距离输电：P损 = I²R线 = (P/U)²R线，高压输电减少损耗。<\/p><\/li><li><p>电感通直流阻交流、通低频阻高频；电容通交流隔直流、通高频阻低频。<\/p><\/li><\/ul>\n<h3 id=\"6-电磁振荡与电磁波\">6. 电磁振荡与电磁波<\/h3>\n<ul><li><p>LC 振荡周期 T = 2π√(LC)。<\/p><\/li><li><p>麦克斯韦理论：变化的磁场产生电场，变化的电场产生磁场，预言电磁波；赫兹实验证实。<\/p><\/li><li><p>电磁波是横波，传播不需要介质。按波长从长到短：无线电波、红外线、可见光、紫外线、X 射线、γ 射线。<\/p><\/li><li><p>信号发射需要调制（调幅、调频），接收需要调谐和解调。<\/p><\/li><\/ul>\n<h2 id=\"第七部分-高中热学光学与近代物理\">第七部分 高中热学、光学与近代物理<\/h2>\n<p>这三块在高考中多以选择题和小计算题出现，考点集中、记忆性强，是最容易拿满分的部分。<\/p>\n<h3 id=\"1-热学\">1. 热学<\/h3>\n<ul><li><p>分子大小数量级 10⁻¹⁰ m；阿伏伽德罗常数 Nₐ = 6.02 × 10²³ mol⁻¹；油膜法测分子直径 d = V / S。<\/p><\/li><li><p>布朗运动是悬浮颗粒的运动，反映了液体分子的无规则运动。<\/p><\/li><li><p>分子力：r = r₀ 时合力为零、分子势能最小。温度是分子平均动能的标志；T = t + 273.15 K。<\/p><\/li><li><p>晶体（单晶各向异性、多晶各向同性）与非晶体；液体表面张力、浸润与毛细现象；液晶。<\/p><\/li><li><p><strong>理想气体状态方程<\/strong>：pV / T = C（或 pV = nRT）；等温 p₁V₁ = p₂V₂（玻意耳定律）、等容 p/T 不变、等压 V/T 不变。液柱、活塞类问题先求气体压强。<\/p><\/li><li><p><strong>热力学第一定律<\/strong>：ΔU = W + Q（外界对气体做功 W 为正，吸热 Q 为正）。理想气体内能只与温度有关。<\/p><\/li><li><p><strong>热力学第二定律<\/strong>：热量不能自发从低温传到高温；不可能从单一热库吸热全部变为功而不产生其他影响；第二类永动机不可能制成。孤立系统熵不减少。<\/p><\/li><\/ul>\n<h3 id=\"2-光学\">2. 光学<\/h3>\n<ul><li><p><strong>折射定律<\/strong>：n = sinθ₁ / sinθ₂ = c / v，折射率总大于 1。<\/p><\/li><li><p><strong>全反射<\/strong>：光从光密介质射向光疏介质且入射角≥临界角，sin C = 1/n；应用光导纤维、全反射棱镜。<\/p><\/li><li><p>色散：紫光折射率最大、波长最短、频率最高、在介质中速度最小；红光相反。<\/p><\/li><li><p><strong>干涉<\/strong>：双缝干涉条纹间距 Δx = Lλ / d；薄膜干涉（肥皂泡彩色、增透膜、检查平整度）。<\/p><\/li><li><p><strong>衍射<\/strong>：单缝衍射中央条纹最宽最亮；泊松亮斑。<\/p><\/li><li><p><strong>偏振<\/strong>证明光是横波；应用于立体电影、照相机偏振滤镜。<\/p><\/li><li><p>激光特点：相干性好、平行度好、亮度高。<\/p><\/li><\/ul>\n<h3 id=\"3-近代物理\">3. 近代物理<\/h3>\n<table><thead><tr><th>主题<\/th><th>核心规律<\/th><th>关键人物<\/th><\/tr><\/thead><tbody><tr><td>黑体辐射与能量子<\/td><td>ε = hν，h = 6.63 × 10⁻³⁴ J·s<\/td><td>普朗克<\/td><\/tr><tr><td>光电效应<\/td><td>Eₖ = hν − W₀；截止频率 νᴄ = W₀ / h；eUᴄ = Eₖ<\/td><td>爱因斯坦<\/td><\/tr><tr><td>光的波粒二象性<\/td><td>光子动量 p = h / λ<\/td><td>康普顿效应<\/td><\/tr><tr><td>物质波<\/td><td>λ = h / p<\/td><td>德布罗意；电子衍射证实<\/td><\/tr><tr><td>原子核式模型<\/td><td>α 粒子散射实验<\/td><td>卢瑟福<\/td><\/tr><tr><td>玻尔模型<\/td><td>跃迁 hν = Eₘ − Eₙ；氢原子 Eₙ = −13.6 eV / n²<\/td><td>玻尔<\/td><\/tr><tr><td>天然放射性<\/td><td>α（⁴₂He）、β（电子）、γ（光子）；半衰期 m = m₀(1/2)^(t/T)<\/td><td>贝克勒尔、居里夫人<\/td><\/tr><tr><td>核反应<\/td><td>质量数与电荷数守恒；ΔE = Δmc²<\/td><td>爱因斯坦<\/td><\/tr><\/tbody><\/table>\n<ul><li><p>α、β、γ 射线：电离能力依次减弱，穿透能力依次增强。α 衰变质量数减 4、电荷数减 2；β 衰变电荷数加 1。<\/p><\/li><li><p>半衰期由核内部决定，与温度、压强、化学状态无关，只对大量原子核有统计意义。<\/p><\/li><li><p>比结合能越大原子核越稳定，中等质量核（铁附近）最大；重核裂变与轻核聚变都释放能量。<\/p><\/li><li><p>一群处于 n 能级的氢原子最多发出 C(n,2) = n(n−1)/2 种频率的光。<\/p><\/li><li><p>狭义相对论两个基本假设：相对性原理、光速不变原理；推论有时间延缓、长度收缩。<\/p><\/li><\/ul>\n<h2 id=\"附录\">附录<\/h2>\n<h3 id=\"a-常用物理常量\">A. 常用物理常量<\/h3>\n<table><thead><tr><th>常量<\/th><th>符号<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>真空光速<\/td><td>c<\/td><td>3.0 × 10⁸ m/s<\/td><\/tr><tr><td>重力加速度<\/td><td>g<\/td><td>9.8 m/s²（估算 10）<\/td><\/tr><tr><td>引力常量<\/td><td>G<\/td><td>6.67 × 10⁻¹¹ N·m²/kg²<\/td><\/tr><tr><td>静电力常量<\/td><td>k<\/td><td>9.0 × 10⁹ N·m²/C²<\/td><\/tr><tr><td>元电荷<\/td><td>e<\/td><td>1.6 × 10⁻¹⁹ C<\/td><\/tr><tr><td>电子质量<\/td><td>mₑ<\/td><td>9.1 × 10⁻³¹ kg<\/td><\/tr><tr><td>普朗克常量<\/td><td>h<\/td><td>6.63 × 10⁻³⁴ J·s<\/td><\/tr><tr><td>阿伏伽德罗常数<\/td><td>Nₐ<\/td><td>6.02 × 10²³ mol⁻¹<\/td><\/tr><tr><td>标准大气压<\/td><td>p₀<\/td><td>1.013 × 10⁵ Pa<\/td><\/tr><tr><td>15 ℃ 空气中声速<\/td><td>v<\/td><td>340 m/s<\/td><\/tr><tr><td>水的密度<\/td><td>ρ水<\/td><td>1.0 × 10³ kg/m³<\/td><\/tr><tr><td>水的比热容<\/td><td>c水<\/td><td>4.2 × 10³ J/(kg·℃)<\/td><\/tr><tr><td>电子伏特<\/td><td>eV<\/td><td>1 eV = 1.6 × 10⁻¹⁹ J<\/td><\/tr><\/tbody><\/table>\n<h3 id=\"b-国际单位制七个基本单位\">B. 国际单位制七个基本单位<\/h3>\n<table><thead><tr><th>物理量<\/th><th>单位<\/th><th>符号<\/th><\/tr><\/thead><tbody><tr><td>长度<\/td><td>米<\/td><td>m<\/td><\/tr><tr><td>质量<\/td><td>千克<\/td><td>kg<\/td><\/tr><tr><td>时间<\/td><td>秒<\/td><td>s<\/td><\/tr><tr><td>电流<\/td><td>安培<\/td><td>A<\/td><\/tr><tr><td>热力学温度<\/td><td>开尔文<\/td><td>K<\/td><\/tr><tr><td>物质的量<\/td><td>摩尔<\/td><td>mol<\/td><\/tr><tr><td>发光强度<\/td><td>坑德拉<\/td><td>cd<\/td><\/tr><\/tbody><\/table>\n<p>常用前缀：k = 10³，M = 10⁶，G = 10⁹；m = 10⁻³，μ = 10⁻⁶，n = 10⁻⁹。<\/p>\n<h3 id=\"c-重要物理学家与贡献\">C. 重要物理学家与贡献<\/h3>\n<table><thead><tr><th>人物<\/th><th>主要贡献<\/th><\/tr><\/thead><tbody><tr><td>阿基米德<\/td><td>浮力原理、杠杆原理<\/td><\/tr><tr><td>伽利略<\/td><td>理想斜面实验，推翻「力是维持运动的原因」<\/td><\/tr><tr><td>牛顿<\/td><td>运动三定律、万有引力定律、光的色散<\/td><\/tr><tr><td>开普勒<\/td><td>行星运动三定律<\/td><\/tr><tr><td>卡文迪许<\/td><td>扭秤实验测引力常量<\/td><\/tr><tr><td>库仑<\/td><td>库仑定律<\/td><\/tr><tr><td>奥斯特<\/td><td>电流的磁效应<\/td><\/tr><tr><td>法拉第<\/td><td>电磁感应、提出「场」的概念<\/td><\/tr><tr><td>麦克斯韦<\/td><td>电磁场理论，预言电磁波<\/td><\/tr><tr><td>焦耳<\/td><td>热功当量、焦耳定律<\/td><\/tr><tr><td>普朗克<\/td><td>能量子假说<\/td><\/tr><tr><td>爱因斯坦<\/td><td>光子说、相对论、质能方程<\/td><\/tr><tr><td>卢瑟福<\/td><td>原子核式模型、发现质子<\/td><\/tr><tr><td>玻尔<\/td><td>氢原子能级模型<\/td><\/tr><\/tbody><\/table>\n<h3 id=\"d-必做实验清单\">D. 必做实验清单<\/h3>\n<p><strong>初中<\/strong><\/p>\n<ul><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 测量平均速度（斜面小车）<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究平面镜成像特点<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究凸透镜成像规律<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究晶体熔化、水的沸腾<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 用天平和量筒测密度<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究影响滑动摩擦力的因素<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究液体压强、浮力大小的因素<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究杠杆平衡条件、测滑轮组机械效率<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 比较不同物质吸热能力<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究电流与电压、电阻的关系；伏安法测电阻、测小灯泡电功率<\/p><\/li><\/ul>\n<p><strong>高中<\/strong><\/p>\n<ul><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 纸带测匀变速直线运动加速度<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究弹簧弹力与形变量的关系<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 验证力的平行四边形定则<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 探究加速度与力、质量的关系<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 研究平抛运动、探究向心力<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 验证机械能守恒、验证动量守恒<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 用单摆测重力加速度<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 测金属丝电阻率、描绘小灯泡伏安特性曲线<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 测电源电动势和内阻、练习使用多用电表<\/p><\/li><li data-checked=\"false\"><p><input type=\"checkbox\" disabled> 用油膜法估测分子大小、测玻璃折射率、用双缝干涉测光的波长<\/p><\/li><\/ul>\n<h3 id=\"e-学习方法\">E. 学习方法<\/h3>\n<ol><li><p>先懂概念，再记公式：每个公式都要说得出各字母的含义、单位和适用条件。<\/p><\/li><li><p>画图是第一步：受力图、运动过程图、电路图、光路图。<\/p><\/li><li><p>解题时按「力→能→动量」三大观点依次尝试，涉及时间用牛顿定律或动量，涉及位移用动能定理。<\/p><\/li><li><p>建立错题本，按「概念错、模型错、计算错」分类。<\/p><\/li><li><p>联系生活做估算：一个鸡蛋约 0.5 N，中学生约 500 N、步行约 1.1 m/s，家用空调功率约 1000 W。<\/p><\/li><\/ol>\n", "extras": [{"mode": "end", "at": 3, "md": "### 电路故障与动态电路分析\n\n- 故障判断先看电流表：电流表有示数说明电路是通路，故障多为某处短路；电流表无示数说明电路断路。\n- 再看电压表：串联电路中，电压表有示数且接近电源电压，说明与电压表并联的部分断路（或另一部分短路）；电压表无示数，说明与它并联的部分短路，或电压表以外的部分断路。\n- 用导线或电压表逐段检查：导线并在哪段时其他用电器恢复工作，哪段就断路。\n- 动态电路分析顺序：滑片移动 → 接入电阻变化 → 总电阻变化 → 总电流变化（I = U/R）→ 定值电阻两端电压变化（U = IR）→ 滑动变阻器两端电压变化（U滑 = U总 − U定）。\n- 并联电路中各支路互不影响：一个支路电阻变化，另一支路电流不变，干路电流随之变化。\n- 电表的替换：理想电流表相当于导线，理想电压表相当于断路；看不清电路时先把电流表换成导线、把电压表去掉，画出简化电路图。\n\n### 电学计算方法\n\n- 比例法：串联电路中电压、电功率与电阻成正比；并联电路中电流、电功率与电阻成反比。\n- 灯泡问题先求电阻：R = U额² / P额，一般认为灯丝电阻不变。“6 V 3 W”的灯泡电阻为 12 Ω，额定电流 0.5 A。\n- 实际功率：P实 = U实² / R。电压变为额定电压的一半，实际功率变为额定功率的 1/4。\n- 电热器多挡位：电源电压不变时，总电阻越小功率越大，挡位越高。两电阻串联为低温挡，并联为高温挡，只接一个为中温挡。\n- 电能表计算：转盘转数 n、参数 N r/(kW·h)，则消耗电能 W = n/N kW·h；功率 P = W/t。\n\n### 例题精选\n\n**例 1（比热容）**：把 2 kg 的水从 20 ℃ 加热到 70 ℃，水吸收多少热量？若用热值为 4.2 × 10⁷ J/kg 的天然气加热，效率 50%，需要多少天然气？\n\n- Q吸 = cmΔt = 4.2 × 10³ × 2 × 50 = 4.2 × 10⁵ J；Q放 = Q吸 / η = 8.4 × 10⁵ J；m = Q放 / q = 0.02 kg。\n\n**例 2（串联分压）**：电源电压 12 V，R₁ = 10 Ω 与滑动变阻器 R₂ 串联，电压表测 R₁ 两端电压，示数为 4 V，求电流和 R₂ 接入的阻值。\n\n- I = U₁ / R₁ = 0.4 A；U₂ = 12 − 4 = 8 V；R₂ = U₂ / I = 20 Ω。\n\n**例 3（电热器挡位）**：某电饭锅额定电压 220 V，高温挡 1100 W，低温挡 440 W，电路由 R₁ 单独工作（高温）或 R₁ 与 R₂ 串联（低温）组成，求 R₁、R₂。\n\n- R₁ = U² / P高 = 220² / 1100 = 44 Ω；R总 = 220² / 440 = 110 Ω；R₂ = 110 − 44 = 66 Ω。\n\n**例 4（电动机）**：电动机线圈电阻 2 Ω，接在 220 V 电压下正常工作，电流 5 A，求 1 min 内消耗的电能、产生的热量和得到的机械能。\n\n- W = UIt = 220 × 5 × 60 = 6.6 × 10⁴ J；Q = I²Rt = 25 × 2 × 60 = 3000 J；E机 = W − Q = 6.3 × 10⁴ J。电动机正常工作时不能用 I = U/R。"}, {"mode": "end", "at": 4, "md": "### 经典模型\n\n| 模型 | 关键点 |\n| --- | --- |\n| 连接体 | 先整体求加速度 a = F / (m₁ + m₂)，再隔离求内力；光滑水平面上推力 F 推两物块，两物块间作用力 F₁₂ = m₂F / (m₁ + m₂) |\n| 板块模型 | 判断是否相对滑动：假设一起运动，求出所需静摩擦力，与最大静摩擦力比较；相对滑动时分别对两物体用牛顿第二定律，抓住速度相等的时刻 |\n| 传送带 | 物体速度小于带速时摩擦力沿带运动方向，加速到与带同速后可能一起匀速（水平）；倾斜传送带上还要比较 μ 与 tanθ |\n| 弹簧模型 | 弹簧弹力不能突变，轻绳、轻杆弹力可以突变；剪断瞬间，与弹簧相连的物体加速度看剩余力 |\n| 竖直面圆周运动 | 轻绳模型最高点 v ≥ √(gr)；轻杆模型最高点 v ≥ 0，v = √(gr) 时杆无作用力 |\n| 水平面圆周运动 | 汽车转弯由静摩擦力提供向心力；火车转弯按设计速度行驶时由重力和支持力的合力提供向心力 |\n| 天体运动 | 万有引力提供向心力；变轨时在切点加速进入高轨道，同一点上卫星在不同轨道的加速度相同 |\n| 机车启动 | 恒定功率启动：a 逐渐减小，最终 vₘ = P / f；恒定加速度启动：先匀加速到功率达额定值，再变加速到 vₘ |\n| 碰撞 | 弹性碰撞动能守恒；完全非弹性碰撞后共速，动能损失最大；碰撞后不可能“穿越”对方 |\n| 子弹打木块 | 动量守恒求共同速度；系统产生的热量 Q = f · s相对 |\n\n### 功能关系与能量观点\n\n| 力做的功 | 对应的能量变化 |\n| --- | --- |\n| 合力做功 | 动能变化：W合 = ΔEₖ |\n| 重力做功 | 重力势能变化：W_G = −ΔEₚ |\n| 弹簧弹力做功 | 弹性势能变化：W弹 = −ΔEₚ弹 |\n| 除重力、弹力以外其他力做功 | 机械能变化：W其他 = ΔE机 |\n| 一对滑动摩擦力做功之和 | 系统内能增加：Q = f · s相对 |\n| 电场力做功 | 电势能变化：W电 = −ΔEₚ电 |\n| 安培力做功（克服） | 电能变化，最终转化为焦耳热 |\n\n- 三大观点选用：涉及时间和加速度用牛顿运动定律；涉及位移和速度不涉及时间用动能定理；系统内物体相互作用（碰撞、反冲、爆炸）用动量守恒；有摩擦生热时用能量守恒。\n- 动能定理是标量式，不需要分解方向；动量守恒是矢量式，必须先规定正方向。\n\n### 例题精选\n\n**例 1（刹车陷阱）**：汽车以 20 m/s 行驶，刹车加速度大小 5 m/s²，求刹车后 6 s 内的位移。\n\n- 停车时间 t₀ = v₀ / a = 4 s < 6 s，所以 6 s 内位移就是 4 s 内的位移：x = v₀² / (2a) = 40 m，不是 v₀t − ½at² = 30 m。\n\n**例 2（斜面上的物体）**：质量 2 kg 的物体沿倾角 37° 的粗糙斜面下滑，μ = 0.5，求加速度。（g = 10 m/s²，sin37° = 0.6，cos37° = 0.8）\n\n- mg sinθ − μmg cosθ = ma，a = g(sinθ − μ cosθ) = 10 × (0.6 − 0.4) = 2 m/s²，沿斜面向下。\n\n**例 3（平抛）**：从 20 m 高处以 15 m/s 水平抛出一个小球，求落地时间、水平位移和落地速度。\n\n- t = √(2h/g) = 2 s；x = v₀t = 30 m；v_y = gt = 20 m/s，v = √(15² + 20²) = 25 m/s，与水平方向夹角 θ 满足 tanθ = 4/3。\n\n**例 4（卫星）**：地球表面重力加速度为 g、半径为 R，求近地卫星的环绕速度和距地面高度为 R 的卫星的周期。\n\n- 近地：mg = mv²/R，v = √(gR) ≈ 7.9 km/s。高度 R 处：GMm/(2R)² = m(2π/T)²(2R)，结合 GM = gR²，得 T = 4π√(2R/g)。\n\n**例 5（动量与能量）**：质量 m 的小球以速度 v₀ 与静止的质量为 2m 的小球发生弹性正碰，求碰后两球速度。\n\n- 由动量守恒和动能守恒：v₁ = (m − 2m)v₀ / 3m = −v₀/3（反弹），v₂ = 2mv₀ / 3m = 2v₀/3。"}, {"mode": "end", "at": 5, "md": "### 带电粒子在电场和磁场中的运动\n\n- 加速：qU = ½mv² − ½mv₀²，适用于任何电场（匀强或非匀强）。\n- 偏转（类平抛）：沿板方向匀速，垂直板方向初速度为零的匀加速；射出时速度反向延长线交于板长中点。不同粒子经同一电场加速、再经同一电场偏转，轨迹相同。\n- 示波管：电子枪加速 → 偏转电极 → 荧光屏；YY′ 加信号电压，XX′ 加扫描电压。\n- 磁场中匀速圆周运动三步法：\n    1. 定圆心：两个速度方向的垂线交点，或一条速度垂线与弦的中垂线交点\n    2. 求半径：几何关系（勾股定理、三角函数）结合 r = mv/(qB)\n    3. 算时间：t = θ/(2π) · T，θ 为圆心角，等于速度偏转角\n- 有界磁场常见结论：粒子沿径向射入圆形磁场，必沿径向射出；从直线边界射入和射出时，速度与边界的夹角相等。\n- 复合场：速度选择器 qE = qvB，v = E/B，与粒子电性和电量无关；质谱仪先加速再偏转，r = (1/B)√(2mU/q)；回旋加速器最大动能 Eₖₘ = q²B²R²/(2m)，与加速电压无关；磁流体发电机和电磁流量计都利用 qvB = qU/d 求电动势。\n- 带电小球在复合场中做匀速圆周运动：重力与电场力平衡，洛伦兹力提供向心力。\n\n### 电磁感应综合模型\n\n| 模型 | 分析要点 |\n| --- | --- |\n| 单杆切割（有外力 F） | E = BLv，I = BLv/R总，安培力 F安 = B²L²v/R总；a = (F − F安)/m 逐渐减小，最终匀速：vₘ = FR总/(B²L²) |\n| 单杆以初速度滑行（无外力） | 做加速度减小的减速运动直到停止；动量定理 −BLq = 0 − mv₀，可求通过的电荷量 q = mv₀/(BL) |\n| 双杆模型（光滑等宽导轨） | 系统合外力为零时动量守恒，最终共速；损失的动能转化为焦耳热 |\n| 线框进出磁场 | 进入时磁通量增加、离开时减小，电流方向相反；完全在磁场内时无感应电流 |\n| 电荷量计算 | q = ΔΦ / R总（与时间和速度无关） |\n| 焦耳热计算 | 恒定电流用 Q = I²Rt；变化电流用能量守恒 Q = W外 − ΔEₖ，或用克服安培力做的功 |\n\n- 图像题：先判断各段电流方向（楞次定律或右手定则），再判断大小变化（E = BLv 或 E = nΔΦ/Δt），最后看起止时刻。\n- 自感：通电瞬间线圈阻碍电流增大，与它串联的灯泡逐渐变亮；断电瞬间线圈相当于电源，与它组成回路的灯泡闪亮一下的条件是断电前线圈电流大于灯泡电流。\n\n### 传感器\n\n- 传感器把非电学量（温度、光照、力、磁场）转换为电学量（电压、电流、电阻），便于测量和控制。\n- 热敏电阻：负温度系数热敏电阻温度升高时电阻减小；金属热电阻温度升高时电阻增大。\n- 光敏电阻：光照越强电阻越小。\n- 霍尔元件：把磁感应强度转化为电压，U_H = kIB/d。\n- 应变片、电容式传感器（压力改变极板间距）、干簧管（磁控开关）、双金属片（温控开关）。\n- 应用电路分析：传感器电阻变化 → 电路电流变化 → 电磁继电器吸合或断开 → 控制执行电路。\n\n### 例题精选\n\n**例 1（电场加速与偏转）**：电子由静止经 U₁ 加速后，垂直进入板长 L、间距 d、电压 U₂ 的偏转电场，求射出时的偏移量。\n\n- 由 eU₁ = ½mv₀² 和 y = ½ · (eU₂/(md)) · (L/v₀)²，得 y = U₂L² / (4U₁d)，与电子的质量和电荷量无关。\n\n**例 2（闭合电路）**：电源电动势 E = 6 V，内阻 r = 1 Ω，外电阻 R = 5 Ω，求电流、路端电压和电源效率。\n\n- I = E/(R + r) = 1 A；U = IR = 5 V；η = U/E ≈ 83.3%。外电阻等于内阻时电源输出功率最大，此时效率只有 50%。\n\n**例 3（磁场中的圆周运动）**：质子以速度 v 垂直进入磁感应强度为 B 的匀强磁场，若速度加倍，半径和周期如何变化？\n\n- r = mv/(qB) 加倍；T = 2πm/(qB) 不变。周期与速度无关，这是回旋加速器的工作基础。\n\n**例 4（导体棒）**：电阻不计的光滑导轨宽 L = 0.5 m，接电阻 R = 2 Ω，B = 1 T，导体棒在恒力 F = 0.5 N 作用下由静止开始运动，求最大速度。\n\n- 匀速时 F = B²L²vₘ/R，vₘ = FR/(B²L²) = 0.5 × 2 / 0.25 = 4 m/s。"}, {"mode": "end", "at": 6, "md": "### 气体实验定律与图像\n\n| 定律 | 条件 | 表达式 | 图像特点 |\n| --- | --- | --- | --- |\n| 玻意耳定律 | 温度不变 | p₁V₁ = p₂V₂ | p–V 图为双曲线，离原点越远温度越高 |\n| 查理定律 | 体积不变 | p₁/T₁ = p₂/T₂ | p–T 图为过原点的直线，斜率越小体积越大 |\n| 盖—吕萨克定律 | 压强不变 | V₁/T₁ = V₂/T₂ | V–T 图为过原点的直线，斜率越小压强越大 |\n| 理想气体状态方程 | 一定质量 | p₁V₁/T₁ = p₂V₂/T₂ | — |\n\n- 计算时温度必须用热力学温度 T（K）。\n- 封闭气体压强的求法：液柱封闭时取液柱为研究对象列平衡式；活塞封闭时对活塞受力分析。开口向上的玻璃管中，气体压强 p = p₀ + ρgh。\n- 热力学第一定律符号：外界对气体做功 W > 0，气体吸热 Q > 0，内能增加 ΔU > 0。理想气体等温过程 ΔU = 0；绝热过程 Q = 0；体积增大时气体对外做功 W < 0。\n\n### 几何光学计算与光的波动性\n\n- 折射率与光速：n = c/v；光从介质射向空气时临界角 sinC = 1/n。\n- 解题步骤：画光路图 → 找入射角、折射角（与法线的夹角）→ 判断是否发生全反射 → 用几何关系求长度或时间。\n- 同一介质对紫光折射率最大，紫光偏折最明显、临界角最小、在介质中传播速度最小。\n- 双缝干涉：Δx = Lλ/d。红光条纹间距大于紫光；白光干涉中央为白色条纹，两侧为彩色条纹。\n- 薄膜干涉：两表面反射光叠加；肥皂膜上的条纹是水平的；增透膜厚度为光在膜中波长的 1/4。\n- 明显衍射条件：障碍物或孔的尺寸与波长相当或比波长小。单缝衍射条纹中央最宽最亮，两侧窄而暗，与双缝干涉的等间距条纹不同。\n- 光的偏振说明光是横波；激光的应用：光纤通信（相干性好）、激光测距（平行度好）、激光切割（亮度高）。\n\n### 光电效应与原子核计算\n\n- 光电效应规律：存在截止频率；最大初动能随入射光频率增大而增大，与光强无关；光电流饱和值与光强成正比；光电效应几乎是瞬时的。\n- 爱因斯坦光电效应方程与遏止电压：\n\n```latex\nE_k = h\\nu - W_0,\\qquad eU_c = E_k\n```\n\n- Eₖ–ν 图像：斜率为普朗克常量 h，横轴截距为截止频率 ν_c，纵轴截距的绝对值为逸出功 W₀。U_c–ν 图像的斜率为 h/e。\n- 核反应方程遵守质量数守恒和电荷数守恒（质量并不守恒）。常见粒子：α 粒子 ⁴₂He，β 粒子 ⁰₋₁e，质子 ¹₁H，中子 ¹₀n，正电子 ⁰₊₁e。\n- 衰变次数计算：先由质量数变化求 α 衰变次数（每次质量数减 4），再由电荷数变化求 β 衰变次数。例：²³⁸₉₂U 衰变为 ²⁰⁶₈₂Pb，α 衰变 8 次，β 衰变 6 次。\n- 质能方程：ΔE = Δmc²；1 u 的质量亏损对应约 931.5 MeV 的能量。\n- 重核裂变：²³⁵U 吸收中子后裂变并放出 2–3 个中子，形成链式反应，用于核电站（控制棒吸收中子控制反应速度）。轻核聚变：氘和氚聚变为氦，需要几百万开尔文以上的高温，太阳能量来源于此。"}, {"mode": "before", "at": 8, "md": "## 第八部分 物理实验与探究方法\n\n物理实验题的核心是三件事：读准仪器、选对电路、处理好数据。每个实验都要能说出原理、器材、步骤、数据处理和误差来源。\n\n### 科学探究方法\n\n| 方法 | 含义 | 典型实例 |\n| --- | --- | --- |\n| 控制变量法 | 研究多个因素时，每次只改变一个 | 探究压力作用效果、影响电阻的因素、加速度与力和质量的关系 |\n| 转换法 | 把不易观察的量转换为易观察的量 | 用海绵凹陷程度显示压力效果；用温度计示数变化显示电热多少；用木块被撞距离显示动能大小 |\n| 等效替代法 | 用效果相同的量替代 | 平面镜成像中用另一支蜡烛替代像；合力与分力；等效电阻 |\n| 理想模型法 | 抓主要因素，忽略次要因素 | 质点、点电荷、光线、磁感线、理想气体 |\n| 理想实验法（科学推理法） | 在实验基础上合理外推 | 伽利略斜面实验推出牛顿第一定律；真空不能传声 |\n| 类比法 | 用熟悉的事物理解陌生事物 | 用水流类比电流、水压类比电压 |\n| 微元法 | 把过程分成很多小段 | v–t 图像面积表示位移；变力做功 |\n| 放大法 | 把微小变化放大 | 卡文迪许扭秤测引力常量；观察桌面微小形变 |\n| 比值定义法 | 用两个量的比值定义新量 | 速度、密度、压强、电阻、电场强度、电容 |\n\n### 基本仪器的读数\n\n| 仪器 | 精确度 | 读数要点 |\n| --- | --- | --- |\n| 刻度尺 | 分度值 1 mm | 估读到分度值的下一位，如 2.35 cm |\n| 游标卡尺 | 10 分度 0.1 mm，20 分度 0.05 mm，50 分度 0.02 mm | 主尺读数 + 对齐格数 × 精确度，不估读 |\n| 螺旋测微器 | 0.01 mm | 固定刻度（注意半毫米刻线）+ 可动刻度格数（估读一位）× 0.01 mm，结果以 mm 为单位保留三位小数 |\n| 电流表、电压表 | 看量程和分度值 | 分度值为 1、0.1、0.01 时估读到下一位；分度值为 2 或 5 的，在同一位估读 |\n| 多用电表欧姆挡 | — | 读数 = 指针示数 × 倍率；指针在中央附近时最准确 |\n| 秒表 | 0.1 s | 小盘读分钟，大盘读秒，不估读 |\n\n- 误差：系统误差来自仪器、原理不完善，多次测量不能减小，要改进实验方法；偶然误差来自偶然因素，多次测量取平均可减小。\n- 有效数字：从第一个不为零的数字算起；测量结果末位是估读位。\n\n### 力学实验要点\n\n- 打点计时器：电磁打点计时器用约 8 V 交流电，电火花计时器用 220 V 交流电；频率 50 Hz 时打点间隔 0.02 s。先接通电源，后释放纸带。\n- 纸带处理：某点瞬时速度 = 相邻两段的平均速度；加速度用逐差法：a = [(x₄ + x₅ + x₆) − (x₁ + x₂ + x₃)] / (9T²)。\n- 探究弹簧弹力与形变量的关系：弹力不能超过弹性限度；F–x 图像斜率为劲度系数。\n- 验证力的平行四边形定则：两次把结点拉到同一位置 O（等效替代）；记录力的大小和方向。\n- 探究加速度与力、质量的关系：先平衡摩擦力（不挂钩码时小车匀速）；钩码质量远小于小车质量时，绳的拉力近似等于钩码重力；作 a–1/M 图像得直线。\n- 验证机械能守恒：重物选密度大的；不需要测质量；因有阻力，减少的重力势能略大于增加的动能。\n- 验证动量守恒：入射球质量大于被碰球，防止反弹；小球从同一高度静止释放；用平抛水平位移代替速度。\n- 用单摆测重力加速度：摆角小于 5°；从平衡位置开始计时；摆长 = 摆线长 + 小球半径；g = 4π²L/T²，作 T²–L 图像斜率为 4π²/g。\n\n### 电学实验要点\n\n- 伏安法的接法：R_x ≫ R_A 时用电流表内接（测量值偏大），R_x ≪ R_V 时用电流表外接（测量值偏小），口诀“大内偏大，小外偏小”。临界判断：R_x > √(R_A R_V) 用内接。\n- 滑动变阻器的接法：要求电压从零开始调节、或变阻器阻值远小于待测电阻时，用分压式；其余情况可用限流式，限流式更省电。\n- 测电源电动势和内阻：常用电流表相对电源外接；U–I 图像纵截距为 E，斜率绝对值为 r；该接法测得的 E 和 r 都偏小。\n- 描绘小灯泡伏安特性曲线：分压式、外接法；曲线弯向电压轴，说明灯丝电阻随温度升高而增大。\n- 测金属丝电阻率：螺旋测微器测直径，刻度尺测接入长度，ρ = πd²R/(4L)。\n- 多用电表：电流“红进黑出”；欧姆挡每次换挡后都要重新欧姆调零；测电阻时要断开电路；用完后旋到 OFF 挡或交流电压最高挡。指针偏角太小说明电阻大，应换大倍率挡。\n- 电表改装：小量程电流表串联大电阻改装成电压表，并联小电阻改装成大量程电流表。\n\n### 热学与光学实验要点\n\n- 用油膜法估测分子大小：d = V/S；V 是一滴油酸酒精溶液中纯油酸的体积；数方格时不足半格舍去、多于半格算一格。\n- 探究气体等温变化的规律：缓慢推动活塞，保持温度不变；作 p–1/V 图像为过原点的直线。\n- 测玻璃的折射率：插针法，n = sinθ₁ / sinθ₂；入射角不宜过大或过小。\n- 用双缝干涉测光的波长：λ = dΔx/L；测出 n 条亮纹间距 a，则 Δx = a/(n − 1)。"}, {"mode": "end", "at": 8, "md": "### 高中物理公式速查\n\n| 板块 | 公式 |\n| --- | --- |\n| 匀变速直线运动 | v = v₀ + at；x = v₀t + ½at²；v² − v₀² = 2ax；Δx = aT² |\n| 牛顿定律 | F合 = ma；f = μF_N |\n| 圆周运动 | v = ωr；a = v²/r = ω²r；F = mv²/r；T = 2πr/v |\n| 万有引力 | F = GMm/r²；GM = gR²；v = √(GM/r)；T = 2π√(r³/GM) |\n| 功和能 | W = Fl cosα；P = Fv；Eₖ = ½mv²；Eₚ = mgh；W合 = ΔEₖ |\n| 动量 | p = mv；I = Ft；Ft = Δp；m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′ |\n| 振动和波 | T = 2π√(L/g)；v = λf = λ/T |\n| 静电场 | F = kQq/r²；E = F/q；E = U/d；U_AB = W_AB/q；C = Q/U = εS/(4πkd) |\n| 恒定电流 | I = q/t；R = ρL/S；I = E/(R + r)；P = UI；Q = I²Rt |\n| 磁场 | F = BIL；f = qvB；r = mv/(qB)；T = 2πm/(qB) |\n| 电磁感应 | E = nΔΦ/Δt；E = BLv；E = ½BL²ω；q = ΔΦ/R |\n| 交变电流 | Eₘ = nBSω；E = Eₘ/√2；U₁/U₂ = n₁/n₂；I₁/I₂ = n₂/n₁ |\n| 电磁振荡 | T = 2π√(LC)；c = λf |\n| 热学 | pV/T = C；ΔU = W + Q |\n| 光学 | n = sinθ₁/sinθ₂ = c/v；sinC = 1/n；Δx = Lλ/d |\n| 近代物理 | ε = hν；Eₖ = hν − W₀；λ = h/p；hν = Eₘ − Eₙ；ΔE = Δmc² |"}], "parts": [["导读", "导读"], ["小学", "小学科学中的物理"], ["初中", "运动、声、光、热现象与密度"], ["初中", "力、压强、浮力、机械与能"], ["初中", "内能、电学、电与磁、能源"], ["高中", "力学"], ["高中", "电磁学"], ["高中", "热学、光学与近代物理"], ["实验", "物理实验与探究方法"], ["附录", "附录"]]}, "chemistry": {"title": "化学知识大全", "format": "md", "content": "## 使用说明\n\n本书按学段由浅入深排列：小学科学建立“物质会变化”的直觉，初中学会用化学用语描述物质和反应，高中再用“物质的量、结构、能量、平衡”定量地解释反应。内容依据人教版课程标准的主干知识整理，各地教材顺序可能略有不同。\n\n| 学段 | 核心问题 | 对应章节 |\n| --- | --- | --- |\n| 小学科学（3–6 年级） | 物质有哪些状态？什么是化学变化？ | 第 1 章 |\n| 初中（9 年级为主） | 物质由什么构成？反应怎样用方程式表示？ | 第 2–5 章 |\n| 高中必修 | 反应中有多少粒子？元素性质为何有规律？ | 第 6–9 章 |\n| 高中选择性必修 | 反应放多少热、多快、进行到什么程度？有机物如何转化？ | 第 10–12 章 |\n| 贯穿各学段 | 怎样安全地做实验、检验物质？ | 第 13 章、附录 |\n\n学习建议：先读每章开头一句的结论，再看表格；方程式要会写、会配平，并能说出反应条件和现象。\n\n## 第 1 章 小学科学中的化学启蒙\n\n小学阶段只需要分清两件事：物质有固、液、气三种状态；变化分为没有生成新物质的变化和生成新物质的变化。\n\n### 1.1 物质的三态与变化\n\n| 状态 | 形状 | 体积 | 例子 |\n| --- | --- | --- | --- |\n| 固态 | 固定 | 固定 | 冰、铁块、食盐 |\n| 液态 | 随容器改变 | 固定 | 水、食用油 |\n| 气态 | 随容器改变 | 可压缩 | 水蒸气、空气 |\n\n- 熔化（固→液）、凝固（液→固）、汽化（液→气，包括蒸发和沸腾）、液化（气→液）、升华（固→气）、凝华（气→固）。\n- 水在标准大气压下 0 ℃ 结冰、100 ℃ 沸腾。\n\n### 1.2 物理变化与化学变化\n\n- 物理变化：没有产生新物质，如冰融化、纸被撕碎、盐溶于水。\n- 化学变化：产生了新物质，常伴有发光、放热、变色、产生气体或沉淀等现象，如铁生锈、蜡烛燃烧、小苏打加白醋冒泡。\n- 判断依据是“有没有新物质”，不是看有没有现象。例如灯泡发光放热属于物理变化。\n\n### 1.3 溶解与混合物分离\n\n- 溶解：食盐、白糖能溶于水，沙子、面粉不能。搅拌、加热、把颗粒弄碎都能加快溶解。\n- 一定量的水只能溶解有限的物质，这是初中“溶解度”的前身。\n- 分离方法：过滤除去不溶物（沙子），蒸发从溶液中得到溶质（食盐），磁铁吸出铁粉。\n\n### 1.4 空气、水与常见材料\n\n- 空气是混合物，占据空间、有质量；燃烧需要氧气，熄灭蜡烛的方法都是隔绝空气或降低温度。\n- 水循环：蒸发→凝结成云→降水→汇流，属于物理变化。\n- 常见材料：金属导电导热，塑料、木头、陶瓷一般不导电；铁在潮湿空气中易生锈，油漆、涂油可防锈。\n- 酸碱指示：紫甘蓝汁遇酸（白醋）变红，遇碱（肥皂水、小苏打水）变蓝绿。\n\n## 第 2 章 初中：物质的构成与化学用语\n\n物质由分子、原子或离子构成；元素符号、化学式和化合价是描述它们的基本语言。\n\n### 2.1 构成物质的微粒\n\n| 微粒 | 定义 | 由它构成的物质 |\n| --- | --- | --- |\n| 分子 | 保持物质化学性质的最小微粒 | H₂O、O₂、CO₂ |\n| 原子 | 化学变化中的最小微粒 | 金属（Fe、Cu）、稀有气体（He）、金刚石 C |\n| 离子 | 带电的原子或原子团 | NaCl（Na⁺ 和 Cl⁻） |\n\n- 微粒的特点：很小、不断运动（闻到花香）、微粒间有间隔（气体易压缩）。温度越高，运动越快。\n- 原子由原子核（质子 + 中子）和核外电子构成。核电荷数 = 质子数 = 核外电子数 = 原子序数。\n- 相对原子质量 ≈ 质子数 + 中子数。\n- 原子得到电子成为阴离子，失去电子成为阳离子。最外层 8 个电子（只有一层时为 2 个）是稳定结构。\n\n### 2.2 元素与元素符号\n\n- 元素：质子数（核电荷数）相同的一类原子的总称。元素只讲种类，不讲个数。\n- 地壳中含量前四位：O > Si > Al > Fe。人体中最多的元素是 O，最多的金属元素是 Ca。\n- 元素符号的意义：“Fe”表示铁元素、一个铁原子，还表示铁这种物质。“2Fe”只表示 2 个铁原子。\n- 前 20 号元素：H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca（口诀“氢氦锂铍硼，碳氮氧氟氖，钠镁铝硅磷，硫氯氩钾钙”）。\n\n### 2.3 化学式与化合价\n\n- 化合物中各元素正负化合价的代数和为 0；单质中元素化合价为 0。\n- 写化学式：正价在前、负价在后，化合价交叉约简。例：Al 为 +3、O 为 −2，得 Al₂O₃。\n- 符号中数字的含义：2H₂O 中，前面的 2 表示 2 个水分子，右下角的 2 表示每个水分子含 2 个氢原子；Mg²⁺ 的 2+ 表示一个镁离子带 2 个单位正电荷。\n- 相对分子质量 = 各原子相对原子质量之和。例：CO₂ = 12 + 16 × 2 = 44。\n- 元素质量分数 = 该元素原子的相对原子质量 × 原子个数 ÷ 相对分子质量。\n\n常见化合价口诀：一价钾钠银氢，二价钙镁钡锌，三铝四硅五价磷，二三铁、二四碳，二四六硫都齐全，铜汞二价最常见，氧为负二。常见原子团见附录。\n\n### 2.4 物质的分类\n\n- 混合物：由两种或多种物质组成，如空气、海水、合金。\n- 纯净物：只由一种物质组成。\n  - 单质：同种元素组成，分金属单质（Fe）和非金属单质（O₂、C）。\n  - 化合物：不同种元素组成，分为氧化物（CO₂）、酸（HCl）、碱（NaOH）、盐（NaCl），以及有机物（CH₄）。\n- 氧化物：由两种元素组成且其中一种是氧元素的化合物。KMnO₄ 含氧但不是氧化物。\n\n## 第 3 章 初中：质量守恒与化学方程式\n\n化学反应前后原子的种类、数目和质量都不变，所以反应物总质量等于生成物总质量；化学方程式就是按这个规律写出的。\n\n### 3.1 质量守恒定律\n\n- 六个不变：原子种类、数目、质量；元素种类、质量；物质总质量。\n- 两个一定变：分子种类、物质种类。分子数目可能变。\n- 验证实验若有气体参加或生成，必须在密闭容器中进行。\n\n### 3.2 书写与配平\n\n1. 写出反应物和生成物的化学式，中间用短线连接。\n2. 配平：只改化学式前的计量数，不改化学式。常用最小公倍数法、奇数配偶法。\n3. 标明条件（点燃、加热、催化剂、通电、高温），短线改为等号。\n4. 标气体↑和沉淀↓：只有反应物中没有气体（或固体）时，生成的气体（或沉淀）才标。\n\n示例：甲烷燃烧 CH₄ + 2O₂ —点燃→ CO₂ + 2H₂O。\n\n### 3.3 四种基本反应类型\n\n| 类型 | 形式 | 例子 |\n| --- | --- | --- |\n| 化合反应 | A + B → AB（多变一） | 2H₂ + O₂ —点燃→ 2H₂O |\n| 分解反应 | AB → A + B（一变多） | 2H₂O —通电→ 2H₂↑ + O₂↑ |\n| 置换反应 | A + BC → AC + B（单质换单质） | Fe + CuSO₄ = FeSO₄ + Cu |\n| 复分解反应 | AB + CD → AD + CB（两化合物交换成分） | NaOH + HCl = NaCl + H₂O |\n\n复分解反应发生的条件：生成物中有沉淀、气体或水。CO + CuO —Δ→ Cu + CO₂ 不属于任何一种基本类型。\n\n### 3.4 根据方程式计算\n\n步骤：设未知量 → 写方程式 → 标相关物质的相对分子质量×计量数和已知量 → 列比例式 → 求解作答。\n\n例：分解 34 g H₂O₂ 最多得到 O₂ 多少克？2H₂O₂ = 2H₂O + O₂↑，68 : 32 = 34 g : x，解得 x = 16 g。\n\n溶液计算常用：溶质质量分数 = 溶质质量 ÷ 溶液质量 × 100%；稀释前后溶质质量不变。\n\n## 第 4 章 初中：空气、水、碳与燃烧\n\n空气按体积约含 N₂ 78%、O₂ 21%、稀有气体 0.94%、CO₂ 0.03%；O₂ 助燃、H₂O 由 H 和 O 组成、CO 有毒而 CO₂ 不支持燃烧，是本章的主线。\n\n### 4.1 空气与氧气\n\n- 测定空气中氧气含量：红磷燃烧 4P + 5O₂ —点燃→ 2P₂O₅，冷却后水进入集气瓶约 1/5。结果偏小常因红磷不足、装置漏气或未冷却就打开弹簧夹。\n- 氧气性质：无色无味、不易溶于水、密度略大于空气；能使带火星的木条复燃。\n\n| 物质在氧气中燃烧 | 现象 | 方程式 |\n| --- | --- | --- |\n| 木炭 | 发出白光，生成使石灰水变浑浊的气体 | C + O₂ —点燃→ CO₂ |\n| 硫 | 蓝紫色火焰（空气中为淡蓝色），有刺激性气味 | S + O₂ —点燃→ SO₂ |\n| 红磷 | 大量白烟 | 4P + 5O₂ —点燃→ 2P₂O₅ |\n| 铁丝 | 剧烈燃烧、火星四射，生成黑色固体（瓶底预先放水或细沙） | 3Fe + 2O₂ —点燃→ Fe₃O₄ |\n| 镁条 | 耀眼白光，生成白色固体 | 2Mg + O₂ —点燃→ 2MgO |\n\n实验室制氧气三法：\n\n- 2KMnO₄ —Δ→ K₂MnO₄ + MnO₂ + O₂↑（试管口放一团棉花）\n- 2KClO₃ —MnO₂, Δ→ 2KCl + 3O₂↑\n- 2H₂O₂ —MnO₂→ 2H₂O + O₂↑（不加热，最环保）\n\n催化剂改变反应速率，本身的质量和化学性质在反应前后不变。用排水法收集时，实验结束先把导管移出水面再熄灭酒精灯，防止倒吸。\n\n### 4.2 水\n\n- 电解水：“正氧负氢，氢二氧一”（体积比 2 : 1），证明水由氢、氧两种元素组成。\n- 净水：沉淀（明矾）→ 过滤 → 吸附（活性炭）→ 消毒；蒸馏得到的是纯水。\n- 硬水含较多可溶性钙、镁化合物。加肥皂水泡沫少、浮渣多的是硬水；生活中用煮沸软化。\n- 过滤要点“一贴二低三靠”。\n\n### 4.3 碳和碳的氧化物\n\n- 碳单质：金刚石最硬；石墨软、能导电；C₆₀ 分子形似足球。物理性质差异大，是因为碳原子排列方式不同。\n- 碳的化学性质：常温稳定；可燃；有还原性，C + 2CuO —高温→ 2Cu + CO₂↑。\n\n| 对比 | CO₂ | CO |\n| --- | --- | --- |\n| 物理性质 | 密度比空气大，能溶于水，固体叫干冰 | 密度略小于空气，难溶于水 |\n| 化学性质 | 不燃烧也不支持燃烧；CO₂ + H₂O = H₂CO₃；CO₂ + Ca(OH)₂ = CaCO₃↓ + H₂O | 可燃（蓝色火焰）；有还原性，3CO + Fe₂O₃ —高温→ 2Fe + 3CO₂；有毒 |\n| 用途 | 灭火、人工降雨、气体肥料 | 燃料、冶炼金属 |\n| 实验室制法 | CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑，向上排空气法收集 | 一般不制备 |\n\nCO₂ 增多导致温室效应。不用稀硫酸制 CO₂，因为生成的 CaSO₄ 微溶，会覆盖在大理石表面使反应停止。\n\n### 4.4 燃烧与燃料\n\n- 燃烧三条件：可燃物、氧气（或空气）、温度达到着火点，缺一不可。\n- 灭火原理：清除可燃物、隔绝氧气、降温到着火点以下（着火点本身不能降低）。\n- 化石燃料：煤、石油、天然气（主要成分 CH₄），不可再生。新能源有氢能、太阳能、风能等；氢气燃烧产物只有水。\n- 可燃性气体点燃前必须验纯，防止爆炸。\n\n## 第 5 章 初中：金属、溶液、酸碱盐\n\n金属活动性顺序决定置换反应能否发生，“有沉淀、气体或水生成”决定复分解反应能否发生，这两条是初中化学最常考的判断依据。\n\n### 5.1 金属与金属材料\n\n- 金属活动性顺序：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au（钾钙钠镁铝，锌铁锡铅氢，铜汞银铂金）。\n- 氢前金属能置换稀盐酸、稀硫酸中的氢：Zn + H₂SO₄ = ZnSO₄ + H₂↑。\n- 前面的金属能把后面的金属从其盐溶液中置换出来（K、Ca、Na 除外，它们先与水反应）。\n- 铁与酸或盐溶液置换时生成 +2 价亚铁盐（浅绿色）。\n- 铝耐腐蚀，是因为表面生成致密的 Al₂O₃ 薄膜。\n- 铁生锈需要同时接触 O₂ 和 H₂O；防锈方法有涂油、刷漆、镀层、制成不锈钢。\n- 高炉炼铁：3CO + Fe₂O₃ —高温→ 2Fe + 3CO₂。合金硬度一般比纯金属大、熔点比纯金属低。\n\n### 5.2 溶液与溶解度\n\n- 溶液是均一、稳定的混合物；乳浊液、悬浊液不均一、不稳定。洗洁剂除油属于乳化。\n- 溶解时的热效应：NaOH 固体、浓硫酸溶于水放热；NH₄NO₃ 溶于水吸热；NaCl 溶于水温度几乎不变。\n- 溶解度：在一定温度下，某固体物质在 100 g 溶剂里达到饱和时溶解的质量。\n- 多数固体溶解度随温度升高而增大（KNO₃ 变化大→用降温结晶；NaCl 变化小→用蒸发结晶）；Ca(OH)₂ 随温度升高而减小。\n- 气体溶解度随温度升高而减小、随压强增大而增大。\n- 饱和溶液的溶质质量分数 = S ÷ (100 g + S) × 100%。\n\n### 5.3 酸、碱、盐\n\n| 类别 | 定义（初中） | 常见物质 | 主要性质 |\n| --- | --- | --- | --- |\n| 酸 | 电离出的阳离子全部是 H⁺ | HCl、H₂SO₄、HNO₃、H₂CO₃ | 使紫色石蕊变红；与活泼金属、金属氧化物、碱、某些盐反应 |\n| 碱 | 电离出的阴离子全部是 OH⁻ | NaOH、Ca(OH)₂、NH₃·H₂O | 使石蕊变蓝、酚酞变红；与非金属氧化物、酸、某些盐反应 |\n| 盐 | 由金属离子（或 NH₄⁺）和酸根离子构成 | NaCl、Na₂CO₃、NaHCO₃、CaCO₃、CuSO₄ | 与金属、酸、碱、盐反应 |\n\n- 浓盐酸有挥发性（瓶口白雾）；浓硫酸有吸水性、脱水性和强腐蚀性。稀释浓硫酸：把酸沿器壁慢慢注入水中并不断搅拌，切不可把水倒入酸中。\n- NaOH 俗称烧碱、火碱、苛性钠，易潮解，吸收 CO₂ 而变质：CO₂ + 2NaOH = Na₂CO₃ + H₂O。Ca(OH)₂ 俗称熟石灰、消石灰，由 CaO + H₂O = Ca(OH)₂ 制得。\n- 中和反应：酸 + 碱 → 盐 + 水，实质是 H⁺ + OH⁻ = H₂O。应用：熟石灰改良酸性土壤、氢氧化铝治胃酸过多。\n- pH：< 7 酸性，= 7 中性，> 7 碱性。用 pH 试纸测定时不能湿润试纸。正常雨水 pH 约 5.6，pH < 5.6 为酸雨。\n- 俗名：Na₂CO₃ 纯碱、苏打（水溶液显碱性，但属于盐）；NaHCO₃ 小苏打；CaCO₃ 石灰石、大理石；CaO 生石灰；CuSO₄·5H₂O 胆矾、蓝矾。\n- 常见沉淀：白色 CaCO₃、BaCO₃、BaSO₄、AgCl、Mg(OH)₂；蓝色 Cu(OH)₂；红褐色 Fe(OH)₃。BaSO₄ 和 AgCl 不溶于稀硝酸。\n\n### 5.4 化学与生活\n\n- 六大营养素：蛋白质、糖类、油脂、维生素、无机盐、水。糖类是人体主要供能物质。\n- 微量元素：缺铁→贫血，缺钙→骨质疏松或佝偻病（钙是常量元素），缺碘→甲状腺肿大，缺锌→发育不良。\n- 化肥：氮肥促叶、磷肥促根促果、钾肥抗倒伏。铵态氮肥不能与碱性物质混用，会放出 NH₃ 降低肥效。\n- 材料：塑料、合成纤维、合成橡胶为三大合成材料；羊毛（蛋白质）灼烧有烧焦羽毛味。\n\n## 第 6 章 高中：物质的量\n\n物质的量 n（单位 mol）把宏观的质量、气体体积、溶液浓度和微观的粒子数联系起来，是高中所有化学计算的中心。\n\n```latex\nn = \\frac{N}{N_A} = \\frac{m}{M} = \\frac{V}{V_m} = c \\cdot V_{(aq)}\n```\n\n| 物理量 | 符号 | 单位 | 要点 |\n| --- | --- | --- | --- |\n| 阿伏加德罗常数 | Nₐ | mol⁻¹
